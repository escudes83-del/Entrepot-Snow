<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<link rel="manifest" href="manifest-magasin-ski.webmanifest">
<link rel="icon" href="icon-ski-magasin-v1-192.png">
<link rel="apple-touch-icon" href="icon-ski-magasin-v1-192.png">
<meta name="apple-mobile-web-app-title" content="Mag. Ski">
<title>Magasin Ski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : appli mobile, en-tête sombre type signalétique d'entrepôt, barre d'onglets en bas, plan du U au centre */
:root{
  --bg:#edf1f4; --surface:#ffffff; --surface-2:#f5f8fa; --ink:#17212b; --muted:#5a6876;
  --line:#d2dae1; --line-strong:#9fb0bf; --head:#17212b; --head-ink:#f2f5f7;
  --accent:#e2570f; --accent-ink:#ffffff; --fill:#d6e6f3; --fill-line:#8fb4d3;
  --ok:#2c7d47; --ok-bg:#dcefe2; --warn:#99610d; --warn-bg:#f8ecd3; --bad:#b2322a; --bad-bg:#f6dcd9; --info:#1f5f99; --info-bg:#dbe9f6;
  --hatch:#c9d3dc;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --surface-2:#1d2832; --ink:#e6ecf1; --muted:#94a3b1;
  --line:#2b3844; --line-strong:#4b5e70; --head:#0a0f14; --head-ink:#e6ecf1;
  --accent:#ff7a33; --accent-ink:#1a0d04; --fill:#20384d; --fill-line:#3f6d93;
  --ok:#6fcf8e; --ok-bg:#183a25; --warn:#e7b25a; --warn-bg:#3b2c12; --bad:#f08a80; --bad-bg:#43201d; --info:#7db7ea; --info-bg:#173149;
  --hatch:#2f3d4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --surface-2:#1d2832; --ink:#e6ecf1; --muted:#94a3b1;
  --line:#2b3844; --line-strong:#4b5e70; --head:#0a0f14; --head-ink:#e6ecf1;
  --accent:#ff7a33; --accent-ink:#1a0d04; --fill:#20384d; --fill-line:#3f6d93;
  --ok:#6fcf8e; --ok-bg:#183a25; --warn:#e7b25a; --warn-bg:#3b2c12; --bad:#f08a80; --bad-bg:#43201d; --info:#7db7ea; --info-bg:#173149;
  --hatch:#2f3d4a; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--head);color:var(--head-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;background:var(--accent);transform:skewX(-14deg)}
.role{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--head-ink)}
.role .seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.role .seg button{color:var(--head-ink)}
.role .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

main{max-width:980px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-disp);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{color:var(--muted);margin:0;font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tabs button svg{width:22px;height:22px}
@media (max-width:400px){.tabs button{font-size:11px;padding:10px 2px 12px}.tabs button[aria-current="page"] svg{padding:3px 8px}}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--f-mono);padding:0 5px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:9px 10px;width:100%;box-sizing:border-box;min-width:0}
textarea{resize:vertical;min-height:60px}
.search{font-size:17px;padding:12px 14px !important}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select{width:auto;padding:6px 8px;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.fgrid select{padding:7px 8px;font-size:14px}
.szs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pkb{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.pkb .sz{font:600 14px var(--f-body);padding:8px 10px}.pkb .sz small{margin-left:4px}
.ctrsum{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}.ctrsum .moins b{color:var(--bad,#d1102c)}.ctrsum .ok b{color:#1a7f37}
:root{--c-ok:#3f9a2e;--c-mod:#f0952e;--c-bad:#d8343c;--c-todo:rgba(127,127,127,.18)}.cbub small{color:inherit;opacity:.85}
.cbub{border-width:1.5px}.cbub[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.cdot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong,var(--line));vertical-align:-2px;margin-right:6px;flex:none}
.clegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}.clegend span{display:inline-flex;align-items:center}
.cmod[aria-pressed="true"]{background:#e08a00!important;border-color:#e08a00!important;color:#fff!important}.ce.mod{color:#d17a00}
.ctr{display:grid;grid-template-columns:minmax(0,1fr) 40px 70px 36px 36px 40px;gap:6px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--line)}
.ctr.hd{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--line-strong,var(--line))}
.ctr .cq{text-align:center;font-family:var(--f-mono)}.ctr input.cn{width:100%;box-sizing:border-box;text-align:center;padding:6px 2px}.ctr .cl small{color:var(--muted);font-size:11px}
.ctr.lv0{background:var(--surface-2,rgba(127,127,127,.08));border-radius:6px;margin-top:10px}.ctr.lv1{padding-left:14px;font-weight:600}.ctr.lv2{padding-left:30px}
.ctr .cok{height:34px;border-radius:8px;border:1.5px solid var(--line-strong,var(--line));background:var(--surface);color:var(--muted);font-size:16px;cursor:pointer}.ctr .cok[aria-pressed="true"]{background:#1a7f37;border-color:#1a7f37;color:#fff}
.ce{text-align:center;font-weight:700;font-family:var(--f-mono)}.ce.ok{color:#1a7f37}.ce.plus{color:#1f6fd1}.ce.moins{color:var(--bad,#d1102c)}
.ctr-t{margin-top:14px;font-weight:800;font-size:15px}.ctr-t small{font-weight:400;color:var(--muted)}
@media (max-width:420px){.ctr{grid-template-columns:minmax(0,1fr) 30px 52px 32px 32px 30px;gap:3px}.ctr.lv1{padding-left:6px}.ctr.lv2{padding-left:14px}}
.setmenu{display:flex;flex-direction:column;gap:10px}
.setbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.setbtn:hover{border-color:var(--accent)}.setbtn .si{font-size:22px;width:32px;text-align:center;flex:none}.setbtn b{display:block;font-size:16px}.setbtn small{display:block;color:var(--muted);margin-top:2px}.setbtn .sa{margin-left:auto;font-size:22px;color:var(--muted)}
.sethead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sethead h2{margin:0}
.setnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.setnav .sz{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;justify-content:center;font-family:inherit;font-size:13px;padding:8px 4px;min-width:0}
@media (max-width:420px){.setnav .sz{font-size:12px;padding:8px 2px}.setnav .sic{display:none}}
.dimrow.bxedit{background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:12px;color:var(--ink)}.dimrow.bxedit .dim-in,.dimrow.bxedit select{background:var(--surface-2,var(--bg));color:var(--ink);border:1.5px solid var(--line-strong,var(--line))}
.dimrow.on{background:#fff3c4;border-radius:6px;color:#2b2200;box-shadow:inset 3px 0 0 #e0b400}.dimrow.on>span:not(.bx-a),.dimrow.on>span:not(.bx-a) *,.dimrow.on>b{color:#2b2200}.dimrow.on .btn.ghost{color:#5a4a00}
.dimrow.bxr{display:grid;grid-template-columns:minmax(0,1fr) 120px 190px auto;gap:6px 14px;padding:12px 6px}.bxr .bx-s{white-space:nowrap}.bxr .bx-d{white-space:nowrap;text-align:right}.bxr .bx-a{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
@media (max-width:640px){.dimrow.bxr{grid-template-columns:78px minmax(0,1fr) auto;gap:4px 8px}.bxr .bx-t{grid-column:1/-1}.bxr .bx-d{text-align:left;font-size:.92em}.bxr .bx-a{gap:2px}}
.pkpath{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px;font-size:14px}
.szl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.sz{min-width:44px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font:700 14px var(--f-mono);cursor:pointer;display:inline-flex;align-items:baseline;gap:3px;justify-content:center}
.sz small{font:500 10px var(--f-body);color:var(--muted)}
.sz[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sz[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.sz.have{border-style:dashed}
.sz .qx{font:600 11px var(--f-mono);color:var(--muted);margin-left:2px}
.sz[aria-pressed="true"] .qx{color:var(--accent-ink)}
.sz.zero{border-color:var(--bad);border-style:dashed;color:var(--bad)}
.sz.zero .qx{color:var(--bad)}
.qn{color:var(--ink);font-weight:700}
.qn.zero{color:var(--bad)}
.qrows{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.qhead{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qsz{font:700 15px var(--f-mono)}
.m3{display:grid;grid-template-columns:62px minmax(0,1fr) auto 30px;gap:6px;align-items:center}
.m3 .del{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--bad);font-size:15px;cursor:pointer;padding:0}
.qrow.gone{opacity:.45}.qrow.gone .qsz{text-decoration:line-through;color:var(--bad)}
.qrow.gone input,.qrow.gone .stepper button{pointer-events:none}
.qrow.gone .del{background:var(--bad);color:#fff;border-color:var(--bad)}
.m3 input[type=text]{min-width:0;width:100%;box-sizing:border-box}
@media (max-width:480px){.m3{grid-template-columns:58px minmax(0,1fr) auto 28px;gap:5px}
  .m3 .stepper button{width:28px}.m3 .qty{width:38px !important}.m3 .del{width:28px;height:28px}
  .m3 input[type=text]{padding:9px 6px}}
.mixed{font-size:12px;color:var(--warn)}
.var{display:flex;flex-direction:column;gap:4px;padding-left:8px;border-left:3px solid var(--line-strong)}
.vl{font-size:12px;font-weight:600;color:var(--muted)}
.mk{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--info);margin-right:10px}

.code{font:700 15px var(--f-mono);letter-spacing:.02em;background:var(--ink);color:var(--surface);border-radius:4px;padding:6px 8px;border:0;cursor:pointer;white-space:nowrap;min-width:64px;text-align:center}
.code.none{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-strong);cursor:default;font-size:12px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .d{color:var(--muted);font-size:13px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:20px;text-align:center;color:var(--muted)}
.count{font-size:13px;color:var(--muted)}
.demo{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:2px 6px}

/* Plan : bouton Plan / 3D et vue 3D */
.seg3d{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.seg3d button{font:600 14px var(--f-body,inherit);padding:8px 16px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px}
.seg3d button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.p3d{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:10px;align-items:start}
.p3d-stage{position:relative;height:clamp(360px,64vh,740px);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);touch-action:none}
.p3d-stage canvas{display:block;width:100%;height:100%}
.p3d-msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted)}
.p3d-hint{position:absolute;left:8px;bottom:8px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;pointer-events:none}
.p3d-bar{grid-column:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.p3d-views{display:flex;flex-wrap:wrap;gap:6px}
.seg3d.sm button{min-height:34px;padding:5px 12px;font-size:13px}
.p3d-tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:4px 8px;font-size:13px;white-space:nowrap;transform:translate(14px,-130%);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.p3d-sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.p3d-pick li{align-items:center}.p3d-q{display:flex;align-items:center;gap:4px;flex:none}.p3d-q input{width:58px;font:inherit;padding:3px 6px}
.p3d-mv{display:flex;gap:6px}.p3d-mv select{flex:1;min-width:0}
.p3d-ok{display:flex;flex-direction:column;gap:6px;background:var(--ok-bg);color:var(--ok);border-radius:6px;padding:8px;font-weight:600}
.p3d-warn{color:var(--bad);font-size:13px;margin:0}
.p3d-list li.click{cursor:pointer}.p3d-list li.click:hover{background:var(--surface-2)}
.p3d-side{grid-column:2;grid-row:1/span 2;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.p3d .legend{grid-column:1/-1}
.p3d-code{font:700 24px var(--f-mono);color:var(--accent)}
.p3d-nums{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.p3d-nums b{display:block;font:700 22px var(--f-disp)}.p3d-nums span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.p3d-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;max-height:320px;overflow:auto}
.p3d-list li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:4px}.p3d-list li span:last-child{font-family:var(--f-mono);color:var(--muted)}
@media (max-width:760px){.p3d{grid-template-columns:minmax(0,1fr)}.p3d-side{grid-column:1;grid-row:auto}}
/* Plan */
.plan-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.plan{display:grid;min-width:280px;gap:5px;
  grid-template-columns:minmax(46px,.8fr) minmax(30px,.5fr) minmax(126px,1.6fr) minmax(12px,.35fr) minmax(66px,1fr);
  grid-template-areas:"fond fond fond fond fond" "g pl m al d" "g0 . arr . ext" "ent ent ent ent ent"}
.g0z{grid-area:g0;align-self:start;padding-top:8px;display:flex;flex-direction:column;gap:5px}
.arrz{grid-area:arr;align-self:start;padding-top:8px;display:flex;flex-direction:column;gap:5px}.arrz .rack,.rack.zsol{border:1.5px dashed #ead27a;background:repeating-linear-gradient(45deg,rgba(250,228,140,.45) 0 5px,rgba(255,246,205,.25) 5px 10px)}.rack.zsol .rk,.arrz .rack .rk{color:#2b2200;background:#fffdf3;border:1px solid #e3c766;border-radius:3px;padding:1px 5px}.rack.zsol.bm{margin-top:26px}
.col{display:flex;flex-direction:column;gap:5px}
/* gauche et droite : 5 racks plus longs sur la même longueur que les 6 du milieu, D1 aligné avec M1 */
.col.long .rack{flex:1}
.rack{border:1.5px solid var(--line-strong);border-radius:4px;background:var(--surface-2);padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:46px;box-sizing:border-box}
.mrow{display:flex;gap:5px;align-items:center}
.mrow .sep{width:1px;align-self:stretch;background:var(--line-strong)}
.rack.off{border-style:dashed;opacity:.55;justify-content:center}
.rk{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.03em;white-space:nowrap}

/* ---------- Couleurs conviviales ---------- */
:root{--zD:#1f6fb2;--zG:#7a4cc2;--zM:#0f8676;--zF:#b0601a;--zE:#3b8a2a;--zB:#c2416b;
  --t1:#1f6fb2;--t2:#0f8676;--t3:#e2570f;--t4:#7a4cc2;
  --head-grad:linear-gradient(120deg,#0f2a44 0%,#16507a 55%,#1b7d8f 100%)}
body{background:linear-gradient(180deg,#dfeaf4 0,var(--bg) 360px) no-repeat,var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:linear-gradient(180deg,#132536 0,var(--bg) 360px) no-repeat,var(--bg)}}
:root[data-theme="dark"] body{background:linear-gradient(180deg,#132536 0,var(--bg) 360px) no-repeat,var(--bg)}
.top{background:var(--head-grad);box-shadow:0 2px 10px rgba(0,0,0,.18)}
body::before{background:#0f2a44}
.brand::after{content:"❄";font-size:18px;color:#9fd8ff;margin-left:2px}
main h2{padding-left:10px;border-left:4px solid var(--accent)}
.sheet h2{border-left:0;padding-left:0}
/* Une couleur par zone d'entrepôt */
.code[data-z]{color:#fff}
.code[data-z="D"]{background:var(--zD)}.code[data-z="G"]{background:var(--zG)}.code[data-z="M"]{background:var(--zM)}
.code[data-z="F"]{background:var(--zF)}.code[data-z="E"]{background:var(--zE)}.code[data-z="B"]{background:var(--zB)}
/* zones du ski et zone d'arrivée : sinon fond clair + texte blanc en mode sombre (illisible) */
.code[data-z="BF"]{background:var(--zG)}.code[data-z="BH"]{background:var(--zD)}.code[data-z="FS"]{background:var(--zF)}.code[data-z="SK"]{background:var(--zE)}.code[data-z="EN"]{background:var(--zM)}.code[data-z="ED"]{background:var(--zB)}.code[data-z="ARR"]{background:#9a6b00}.code[data-z="CT"]{background:repeating-linear-gradient(45deg,#f6e08f 0 5px,#fcf1c4 5px 10px);color:#2b2200}

.code[data-z="WN"]{background:#0b6e99;box-shadow:inset 0 0 0 2px #9fd8ff}.code[data-z="WN"]::after{content:" ❄";font-size:.85em}

.rack[data-z="F"]{border-color:var(--zF)}.rack[data-z="E"]{border-color:var(--zE)}.rack[data-z="B"]{border-color:var(--zB)}
.rack[data-z="D"] .rk{color:var(--zD)}.rack[data-z="G"] .rk{color:var(--zG)}.rack[data-z="M"] .rk{color:var(--zM)}
.rack[data-z="F"] .rk{color:var(--zF)}.rack[data-z="E"] .rk{color:var(--zE)}.rack[data-z="B"] .rk{color:var(--zB)}

.tile[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tiles.big-1{grid-template-columns:1fr}
.alert{padding:12px 14px;border-radius:12px;font-size:16px;border:1px solid}

/* ===== THÈME TENDANCE : rouge cerise, noir profond, blanc net ===== */
:root:root{
  --bg:#f6f6f7; --surface:#ffffff; --surface-2:#f0f0f2; --ink:#111113; --muted:#6e6e76;
  --line:#e6e6ea; --line-strong:#cdcdd4; --head:#140507; --head-ink:#ffffff;
  --accent:#d1102c; --accent-ink:#ffffff; --hl:#e3112f; --hl-ink:#ffffff; --fill:#fde3e6; --fill-line:#f19aa6;

function lineRow(o,l,i){

  const code=a?`<button type="button" class="code" data-act="locate" data-id="${a.id}">${esc(a.emp)}</button>`:`<span class="code none">${l.aid?'supprimé':'à chercher'}</span>`;
  const title=a?esc(artName(a)):l.aid?'Article supprimé du catalogue':`« ${esc(l.txt)} »`;
  const live=a&&(o.status==='demandee'||o.status==='prep'); /* avant préparation : montrer le stock disponible */
  /* l'essentiel seulement : type · homme/femme · taille · couleur ; le stock n'apparaît que s'il ne suffit pas */
  const desc=a?esc([TYPE[a.type],GENRE[a.genre],szLbl(a.type,a.taille),a.couleur].filter(Boolean).join(' · '))+(live&&qOf(a)<l.qty?` <span class="pill ln-rupture">${qOf(a)?`plus que ${qOf(a)} en stock`:'rupture de stock'}</span>`:''):l.txt?'Demande en texte libre':'';
  const done=doneOf(l),mine=l.by&&l.by===me(),open=role==='entrepot'&&(o.status==='demandee'||o.status==='prep');

  if(open){

    ctl=`<div class="lctl">
      <button type="button" class="chk${l.st==='cours'?' on':''}" data-act="lclaim" data-o="${o.id}" data-i="${i}"${other||l.st==='ok'||l.st==='rupture'?' disabled':''}>${l.st==='cours'?'☑':'☐'} En cours</button>
      <button type="button" class="chk ok${l.st==='ok'||l.st==='rupture'?' on':''}" data-act="lok" data-o="${o.id}" data-i="${i}"${other||!l.st?' disabled':''}>${l.st==='ok'||l.st==='rupture'?'☑':'☐'} Validée</button>
      ${l.st==='cours'&&mine?`<button type="button" class="chk ko" data-act="lko" data-o="${o.id}" data-i="${i}">Rupture</button>`:''}
      ${other?`<button type="button" class="btn ghost sm${st.armed==='unl'+o.id+':'+i?' armed':''}" data-act="lunlock" data-o="${o.id}" data-i="${i}">${st.armed==='unl'+o.id+':'+i?'Confirmer : libérer':'Libérer'}</button>`:''}
      ${step}</div>
      ${l.st==='ok'&&done<l.qty?`<div class="pill ln-rupture" style="margin-top:4px;display:inline-block">Manque ${l.qty-done}</div>`:''}`;}
  /* état de la ligne, bien visible à droite : en cours (à qui), validée, rupture */
  const right=l.st==='cours'?`<span class="lpill ${mine?'mine':'busy'}">En cours${l.by?' · '+esc(l.by):''}</span>`
    :(l.st==='ok'||l.st==='rupture')?`<span class="lpill ${l.st==='rupture'||done<l.qty?'short':'ok'}">${l.st==='rupture'?'✕ Rupture':'✓ Validée'} · ${done}/${l.qty}${l.by&&open?' · '+esc(l.by):''}</span>`

    <div class="lc-name">${title}</div><div class="lc-d">${desc}</div>${ctl?`<div class="lctl-w">${ctl}</div>`:''}</div>`;}

/* Modifie une seule ligne : en ligne, la ligne est mise à jour dans la commande telle qu'elle est en ce moment,
   pour ne pas effacer ce qu'un autre préparateur vient de faire sur une autre ligne. */
function lineSet(o,i,patch,orderPatch){
  Object.assign(o.lines[i],patch);if(orderPatch)Object.assign(o,orderPatch);
  saveLocal();
  if(cloud.on&&cloud.sent.orders){const id=String(o.id);cloud.sent.orders.set(id,JSON.stringify(o));
    const ref=cloud.fs.doc(cloud.db,C('orders'),id);
    cloud.fs.runTransaction(cloud.db,async tx=>{const d=await tx.get(ref);if(!d.exists())return;const r=JSON.parse(d.data().json);const L=r.lines[i];if(!L)return;
      if(patch.st==='cours'&&L.st&&L.by&&L.by!==patch.by)throw new Error('pris:'+L.by);
      Object.assign(L,patch);if(orderPatch&&!(orderPatch.status==='prep'&&r.status!=='demandee'))Object.assign(r,orderPatch);
      tx.set(ref,{json:JSON.stringify(r),at:Date.now()});})
    .catch(e=>{const m=/^pris:(.*)/.exec(e&&e.message||'');if(!m){cloudErr(e);return;}
      toast(`Déjà pris par <b>${esc(m[1])}</b>`);
      /* on reprend la version en ligne de la commande */
      cloud.fs.getDoc(ref).then(d=>{if(!d.exists())return;const j=d.data().json,k=S.orders.findIndex(x=>String(x.id)===id);if(k>=0)S.orders[k]=JSON.parse(j);cloud.sent.orders.set(id,j);saveLocal();render();});});}
  render();}
const lineRank=l=>{const a=l.aid&&art(l.aid);return a?locRank(a.emp):9999;};
/* Où aller chercher : un emplacement par ligne, dans l'ordre des racks */
function pickList(o){
  const by=new Map();o.lines.forEach(l=>{const a=l.aid&&art(l.aid);if(!a)return;if(!by.has(a.emp))by.set(a.emp,[]);by.get(a.emp).push(`${a.marque} ${a.modele} ${szLbl(a.type,a.taille)}${a.couleur?' '+a.couleur:''} ×${l.qty}`);});
  if(!by.size)return'';

/* Plusieurs lignes d'un coup (une marque) : même principe que lineSet, en une seule transaction.

function linesSet(o,list,orderPatch){if(!list.length)return;
  list.forEach(({i,patch})=>Object.assign(o.lines[i],patch));if(orderPatch)Object.assign(o,orderPatch);saveLocal();
  if(cloud.on&&cloud.sent.orders){const id=String(o.id);cloud.sent.orders.set(id,JSON.stringify(o));const ref=cloud.fs.doc(cloud.db,C('orders'),id);let taken=[];
    cloud.fs.runTransaction(cloud.db,async tx=>{taken=[];const d=await tx.get(ref);if(!d.exists())return null;const r=JSON.parse(d.data().json);

      if(r){const k=S.orders.findIndex(x=>String(x.id)===id);if(k>=0)S.orders[k]=r;cloud.sent.orders.set(id,JSON.stringify(r));saveLocal();render();}})

const LIBRE='Demandes libres';

/* La commande regroupée par marque, dans l'ordre des racks */
function brandGroups(o){const open=role==='entrepot'&&(o.status==='demandee'||o.status==='prep');

  const groups=[...g.entries()].map(([k,arr])=>({k,arr:arr.sort((x,y)=>lineRank(x[0])-lineRank(y[0]))}))
    .sort((x,y)=>Math.min(...x.arr.map(e=>lineRank(e[0])))-Math.min(...y.arr.map(e=>lineRank(e[0]))));
  return groups.map(({k,arr})=>{const ls=arr.map(e=>e[0]),n=ls.reduce((s,l)=>s+l.qty,0);

    const doneBy=[...new Set(ls.filter(l=>(l.st==='ok'||l.st==='rupture')&&l.by).map(l=>l.by))];
    const free=ls.filter(l=>!l.st).length,mineC=ls.filter(l=>l.st==='cours'&&l.by===me()).length,others=who.filter(x=>x!==me());
    const nv=ls.filter(l=>l.st==='ok'||l.st==='rupture').length;
    let state,cls;
    if(fin){state=`✓ Validée${doneBy.length?' · '+doneBy.join(', '):''}`;cls='ok';}
    else if(who.length){state=`En cours · ${who.join(', ')}${nv?` · ${nv}/${ls.length} validées`:''}`;cls=mineC?'mine':'busy';}
    else{state=nv?`${nv}/${ls.length} validées`:'Libre';cls='free';}
    const B=esc(k),arm=st.armed==='bunl'+o.id+':'+k;let btns='';
    if(open&&!fin){
      if(free)btns+=`<button type="button" class="btn ${who.length?'':'primary'}" data-act="bclaim" data-o="${o.id}" data-b="${B}">✋ Je prends ${k===LIBRE?'les demandes libres':B}${free<ls.length?` (${free} restante${free>1?'s':''})`:''}</button>`;
      if(mineC)btns+=`<button type="button" class="btn primary" data-act="bok" data-o="${o.id}" data-b="${B}">✓ Tout valider (${mineC})</button><button type="button" class="btn ghost sm" data-act="bfree" data-o="${o.id}" data-b="${B}">Libérer</button>`;
      if(others.length&&!mineC)btns+=`<button type="button" class="btn ghost sm${arm?' armed':''}" data-act="bunlock" data-o="${o.id}" data-b="${B}">${arm?`Confirmer : libérer ${B}`:'Libérer (oublié ?)'}</button>`;}
    return `<div class="bgrp b-${cls}"><div class="bgrp-h"><div><b class="bname">${B}</b> <small>${ls.length} ligne${ls.length>1?'s':''} · ${n} pièce${n>1?'s':''}</small></div><span class="bstate">${esc(state)}</span></div>

/* ---------- Contrôle d'inventaire (pistolet RFID) : on compare, on note les écarts. Ne touche JAMAIS au stock. ----------
   état partagé : {at, by, r:{clé:{n}|{ok}}, extra:[{id,marque,modele,taille,n}]} ; clé = type|marque|modèle|taille ('' = total) */
const CTRL={st:null,sent:'',sub:false,t:null},CTRL_LS=KEY+'-controle';
function ctrlSt(){if(!CTRL.st){try{CTRL.st=JSON.parse(localStorage.getItem(CTRL_LS)||'null');}catch(e){}if(!CTRL.st||!CTRL.st.r)CTRL.st={at:Date.now(),by:me(),r:{},extra:[]};}
  if(!CTRL.sub&&cloud.on&&cloud.fs){CTRL.sub=true;cloud.fs.onSnapshot(cloud.fs.doc(cloud.db,C('cfg'),'controle'),snap=>{if(!snap.exists())return;const j=snap.data().json;if(j===CTRL.sent)return;
    try{CTRL.st=JSON.parse(j);CTRL.sent=j;localStorage.setItem(CTRL_LS,j);}catch(e){}if(st.tab==='settings'&&st.setSec==='ctrl')softRender();},cloudErr);}
  return CTRL.st;}
function ctrlSave(){const S2=ctrlSt();S2.upd=Date.now();const j=JSON.stringify(S2);try{localStorage.setItem(CTRL_LS,j);}catch(e){}
  clearTimeout(CTRL.t);CTRL.t=setTimeout(()=>{if(cloud.on&&cloud.fs){CTRL.sent=j;cloud.fs.setDoc(cloud.fs.doc(cloud.db,C('cfg'),'controle'),{json:j,at:Date.now()}).catch(cloudErr);}},500);}
/* lignes : type › marque › modèle › taille, avec les totaux */
function ctrlRows(){const T=new Map();
  S.articles.forEach(a=>{const q=qOf(a);if(q<=0)return;const t=T.get(a.type)||new Map();T.set(a.type,t);const m=t.get(a.marque)||new Map();t.set(a.marque,m);
    const mo=m.get(a.modele)||new Map();m.set(a.modele,mo);const z=mo.get(a.taille)||{q:0,a};z.q+=q;mo.set(a.taille,z);});
  const out=[],cmp=(x,y)=>String(x).localeCompare(String(y),'fr',{sensitivity:'base'});
  Object.keys(TYPE).filter(t=>T.has(t)).forEach(t=>{out.push({lv:-1,t,label:TYPE[t],q:0});const ti=out.length-1;
    [...T.get(t).keys()].sort(cmp).forEach(mq=>{const M=T.get(t).get(mq),mi=out.length;out.push({lv:0,t,k:[t,mq,'',''].join('|'),label:mq||'(sans marque)',q:0});
      [...M.keys()].sort(cmp).forEach(mo=>{const Z=M.get(mo),oi=out.length;out.push({lv:1,t,k:[t,mq,mo,''].join('|'),label:mo||'(sans modèle)',q:0});
        [...Z.entries()].sort((x,y)=>sizeRank(x[1].a)-sizeRank(y[1].a)).forEach(([z,v])=>{out.push({lv:2,t,k:[t,mq,mo,z].join('|'),label:szLbl(t,z),q:v.q});out[oi].q+=v.q;out[mi].q+=v.q;out[ti].q+=v.q;});});});});
  return out;}
const ctrlGap=(r,R)=>{const x=R[r.k];if(!x)return null;if(x.ok)return 0;return x.n!=null?x.n-r.q:null;};
const ctrlGapTxt=g=>g==null?'':g===0?'=':(g>0?'+':'−')+Math.abs(g);
const ctrlGapCls=g=>g==null?'':g===0?'ok':g>0?'plus':'moins';
/* couleurs de contrôle d'un ensemble (marque, modèle, taille), au prorata des quantités :
   vert = exact, orange = erreur de modèle (⚠, ou trouvé en plus par le pistolet), rouge = nombre faux, sans couleur = à faire */
function ctrlMix(rows,i,R,extra){const r=rows[i],x=R[r.k],q=r.q;
  if(x){if(x.mod)return {ok:0,mod:Math.max(q,1),bad:0,todo:0};if(x.ok)return {ok:q,mod:0,bad:0,todo:0};
    if(x.n!=null){const g=Math.min(x.n,q);return {ok:g,mod:0,bad:Math.abs(x.n-q),todo:0};}}
  const m={ok:0,mod:0,bad:0,todo:0};let any=false;
  for(let j=i+1;j<rows.length&&rows[j].lv>r.lv;j++){if(rows[j].lv!==r.lv+1)continue;any=true;const c=ctrlMix(rows,j,R);m.ok+=c.ok;m.mod+=c.mod;m.bad+=c.bad;m.todo+=c.todo;}
  if(!any)m.todo=q;
  if(extra)m.mod+=extra;return m;}
function ctrlBg(m){const tot=m.ok+m.mod+m.bad+m.todo;if(!tot||m.todo===tot)return '';
  /* dégradé façon cellule Excel : chaque couleur occupe sa part, avec un fondu doux entre deux couleurs */
  const seg=[['var(--c-ok)',m.ok],['var(--c-mod)',m.mod],['var(--c-bad)',m.bad],['var(--c-todo)',m.todo]].filter(x=>x[1]>0).map(([c,v])=>[c,v/tot*100]);
  if(seg.length===1)return `background:${seg[0][0]};color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)`;
  let pos=0;const st=[`${seg[0][0]} 0%`];
  seg.forEach(([c,w],k)=>{if(k===seg.length-1)return;const b=pos+w,h=Math.min(9,w/2,seg[k+1][1]/2);st.push(`${c} ${(b-h).toFixed(1)}%`,`${seg[k+1][0]} ${(b+h).toFixed(1)}%`);pos=b;});
  st.push(`${seg[seg.length-1][0]} 100%`);
  return `background:linear-gradient(90deg,${st.join(',')});color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)`;}
const ctrlState=m=>{const t=m.ok+m.mod+m.bad+m.todo;return !t||m.todo===t?'à faire':m.todo?'en cours':m.mod||m.bad?'écarts':'exact';};

  return `<div class="card"><h3>Contrôle d'inventaire</h3>

/* ---------- Inventaire Excel (.xlsx créé sur l'appareil, sans internet) ---------- */
const XL={
  crcT:(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})(),
  crc(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=XL.crcT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;},
  zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
    const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
    files.forEach(([name,txt])=>{const nb=enc.encode(name),db=enc.encode(txt),c=XL.crc(db);
      const h=[0x50,0x4b,3,4,...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)];
      parts.push(new Uint8Array(h),nb,db);
      cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
      off+=h.length+nb.length+db.length;});
    const csz=cen.reduce((x,b)=>x+b.length,0);
    return new Blob([...parts,...cen,new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(csz),...u32(off),0,0])],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});},
  col(i){let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;},
  x:v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''),
  /* sheet = {name, widths:[], rows:[[cells]], styles:[row style], freeze:true} ; cellule = texte, nombre ou null */
  sheet(sh){const rows=sh.rows.map((r,ri)=>{const stl=sh.styles[ri]||0;
      return `<row r="${ri+1}">${r.map((v,ci)=>{if(v==null||v==='')return stl?`<c r="${XL.col(ci)}${ri+1}" s="${stl}"/>`:'';const ref=XL.col(ci)+(ri+1),sa=stl?` s="${stl}"`:'';
        return typeof v==='number'?`<c r="${ref}"${sa}><v>${v}</v></c>`:`<c r="${ref}"${sa} t="inlineStr"><is><t xml:space="preserve">${XL.x(v)}</t></is></c>`;}).join('')}</row>`;}).join('');
    const ncol=Math.max(...sh.rows.map(r=>r.length),1);
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">`+
      `<sheetViews><sheetView workbookViewId="0">${sh.freeze?`<pane ySplit="${sh.freeze}" topLeftCell="A${sh.freeze+1}" activePane="bottomLeft" state="frozen"/>`:''}</sheetView></sheetViews>`+
      `<cols>${Array.from({length:ncol},(_,i)=>`<col min="${i+1}" max="${i+1}" width="${sh.widths[i]||8}" customWidth="1"/>`).join('')}</cols>`+
      `<sheetData>${rows}</sheetData>${sh.filter?`<autoFilter ref="A${sh.freeze}:${XL.col(ncol-1)}${sh.rows.length}"/>`:''}</worksheet>`;},
  book(sheets){const n=sheets.length;
    const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
    const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
    const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((sh,i)=>`<sheet name="${XL.x(sh.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>${sheets.some(sh=>sh.filter)?`<definedNames>${sheets.map((sh,i)=>sh.filter?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${XL.x(sh.name)}'!$A$${sh.freeze}:$${XL.col(Math.max(...sh.rows.map(r=>r.length))-1)}$${sh.rows.length}</definedName>`:'').join('')}</definedNames>`:''}</workbook>`;

const gSizes=g=>Object.keys(g.sizes).filter(z=>g.sizes[z]>0).sort((x,y)=>(g.type==='fix'?(S.sizesF.indexOf(x)+1||99)-(S.sizesF.indexOf(y)+1||99):sizeRankStr(x)-sizeRankStr(y)));

/* Libérer un emplacement conseillé en déplaçant d'autres modèles (entiers) vers d'autres racks permis.
   Proposé seulement si c'est utile : pas de place en un seul endroit, ou seulement en dernier recours,
   ou pour rejoindre le même modèle. On déplace au maximum 4 modèles et moins de boîtes qu'on n'en range. */
function optimizeFor(t,marque,modele,genre,n){curGenre=genre;const big=t==='botte'&&n>=bigLot();
  const occ=occMap(),BX=mBox(t,marque,modele),X=capCtx(occ,BX),key=a=>[a.type,norm(a.marque),norm(a.modele),a.genre].join('|'),K=[t,norm(marque),norm(modele),genre].join('|');
  const same=new Set(S.articles.filter(a=>key(a)===K).map(a=>a.emp)),brand=new Set(S.articles.filter(a=>a.type===t&&norm(a.marque)===norm(marque)).map(a=>a.emp));
  let best=null;
  LOCS.filter(L=>locTier(t,L,big)===1&&X.cap(L,t)>=n).forEach(L=>{
    if(X.free(L,t)>=n)return;
    const occ2=JSON.parse(JSON.stringify(occ)),Y=capCtx(occ2,BX);
    const groups=new Map();S.articles.filter(a=>a.emp===L&&key(a)!==K&&qOf(a)>0&&!a._new).forEach(a=>{const k=key(a);const g=groups.get(k)||{ids:[],n:0,t:a.type,a,k};g.ids.push(a.id);g.n+=qOf(a);groups.set(k,g);});
    /* d'abord ce qui n'est pas à sa place selon les règles, puis les plus petits */
    const order=[...groups.values()].sort((x,y)=>(locTier(y.t,L,false)-locTier(x.t,L,false))||x.n-y.n);
    const moves=[];let moved=0;
    for(const g of order){if(Y.free(L,t)>=n||moves.length>=4)break;
      const homes=new Set(S.articles.filter(a=>key(a)===g.k&&a.emp!==L).map(a=>a.emp));
      const dests=LOCS.filter(e=>e!==L&&locTier(g.t,e,false)>0&&Y.free(e,g.t)>=g.n)
        .sort((x,y)=>(homes.has(y)-homes.has(x))||tierOrder(g.t,x,false)-tierOrder(g.t,y,false)||Y.free(x,g.t)-Y.free(y,g.t));
      if(!dests.length)continue;const D=dests[0];
      Y.add(L,g.t,-g.n);Y.add(D,g.t,g.n);moved+=g.n;
      moves.push({ids:g.ids,from:L,to:D,n:g.n,label:`${g.a.marque} ${g.a.modele} ${GENRE[g.a.genre]||''}`.trim()});}
    if(!moves.length||Y.free(L,t)<n||moved>n)return;
    /* score : boîtes déplacées, bonus si on rejoint le même modèle ou la même marque */
    const score=moved+moves.length*2-(same.has(L)?n:0)-(brand.has(L)?3:0)+tierOrder(t,L,big);
    if(!best||score<best.score)best={emp:L,moves,score,moved,why:`${same.has(L)?'avec le même modèle, ':''}en libérant ${L} : ${moves.length} ${plural(moves.length,'modèle déplacé','modèles déplacés')} (${moved} ${plural(moved,'boîte','boîtes')})`};});
  return best;}

/* Plan : simulé sur une copie du stock, un modèle après l'autre (les plus gros d'abord) */
function planArrivage(){const A=arr(),real=S.articles,sim=JSON.parse(JSON.stringify(real));S.articles=sim;const out=[];
  try{
    [...A.groups].sort((a,b)=>gTot(b)-gTot(a)).forEach(g=>{const n=gTot(g);if(!n)return;
      const step={g,n,chunks:[],moves:[],why:'',alts:[]};
      /* un morceau = un emplacement + ses tailles ; on l'ajoute au stock simulé pour le modèle suivant */
      const put=(emp,sz)=>{const k=Object.values(sz).reduce((x,y)=>x+y,0);step.chunks.push({emp,n:k,sizes:sz});
        if(emp)Object.entries(sz).forEach(([z,q])=>S.articles.push({id:'sim'+Math.random(),_new:1,type:g.type,marque:g.marque,modele:g.modele,genre:g.genre,taille:z,couleur:g.couleur,emp,qty:q}));};
      if(g.emp){g.over={};Object.keys(g.sizes).forEach(z=>g.over[z]=g.emp);delete g.emp;}
      const over=g.over||{},forced={},all={};
      Object.keys(g.sizes).forEach(z=>{if(!(g.sizes[z]>0))return;if(over[z])(forced[over[z]]=forced[over[z]]||{})[z]=g.sizes[z];else all[z]=g.sizes[z];});
      Object.entries(forced).forEach(([e,sz])=>{put(e,sz);step.chunks[step.chunks.length-1].forced=true;});
      const nRest=Object.values(all).reduce((x,y)=>x+y,0);
      if(!nRest){step.why='emplacement choisi par vous';out.push(step);return;}
      if(g.type==='board'){const h=S.articles.find(a=>a.type==='board'&&norm(a.marque)===norm(g.marque)&&norm(a.modele)===norm(g.modele));let e=h?h.emp:null;
        if(!e&&SKI){const z=LOCS.filter(c=>/^(MUR|FEN|SD)/.test(c)||c==='EN1.1'||c==='ED1.1'||c==='ED2.1').map(c=>[c,S.articles.filter(a=>a.emp===c).reduce((t,a)=>t+qOf(a),0)]).sort((x,y)=>x[1]-y[1])[0];e=z&&z[0];}
        put(e,all);step.why=h?'avec le même modèle':e?'zone de skis la moins remplie':'snowboards : choisissez l\'emplacement';out.push(step);return;}
      const r=placeSuggest(g.type,g.marque,g.modele,g.genre,nRest);step.alts=r.res.map(x=>x.emp);
      let c=r.res[0]||null;const bigG=g.type==='botte'&&nRest>=bigLot();
      /* optimisation : si pas de place d'un seul tenant, ou seulement en dernier recours, ou loin du même modèle.
         Jamais quand le conseil est déjà avec le même modèle : le regrouper passe avant la règle « bottes au milieu ». */
      const withSame=c&&(c.near||r.here.some(([e])=>e===c.emp));
      if(A.opt!==false&&!withSame&&(!c||locTier(g.type,c.emp,bigG)===2||(r.here.length&&!r.here.some(([e])=>e===c.emp)))){const o=optimizeFor(g.type,g.marque,g.modele,g.genre,nRest);
        if(o&&(!c||o.why.startsWith('avec le même')||locTier(g.type,c.emp,bigG)===2)){c=o;step.opt=true;}}
      if(c){if(c.moves.length){applyMoves(c.moves);step.moves=c.moves;}put(c.emp,all);step.why=c.why;}
      else{splitLot(g.type,g.marque,g.modele,g.genre,all).forEach(c=>put(c.emp,c.sizes));
        step.why=`trop gros pour un seul endroit : réparti par tailles en ${step.chunks.filter(c=>c.emp).length} emplacements`;}
      out.push(step);});
  }finally{S.articles=real;}
  return out;}
/* répartit les tailles d'un modèle dans ses morceaux (emplacements) */
function chunkLines(step){const res=[];step.chunks.forEach(c=>Object.entries(c.sizes||{}).forEach(([z,q])=>{if(q>0)res.push({emp:c.emp,taille:z,qty:q});}));return res;}
/* liste des emplacements possibles pour un morceau : d'abord ceux qui ont la place, puis les autres, puis hors racks */
function chunkOpts(g,c){curGenre=g.genre;const t=g.type,X=capCtx(occMap(),mBox(t,g.marque,g.modele)),big=t==='botte'&&c.n>=bigLot();
  const ok=LOCS.filter(e=>locTier(t,e,big)>0&&e!==c.emp).map(e=>[e,X.free(e,t)]);
  const fits=ok.filter(x=>x[1]>=c.n).sort((a,b)=>tierOrder(t,a[0],big)-tierOrder(t,b[0],big)||a[1]-b[1]);
  const small=ok.filter(x=>x[1]>0&&x[1]<c.n).sort((a,b)=>b[1]-a[1]);
  const hors=LOCS.filter(e=>!capGroup(e)&&e!==c.emp);
  const o=(e,lbl)=>`<option value="${e}">${lbl}</option>`;
  return (c.forced?`<option value="" >↩ Revenir au conseil de l'appli</option><option value="${c.emp}" selected>${c.emp} · choisi par vous</option>`:`<option value="" selected>${c.emp?`Garder ${c.emp} (conseil de l'appli)`:'Choisir un emplacement…'}</option>`)
    +(fits.length?`<optgroup label="Assez de place pour ${c.n} boîtes">${fits.map(([e,f])=>o(e,`${e} · place pour ≈ ${f}${locTier(t,e,big)===2?' · dernier recours':''}`)).join('')}</optgroup>`:'')
    +(small.length?`<optgroup label="Pas assez de place (il faudra tasser)">${small.map(([e,f])=>o(e,`${e} · place pour ≈ ${f} seulement`)).join('')}</optgroup>`:'')
    +`<optgroup label="Hors racks : fond, gauche, étagère, blocs">${hors.map(e=>o(e,`${e} · ${locLabel(e)}`)).join('')}</optgroup>`;}

/* ---------- Mot de passe de protection (évite d'effacer le stock par mégarde) ----------
   Seule une empreinte du mot de passe est gardée (S.lock.h), partagée entre les appareils. */
function pwHash(pw){let h1=0x811c9dc5,h2=0x1505;const t='entrepot-snow|'+pw;
  for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0;}
  return h1.toString(16)+'-'+h2.toString(16);}
const LOCK_ACT={wipe:['Partir de zéro','Tout le stock (articles, commandes) sera effacé pour tout le monde. Impossible de revenir en arrière.','Effacer tout le stock'],
  reset:['Recharger la liste importée','Le stock actuel sera remplacé par la liste importée au début, pour tout le monde.','Recharger la liste'],
  pwchange:['Changer le mot de passe','Entrez le mot de passe actuel.','Continuer'],
  restore:['Revenir à une sauvegarde','Le stock (articles) sera remis comme dans la sauvegarde choisie, pour tout le monde. L\'état actuel est d\'abord gardé dans une sauvegarde.','Revenir à cette sauvegarde']};
function lockSheet(act){
  if(!S.lock||!S.lock.h||act==='pwset'){sheet(`<form id="lockNew" class="sheet-in" style="display:flex;flex-direction:column;gap:12px" data-next="${act}">
      <div class="sheet-h"><h2>Créer un mot de passe</h2><button type="button" class="btn ghost" data-act="close">Annuler</button></div>
      <p class="sub">Ce mot de passe sera demandé avant d'<b>effacer</b> ou de <b>recharger</b> le stock. Choisissez-le et notez-le bien.</p>
      <div class="field"><label for="pw1">Nouveau mot de passe</label><input type="password" id="pw1" autocomplete="new-password"></div>
      <div class="field"><label for="pw2">Le retaper</label><input type="password" id="pw2" autocomplete="new-password"></div>
      <button type="submit" class="btn primary">Enregistrer le mot de passe</button></form>`);setTimeout(()=>$('#pw1')&&$('#pw1').focus(),50);return;}
  const [title,txt,btn]=LOCK_ACT[act];
  sheet(`<form id="lockAsk" class="sheet-in" style="display:flex;flex-direction:column;gap:12px" data-act-to="${act}">
    <div class="sheet-h"><h2>${title}</h2><button type="button" class="btn ghost" data-act="close">Annuler</button></div>
    <p class="sub">${txt}</p>
    <div class="field"><label for="pwAsk">Mot de passe</label><input type="password" id="pwAsk" autocomplete="current-password"></div>
    <button type="submit" class="btn ${act==='pwchange'?'primary':'danger'}">${btn}</button></form>`);setTimeout(()=>$('#pwAsk')&&$('#pwAsk').focus(),50);}
function doReset(){S={...seed(),lock:S.lock,caps:S.caps,dims:S.dims};save();render();toast('Liste importée rechargée');}
function doWipe(){const keep={brands:S.brands,sizesB:S.sizesB,sizesF:S.sizesF,sizesS:S.sizesS,lock:S.lock,caps:S.caps,dims:S.dims};S={...seed(),...keep,demo:false,articles:[],orders:[],notifs:[],seq:1000};save();render();toast('Tout est effacé. Ajoutez votre premier article.');}
document.addEventListener('submit',e=>{const f=e.target;
  if(f.id==='lockNew'){e.preventDefault();const a=$('#pw1').value,b=$('#pw2').value;
    if(a.length<4){toast('Au moins 4 caractères');$('#pw1').focus();return;}if(a!==b){toast('Les deux mots de passe sont différents');$('#pw2').focus();return;}
    S.lock={h:pwHash(a),at:Date.now()};save();closeSheet();render();toast('<b>Mot de passe enregistré</b>');const nx=f.dataset.next;if(nx&&nx!=='pwchange'&&nx!=='pwset')lockSheet(nx);return;}
  if(f.id==='lockAsk'){e.preventDefault();const act=f.dataset.actTo;
    if(pwHash($('#pwAsk').value)!==S.lock.h){toast('<b>Mot de passe incorrect</b>');$('#pwAsk').value='';$('#pwAsk').focus();return;}
    closeSheet();if(act==='wipe')doWipe();else if(act==='reset')doReset();else if(act==='pwchange')lockSheet('pwset');else if(act==='restore')doRestore(st.restoreId);}});

/* ---------- Magasin : mini-appli téléphone ---------- */
/* Commander pas à pas : type → marque → modèle → homme/femme → taille → couleur → nombre */
const SH_STEPS=['type','marque','modele','genre','taille','couleur','qty'];
const SH_Q_GRID='Combien par taille ?';const SH_Q={grid:SH_Q_GRID,type:'Quoi ?',marque:'Quelle marque ?',modele:'Quel modèle ?',genre:'Homme ou femme ?',taille:'Quelle taille ?',couleur:'Quelle couleur ?',qty:'Combien ?'};
const shVal=(a,k)=>k==='couleur'?(a.couleur||''):a[k];
/* quantité déjà demandée (commandes en cours + commande en préparation sur ce téléphone) */
function reserved(aid){let n=0;
  S.orders.forEach(o=>{if(o.id===S.editing||!(o.status==='demandee'||o.status==='prep'))return;o.lines.forEach(l=>{if(l.aid===aid&&l.st!=='rupture')n+=l.qty;});});
  S.cart.forEach(l=>{if(l.aid===aid)n+=l.qty;});return n;}
const availOf=a=>Math.max(0,qOf(a)-reserved(a.id));
function shPool(upto){const v=st.sh.v,ks=SH_STEPS.slice(0,SH_STEPS.indexOf(upto));
  return S.articles.filter(a=>ks.every(k=>v[k]===undefined||shVal(a,k)===v[k]));}
function shOpts(k){const m=new Map();shPool(k).forEach(a=>{const x=shVal(a,k);const o=m.get(x)||{n:0,stock:0};o.n++;o.stock+=availOf(a);m.set(x,o);});return m;}
function shStart(preset){st.sh={step:'type',v:{},hist:[],q:1};
  if(preset){Object.assign(st.sh.v,preset);st.sh.hist=Object.keys(preset);shNext(st.sh.hist[st.sh.hist.length-1]);}}
function shNext(from){let i=SH_STEPS.indexOf(from)+1;
  while(i<SH_STEPS.length){const k=SH_STEPS[i];
    if(k==='qty'){st.sh.step='qty';st.sh.q=1;return;}
    if(k==='taille'){st.sh.step='grid';st.sh.gq={};return;}
    const o=shOpts(k);
    if((k==='genre'||k==='couleur')&&o.size===1){st.sh.v[k]=[...o.keys()][0];i++;continue;}
    st.sh.step=k;return;}}
function shPick(k,val){st.sh.v[k]=val;st.sh.hist.push(k);shNext(k);}
function shBack(){const k=st.sh.hist.pop();
  if(!k){st.sh.step=null;return;}
  SH_STEPS.slice(SH_STEPS.indexOf(k)).forEach(x=>delete st.sh.v[x]);st.sh.step=k;}
function shLabel(k,x){if(k==='type')return TYPE[x];if(k==='genre')return GENRE[x];if(k==='taille')return szLbl(st.sh.v.type,x);if(k==='couleur')return x||'Sans couleur précisée';return x;}

function bell(){const u=unread();if(!u.length)return'';const n=u[u.length-1];
  return `<div class="bell" role="status"><span>🔔 <b>${esc(n.text)}</b>${u.length>1?` <small>(+${u.length-1})</small>`:''}</span><button type="button" class="btn sm primary" data-act="seen">Voir</button></div>`;}

function vShopCmd(){
  if(!st.sh.step&&!S.cart.length&&!S.editing)shStart();
  const sh=st.sh;
  if(!sh.step)return vShopCart();
  const v=sh.v,crumbs=SH_STEPS.filter(k=>v[k]!==undefined&&k!=='qty').map(k=>`<span>${esc(shLabel(k,v[k]))}</span>`).join('');
  const head=`<div class="shead">${sh.hist.length||S.cart.length||S.editing?`<button type="button" class="btn back" data-act="shback">← Retour</button>`:''}
    ${crumbs?`<div class="crumbs">${crumbs}</div>`:''}</div>
    <h2 class="q">${SH_Q[sh.step]}</h2>`;
  if(sh.step==='qty')return head+shQty();
  if(sh.step==='grid')return head+`<div class="count">${sumLine(shPool('taille'),{shop:1})} pour ce choix</div>`+shGrid();
  const o=shOpts(sh.step);
  let keys=[...o.keys()];
  const tot=`<div class="count">${sumLine(shPool(sh.step),{shop:1})}${sh.step==='type'?' en tout':' pour ce choix'}</div>`;
  if(sh.step==='type')keys=Object.keys(TYPE);
  const sorter={taille:(x,y)=>sizeRankStr(x)-sizeRankStr(y),genre:(x,y)=>'HFU'.indexOf(x)-'HFU'.indexOf(y)}[sh.step]||((x,y)=>x===''?1:y===''?-1:x.localeCompare(y));
  if(sh.step!=='type')keys.sort(sorter);
  const tile=x=>{const c=o.get(x)||{n:0,stock:0};const z=!c.stock;
    const sub=sh.step==='type'?(c.n?`${c.stock} en stock`:'aucun enregistré'):z?'Rupture de stock':`${c.stock} en stock`;
    return `<button type="button" class="tile${sh.step==='type'?' big t-'+x:''}${z?' zero':''}" data-act="shpick" data-k="${sh.step}" data-v="${esc(x)}">${sh.step==='type'?PIC[x]||'':''}${esc(shLabel(sh.step,x))}<small>${sub}</small></button>`;};
  const empty=!keys.length?`<div class="empty">Rien d'enregistré ici pour l'instant.</div>`:'';
  return head+tot+`<div class="tiles${sh.step==='taille'?' sizes':''}">${keys.map(tile).join('')}</div>${empty}
    <details class="libre"><summary>Pas dans la liste ? Écrire la demande</summary>
      <div class="inline"><div class="field"><label for="freeTxt">Ce que vous cherchez</label><input type="text" id="freeTxt" placeholder="Ex. : Burton Ion 10.5 noir" value="${esc([v.marque,v.modele,v.genre&&GENRE[v.genre],v.taille&&shLabel('taille',v.taille)].filter(Boolean).join(' '))}"></div>
      <div class="field" style="flex:0 0 70px"><label for="freeQty">Nombre</label><input type="number" id="freeQty" min="1" max="50" value="1" style="text-align:center"></div>
      <button type="button" class="btn" data-act="free">Ajouter</button></div></details>`;}


/* Grille : toutes les tailles du modèle, un compteur − n + par taille, bouton fixe en bas */
function shGridPool(){const sh=st.sh,pool=shPool('taille');
  /* les articles sans couleur précisée s'affichent avec toutes les couleurs */
  const cols=new Map();pool.forEach(a=>{const c=a.couleur||'';cols.set(c,(cols.get(c)||0)+availOf(a));});
  if(cols.size>1&&cols.has(''))cols.delete('');
  if(cols.size>1&&(sh.v.couleur===undefined||!cols.has(sh.v.couleur)))sh.v.couleur=[...cols.entries()].sort((x,y)=>y[1]-x[1])[0][0];
  const list=cols.size>1?pool.filter(a=>!a.couleur||(a.couleur||'')===sh.v.couleur):pool;
  const by=new Map();list.forEach(a=>{const r=by.get(a.taille)||{z:a.taille,arts:[],n:0};r.arts.push(a);r.n+=availOf(a);by.set(a.taille,r);});
  const rows=[...by.values()].sort((x,y)=>sizeRankStr(x.z)-sizeRankStr(y.z));
  return {cols,rows,a:pool[0]};}
function gridTot(){return Object.values(st.sh.gq||{}).reduce((x,y)=>x+(y||0),0);}
function shGrid(){const sh=st.sh,{cols,rows,a}=shGridPool();if(!a)return '<div class="empty">Rien d\'enregistré.</div>';
  const gq=sh.gq=sh.gq||{},tot=gridTot(),pl=a.type==='fix'?['article','articles']:a.type==='board'&&!SKI?['planche','planches']:['paire','paires'];
  const over=rows.filter(r=>(gq[r.z]||0)>r.n);
  return `<div class="card pickd"><div class="t"><span class="mk">${esc(a.marque)}</span> ${esc(a.modele)}</div>
      <div class="d">${esc([TYPE[a.type],GENRE[sh.v.genre],serOf(a)].filter(Boolean).join(' · '))}</div></div>
    ${cols.size>1?`<div class="gcols">${[...cols.entries()].map(([c,n])=>`<button type="button" class="sz" data-act="gcol" data-v="${esc(c)}" aria-pressed="${sh.v.couleur===c}">${esc(c||'Sans couleur')}<small>${n}</small></button>`).join('')}</div>`:''}
    <div class="grid">${rows.map(r=>{const q=gq[r.z]||0,warn=q>r.n;
      return `<div class="grow${q?' on':''}${!r.n?' zero':''}${warn?' warn':''}">
        <div class="gz"><b>${esc(szLbl(a.type,r.z))}</b><small>${r.n?`${r.n} en stock`:'Rupture'}${warn?` · il en manque ${q-r.n}`:''}${cols.size>1&&r.arts.some(x=>!x.couleur)?' · couleur non précisée':''}</small></div>
        <div class="gstep"><button type="button" data-act="gq" data-z="${esc(r.z)}" data-d="-1" aria-label="Moins"${q?'':' disabled'}>−</button>
          <input type="number" inputmode="numeric" min="0" max="50" value="${q||''}" placeholder="0" data-gqi="${esc(r.z)}" aria-label="Nombre ${esc(szLbl(a.type,r.z))}">
          <button type="button" data-act="gq" data-z="${esc(r.z)}" data-d="1" aria-label="Plus">+</button></div></div>`;}).join('')}</div>
    <div class="gfoot">${over.length?`<div class="alert warn sm">⚠ Plus que le stock pour ${over.map(r=>esc(szLbl(a.type,r.z))).join(', ')} : l'entrepôt ne pourra pas tout fournir.</div>`:''}
      <button type="button" class="btn primary block" data-act="gadd" id="gaddBtn"${tot?'':' disabled'}>${tot?`Ajouter ${tot} ${tot>1?pl[1]:pl[0]} à la commande`:'Choisissez les quantités'}</button></div>`;}
function gridAdd(){const {rows,a}=shGridPool(),gq=st.sh.gq||{};let n=0;
  rows.forEach(r=>{let rest=gq[r.z]||0;if(!rest)return;n+=rest;
    const g=r.arts.slice().sort((x,y)=>availOf(y)-availOf(x));
    const put=(x,k)=>{const ex=S.cart.find(l=>l.aid===x.id);if(ex)ex.qty+=k;else S.cart.push({aid:x.id,qty:k});};
    g.forEach(x=>{const k=Math.min(availOf(x),rest);if(k>0){put(x,k);rest-=k;}});if(rest>0)put(g[0],rest);});
  return {n,a};}

function shQty(){const sh=st.sh,g=shPool('qty');const tot=g.reduce((s,a)=>s+availOf(a),0),q=sh.q;
  const a=g[0];const locs=[...new Set(g.map(x=>x.emp))].sort((x,y)=>locRank(x)-locRank(y));

function shopClick(act,t){

    case'gq':{const z=t.dataset.z,gq=st.sh.gq=st.sh.gq||{};gq[z]=Math.max(0,Math.min(50,(gq[z]||0)+(+t.dataset.d)));render();return true;}

/* boîte de bottes moyenne : moyenne des boîtes de toutes les paires en stock (chaque paire compte) */

      if(ex){ex.qty=qOf(ex)+r.q;added++;}else S.articles.push({id:'a'+stamp+i,...base,couleur,taille:r.s,qty:r.q});});}

}

/* « noir » est toujours enregistré « Black » */
function fixColor(c){return /^noire?$/i.test(String(c||'').trim())?'Black':c;}
/* Entrée dans un formulaire : passe à la case du dessous au lieu d'enregistrer */
function enterNav(f){
  f.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||e.isComposing)return;const t=e.target;
    if(!(t instanceof HTMLInputElement)||['button','submit','checkbox','radio'].includes(t.type))return;
    e.preventDefault();
    if(t.id==='m-call'){$('#m-apply').click();return;}
    const col=['mc','mqi','fqi'].find(k=>t.dataset[k]!==undefined);
    let next=null;
    if(col){const all=[...f.querySelectorAll(`[data-${col}]`)].filter(x=>!x.closest('.gone'));next=all[all.indexOf(t)+1];}
    else{const all=[...f.querySelectorAll('input:not([type=hidden]),select')].filter(x=>!x.disabled&&x.offsetParent!==null);next=all[all.indexOf(t)+1];}
    const go=n=>{n.focus();if(n.select)try{n.select();}catch(_){}};
    if(!next){t.blur();return;}
    if(col){/* enregistrer d'abord la valeur (la liste peut se redessiner), puis retrouver la case suivante */
      const key=next.dataset[col];t.dispatchEvent(new Event('change',{bubbles:true}));
      const n=[...f.querySelectorAll(`[data-${col}]`)].find(x=>x.dataset[col]===key);if(n)go(n);return;}
    go(next);});}
function colorOpts(){return [...new Set(['Black','Blanc','Gris','Bleu','Rouge','Vert','Rose','Violet','Beige','Kaki',...S.articles.map(x=>x.couleur).filter(Boolean)])].sort((x,y)=>x.localeCompare(y)).map(c=>`<option value="${esc(c)}"></option>`).join('');}

  if(map[t.id]){st[map[t.id]]=t.value;if(t.id==='fMarque')st.fModele='';st.focus=null;render();}});
const ENTER_NEXT=[['bxMarque','bxModele','bxFrom','bxTo','bxL','bxl','bxH','@boxadd'],['ovL','ovP','ovH','ovNote','@dimoveradd']];
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id){for(const seq of ENTER_NEXT){const i=seq.indexOf(e.target.id);if(i<0)continue;e.preventDefault();const nx=seq[i+1];
    if(nx&&nx[0]==='@'){const b=document.querySelector(`[data-act="${nx.slice(1)}"]`);if(b)b.click();setTimeout(()=>{const f=$(nx==='@boxadd'?'#bxL':'#ovL');if(f)f.focus();},60);}
    else if(nx){const f=$('#'+nx);if(f){f.focus();if(f.select&&f.tagName==='INPUT')f.select();}}
    return;}}
  if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.id==='freeTxt'){e.preventDefault();document.querySelector('[data-act="free"]').click();}
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('add-')){e.preventDefault();e.target.nextElementSibling;document.querySelector(`[data-act="addtag"][data-k="${e.target.id.slice(4)}"]`).click();}});
/* ---------- Synchro en ligne (Firebase) : le stock, les commandes et les avis passent d'un téléphone à l'autre ---------- */
const FB_CONFIG={apiKey:"AIzaSyDDC3AhQPbLAy8hGg9txd_kooWxOM5UrPk",authDomain:"entrepotsnow.firebaseapp.com",projectId:"entrepotsnow",
  storageBucket:"entrepotsnow.firebasestorage.app",messagingSenderId:"754342580173",appId:"1:754342580173:web:20ee46db9b4aab080c7e84"};
const FBU='https://www.gstatic.com/firebasejs/10.12.2/';
const STOCK_KEYS=['articles','brands','sizesB','sizesF','sizesS','demo','caps','dims','lock','ntfy'];
/* En ligne, chaque article est un document à part (collection « arts ») : deux personnes qui changent
   des articles différents en même temps ne s'écrasent plus. cfg/stock ne garde que les réglages (listes, mesures…). */
const CFG_KEYS=STOCK_KEYS.filter(k=>k!=='articles');
/* ?ns=test : bac à sable pour les essais, sans toucher aux vraies données */
const NS=(()=>{try{return (new URLSearchParams(location.search).get('ns')||'').replace(/[^a-z0-9]/gi,'');}catch(e){return'';}})();
const C=n=>(NS?NS+'_':'')+(RANDO?'rando_':SKI?'ski_':'')+n;
const cloud={on:false,fs:null,db:null,pending:false,sent:{stock:null,arts:null,orders:null,notifs:null},journal:[],backups:null};
const stockJson=()=>JSON.stringify(Object.fromEntries(STOCK_KEYS.map(k=>[k,S[k]])));
const cfgJson=()=>JSON.stringify(Object.fromEntries(CFG_KEYS.map(k=>[k,S[k]])));
const artDocId=id=>String(id).replace(/\//g,'_');
const dayId=(t=Date.now())=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
let pushMeta=null; /* étiquette de la prochaine modification (annulation, retour à une sauvegarde…) pour l'historique */
function setSync(state,txt){const e=$('#sync');if(!e)return;e.dataset.s=state;e.textContent=txt;}
/* ne pas redessiner sous les doigts de quelqu'un qui tape */
function softRender(){const ae=document.activeElement;
  if(ae&&$('#view').contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){cloud.pending=true;return;}render();}
document.addEventListener('focusout',()=>{if(!cloud.pending)return;setTimeout(()=>{const ae=document.activeElement;
  if(!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))){cloud.pending=false;render();}},60);});
/* texte lisible d'un changement d'articles, pour l'historique */
function chText(c){const b=c.b&&JSON.parse(c.b),a=c.a&&JSON.parse(c.a),x=a||b,nm=`${x.marque} ${x.modele} ${szLbl(x.type,x.taille)}`;
  if(a&&b){if(a.emp!==b.emp)return `${nm} : ${b.emp} → ${a.emp}${qOf(a)!==qOf(b)?` (${qOf(b)} → ${qOf(a)})`:` (×${qOf(a)})`}`;
    if(qOf(a)!==qOf(b))return `${nm} en ${a.emp} : ${qOf(b)} → ${qOf(a)}`;return `${nm} en ${a.emp} : fiche modifiée`;}
  return a?`+ ${nm} en ${a.emp} ×${qOf(a)}`:`− ${nm} en ${b.emp} ×${qOf(b)}`;}
function cloudPush(){
  if(!cloud.on)return;const {fs,db}=cloud;
  if(role==='entrepot'){
    if(cloud.sent.stock!==null){const j=cfgJson();if(j!==cloud.sent.stock){cloud.sent.stock=j;fs.setDoc(fs.doc(db,C('cfg'),'stock'),{json:j,v:2,at:Date.now()}).then(()=>{cloud.cfgSrv=JSON.parse(j);if(st.tab==='settings')softRender();}).catch(cloudErr);}}
    if(cloud.sent.arts)pushArts();}
  else if(cloud.sent.arts&&pushMeta&&(pushMeta.kind==='pickup'||pushMeta.kind==='undo'))pushArts(); /* magasin : seulement un pick-up */
  [['orders',S.orders],['notifs',S.notifs]].forEach(([col,arr])=>{const sent=cloud.sent[col];if(!sent)return;
    const seen=new Set();
    arr.forEach(x=>{const id=String(x.id).replace('.','_'),j=JSON.stringify(x);seen.add(id);
      if(sent.get(id)!==j){sent.set(id,j);fs.setDoc(fs.doc(db,C(col),id),{json:j,at:Date.now()}).catch(cloudErr);}});
    [...sent.keys()].forEach(id=>{if(!seen.has(id)){sent.delete(id);fs.deleteDoc(fs.doc(db,C(col),id)).catch(cloudErr);}});});}
/* n'envoie que les articles changés (par lots), et note le changement dans l'historique */
function pushArts(){const {fs,db}=cloud,sent=cloud.sent.arts,seen=new Set(),ch=[];
  S.articles.forEach(a=>{const id=artDocId(a.id),j=JSON.stringify(a);seen.add(id);const b=sent.get(id)||null;if(b!==j)ch.push({id,b,a:j});});
  [...sent.keys()].forEach(id=>{if(!seen.has(id))ch.push({id,b:sent.get(id),a:null});});
  const meta=pushMeta;pushMeta=null;if(!ch.length)return;const at=Date.now();
  for(let i=0;i<ch.length;i+=400){const B=fs.writeBatch(db);
    ch.slice(i,i+400).forEach(c=>{const r=fs.doc(db,C('arts'),c.id);if(c.a){sent.set(c.id,c.a);B.set(r,{json:c.a,at});}else{sent.delete(c.id);B.delete(r);}});
    B.commit().catch(cloudErr);}
  const big=ch.reduce((n,c)=>n+(c.a||'').length+(c.b||'').length,0)>700000,lines=ch.slice(0,12).map(chText);
  const jid=at+'-'+Math.random().toString(36).slice(2,6),entry={at,by:me()||'',n:ch.length,lines,kind:meta&&meta.kind||'',label:meta&&meta.label||'',ref:meta&&meta.ref||'',groups:meta&&meta.groups||'',ch:big?null:ch};
  fs.setDoc(fs.doc(db,C('journal'),jid),entry).catch(cloudErr);
  if(entry.kind!=='undo'&&entry.ch){cloud.myLast={id:jid,...entry};undoBar(entry);}else undoBar(null);}
/* ---------- Annuler partout : bouton ↶ en haut, et bandeau après chaque modification du stock ---------- */
let undoBarT;
function undoBar(e){const b=$('#undoBar');if(!b)return;clearTimeout(undoBarT);if(!e){b.hidden=true;return;}
  b.innerHTML=`<span>✓ ${esc(e.lines[0]||'Stock modifié')}${e.n>1?` <small class="opt">(+ ${e.n-1})</small>`:''}</span><button type="button" class="btn sm primary" data-act="undomine">↶ Annuler</button>`;b.hidden=false;
  undoBarT=setTimeout(()=>{b.hidden=true;},12000);}
function updUndo(){const u=$('#undoTop');if(u)u.hidden=!(role==='entrepot'&&cloud.on&&jrLast());}
function undoAsk(){const e=jrLast();if(!e){toast('Rien à annuler');return;}
  sheet(`<div class="sheet-in" style="display:flex;flex-direction:column;gap:12px">
    <div class="sheet-h"><h2>Annuler la dernière modification ?</h2><button type="button" class="btn ghost" data-act="close">Non</button></div>
    <div class="info"><b>${fmtDT(e.at)}</b>${e.by?' · '+esc(e.by):''} · ${e.n} article${e.n>1?'s':''}${e.label?' · '+esc(e.label):''}<br>${(e.lines||[]).slice(0,8).map(esc).join('<br>')}${e.n>8?`<br><small>+ ${e.n-8} autre${e.n-8>1?'s':''}</small>`:''}</div>
    <p class="sub">Le stock sera remis comme juste avant, pour tout le monde. Vous pourrez annuler encore la modification d'avant, une par une (Réglages › Historique).</p>
    <button type="button" class="btn primary block" data-act="undogo" data-id="${esc(e.id)}">↶ Oui, annuler cette modification</button></div>`);}
function cloudErr(e){console.warn('Synchro',e);setSync('off','Hors ligne');}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
/* ---------- Historique : annuler la dernière modification du stock ---------- */
const jrLast=()=>cloud.journal.find(e=>!e.undone&&e.kind!=='undo'&&e.ch);
function undoJournal(e){if(!cloud.on||!cloud.sent.arts||!e||!e.ch)return;const cur=cloud.sent.arts;
  const bad=e.ch.filter(c=>(cur.get(c.id)||null)!==c.a);
  if(bad.length){toast(`Impossible d'annuler : ${bad.length} article${bad.length>1?'s ont':' a'} été modifié${bad.length>1?'s':''} depuis (${esc(chText({b:bad[0].a||bad[0].b,a:cur.get(bad[0].id)||null}).slice(0,60))}…).`);return;}
  e.ch.forEach(c=>{const i=S.articles.findIndex(a=>artDocId(a.id)===c.id);
    if(c.b){const o=JSON.parse(c.b);if(i>=0)S.articles[i]=o;else S.articles.push(o);}else if(i>=0)S.articles.splice(i,1);});
  pushMeta={kind:'undo',ref:e.id,label:'Annulation'};save();
  cloud.fs.updateDoc(cloud.fs.doc(cloud.db,C('journal'),e.id),{undone:Date.now(),undoneBy:me()||''}).catch(cloudErr);
  render();toast(`<b>Annulé</b> : ${e.n} article${e.n>1?'s':''} remis comme avant`);}
/* ---------- Sauvegardes : une copie complète par jour (à la première ouverture), 30 jours gardés ---------- */
async function backupMake(id,why){const {fs,db}=cloud,at=Date.now();
  await fs.setDoc(fs.doc(db,C('backups'),id),{at,by:me()||'',why:why||'',n:S.articles.length,p:S.articles.reduce((t,a)=>t+qOf(a),0),json:stockJson()});
  const ix=fs.doc(db,C('cfg'),'backups'),d=await fs.getDoc(ix),list=(d.exists()&&d.data().list||[]).filter(x=>x.id!==id);
  list.push({id,at,why:why||'',n:S.articles.length,p:S.articles.reduce((t,a)=>t+qOf(a),0),by:me()||''});list.sort((x,y)=>x.at-y.at);
  const old=list.splice(0,Math.max(0,list.length-30));old.forEach(x=>fs.deleteDoc(fs.doc(db,C('backups'),x.id)).catch(()=>{}));
  await fs.setDoc(ix,{list});cloud.backups=list;}
async function dailyBackup(){if(cloud.bk||role!=='entrepot'||!cloud.on||!cloud.sent.arts||!cloud.sent.arts.size)return;cloud.bk=1;
  try{const {fs,db}=cloud,id=dayId(),d=await fs.getDoc(fs.doc(db,C('backups'),id));if(!d.exists())await backupMake(id,'Sauvegarde du jour');
    const old=await fs.getDocs(fs.query(fs.collection(db,C('journal')),fs.where('at','<',Date.now()-30*864e5)));old.forEach(x=>fs.deleteDoc(x.ref).catch(()=>{}));
    const oldP=await fs.getDocs(fs.query(fs.collection(db,C('scans')),fs.where('doneAt','<',Date.now()-30*864e5)));oldP.forEach(x=>fs.deleteDoc(x.ref).catch(()=>{})); /* photos traitées : gardées 30 jours */}
  catch(e){console.warn('Sauvegarde',e);}}
async function backupsLoad(){if(!cloud.on)return;try{const d=await cloud.fs.getDoc(cloud.fs.doc(cloud.db,C('cfg'),'backups'));cloud.backups=d.exists()&&d.data().list||[];}catch(e){cloud.backups=[];}softRender();}
async function doRestore(id){if(!cloud.on)return;const {fs,db}=cloud;
  try{const d=await fs.getDoc(fs.doc(db,C('backups'),id));if(!d.exists()){toast('Sauvegarde introuvable');return;}
    const old=JSON.parse(d.data().json);
    await backupMake(dayId()+'-avant-retour-'+new Date().toTimeString().slice(0,5).replace(':','h'),'Avant le retour au '+id);
    S.articles=old.articles||[];pushMeta={kind:'restore',ref:id,label:'Retour à la sauvegarde du '+id};save();render();
    toast(`Stock remis comme le <b>${esc(id)}</b> : ${S.articles.length} articles. L'état d'avant est gardé dans les sauvegardes.`);}
  catch(e){console.warn(e);toast('Le retour à la sauvegarde a échoué (connexion ?)');}}
async function cloudStart(){
  if(location.protocol==='file:'||location.protocol==='data:'){setSync('off','Fichier local, pas en ligne');return;}
  setSync('wait','Connexion…');
  const late=setTimeout(()=>{if(!cloud.on)setSync('off','Hors ligne');},15000);
  try{
    const [app,auth,fs]=await Promise.all([import(FBU+'firebase-app.js'),import(FBU+'firebase-auth.js'),import(FBU+'firebase-firestore.js')]);
    const a=app.initializeApp(FB_CONFIG);
    await auth.signInAnonymously(auth.getAuth(a));
    const db=fs.getFirestore(a);Object.assign(cloud,{fs,db,on:true});
    const unreadIds=()=>new Set(unread().map(n=>String(n.id)));
    /* passage à l'ancien format (tout le stock dans cfg/stock) → un document par article, une seule fois */
    let cfgArts=null,artsSeen=false,migrating=false;
    const tryMigrate=async()=>{if(migrating||!artsSeen||!cfgArts||!cfgArts.length||(cloud.sent.arts&&cloud.sent.arts.size))return;migrating=true;
      try{for(let i=0;i<cfgArts.length;i+=400){const B=fs.writeBatch(db);cfgArts.slice(i,i+400).forEach(x=>B.set(fs.doc(db,C('arts'),artDocId(x.id)),{json:JSON.stringify(x),at:Date.now()}));await B.commit();}
        const j=cfgJson();cloud.sent.stock=j;await fs.setDoc(fs.doc(db,C('cfg'),'stock'),{json:j,v:2,at:Date.now()});}
      catch(e){console.warn('Migration',e);migrating=false;}};
    /* le stock est en ligne mais pas les réglages (mesures, boîtes, listes) : on les envoie depuis cet appareil */
    const cfgBoot=()=>{if(!cloud.noCfg||role!=='entrepot'||!cloud.sent.arts||!cloud.sent.arts.size)return;
      cloud.noCfg=false;cloud.empty=false;cloud.sent.stock='';cloudPush();softRender();};
    /* réglages (listes, mesures, mot de passe) */
    fs.onSnapshot(fs.doc(db,C('cfg'),'stock'),snap=>{
      if(!snap.exists()){cloud.empty=true;cloud.noCfg=true;cfgBoot();softRender();return;}
      cloud.empty=false;cloud.noCfg=false;
      const o=JSON.parse(snap.data().json);
      /* première réception : les boîtes mesurées sur cet appareil et pas encore en ligne sont ajoutées (rien n'est perdu) */
      const mine=!cloud.cfgSeen&&S.dims&&Array.isArray(S.dims.boxes)?S.dims.boxes.slice():[];cloud.cfgSeen=true;
      if(Array.isArray(o.articles)&&o.articles.length&&!(cloud.sent.arts&&cloud.sent.arts.size)){cfgArts=fixEmps(o.articles);S.articles=o.articles;tryMigrate();}
      else if(o.articles&&cloud.sent.arts&&cloud.sent.arts.size&&role==='entrepot')setTimeout(()=>{cloud.sent.stock='';cloudPush();},1500); /* migration coupée en route, ou ancienne version de l'appli : on retire les articles de cfg */
      if(!snap.metadata.hasPendingWrites)cloud.cfgSrv=o; /* ce que le serveur a vraiment */
      /* canaux de notification créés sur cet appareil sans arriver en ligne (hors ligne, ancienne version…) : on les envoie */
      const ntfyLocal=!o.ntfy&&S.ntfy&&S.ntfy.entrepot&&role==='entrepot';
      CFG_KEYS.forEach(k=>{if(o[k]!==undefined)S[k]=o[k];});cloud.sent.stock=cfgJson();
      if(ntfyLocal){cloud.sent.stock='';setTimeout(cloudPush,500);}
      if(mine.length){const cur=dims().boxes,ids=new Set(cur.map(b=>b.id)),add=mine.filter(b=>b&&b.id&&!ids.has(b.id));
        if(add.length){cur.push(...add);cloud.sent.stock='';if(role==='entrepot')cloudPush();toast(`${add.length} taille${add.length>1?'s':''} de boîte de cet appareil envoyée${add.length>1?'s':''} en ligne`);}}
      saveLocal();softRender();setSync('on','En ligne');
    },cloudErr);
    /* articles : un document chacun */
    fs.onSnapshot(fs.collection(db,C('arts')),qs=>{
      const m=new Map();qs.forEach(d=>m.set(d.id,d.data().json));artsSeen=true;
      const first=!cloud.sent.arts;
      if(!m.size){if(cfgArts&&cfgArts.length){tryMigrate();return;}if(first&&S.articles.length)return; /* base vide : on attend le bouton « Envoyer » */}
      cloud.sent.arts=m;S.articles=fixEmps([...m.values()].map(x=>JSON.parse(x)));
      if(SKI&&!RANDO&&role==='entrepot'&&!cloud.fsMig){const L=S.articles.filter(a=>/^FS2\.[1-3]$/.test(a.emp||''));cloud.fsMig=1;
        if(L.length){L.forEach(a=>{a.emp='FS1.'+a.emp.slice(4);});pushMeta={kind:'move',label:'Fond : FS2 fusionné avec FS1'};setTimeout(()=>{save();render();},0);}}
      saveLocal();softRender();setSync('on','En ligne');dailyBackup();cfgBoot();
    },cloudErr);
    [['orders','orders'],['notifs','notifs']].forEach(([col,key])=>{
      fs.onSnapshot(fs.collection(db,C(col)),qs=>{
        const m=new Map();qs.forEach(d=>m.set(d.id,d.data().json));
        const first=!cloud.sent[col];
        if(first&&!m.size&&cloud.empty&&S[key].length)return; /* base vide : on attend le bouton « Envoyer » */
        const before=unreadIds();
        cloud.sent[col]=m;
        S[key]=[...m.values()].map(x=>JSON.parse(x));
        if(key==='orders')S.orders.sort((x,y)=>x.at-y.at);
        saveLocal();softRender();setSync('on','En ligne');
        if(key==='notifs'&&!first){const fresh=unread().filter(n=>!before.has(String(n.id)));
          if(fresh.length){toast(`🔔 <b>${esc(fresh[fresh.length-1].text)}</b>`,true);try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}}
      },cloudErr);});
    /* photos à traiter (entrepôt) : seulement celles pas encore traitées */
    if(role==='entrepot')fs.onSnapshot(fs.query(fs.collection(db,C('scans')),fs.where('st','==','todo')),qs=>{
      cloud.scans=qs.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>x.at-y.at);softRender();},e=>console.warn('Photos à traiter',e));
    /* historique : les 20 dernières modifications du stock */
    if(role==='entrepot')fs.onSnapshot(fs.query(fs.collection(db,C('journal')),fs.orderBy('at','desc'),fs.limit(20)),qs=>{
      cloud.journal=qs.docs.map(d=>({id:d.id,...d.data()}));updUndo();if(st.tab==='settings'||st.tab==='move')softRender();},e=>console.warn('Historique',e));
  }catch(e){console.warn('Synchro indisponible',e);cloud.on=false;setSync('off','Hors ligne');}
}
window.addEventListener('offline',()=>setSync('off','Hors ligne'));
window.addEventListener('online',()=>{if(cloud.on)setSync('on','En ligne');});
render();
cloudStart();
