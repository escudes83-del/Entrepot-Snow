<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<link rel="manifest" href="manifest-entrepot.webmanifest">
<link rel="icon" href="icon-entrepot-v2-192.png">
<link rel="apple-touch-icon" href="icon-entrepot-v2-192.png">
<meta name="apple-mobile-web-app-title" content="Entrepôt">
<title>Entrepôt Snow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : appli mobile, en-tête sombre type signalétique d'entrepôt, barre d'onglets en bas, plan du U au centre */
:root{
  --bg:#edf1f4; --surface:#ffffff; --surface-2:#f5f8fa; --ink:#17212b; --muted:#5a6876;
  --line:#d2dae1; --line-strong:#9fb0bf; --head:#17212b; --head-ink:#f2f5f7;
  --accent:#e2570f; --accent-ink:#ffffff; --fill:#d6e6f3; --fill-line:#8fb4d3;
  --ok:#2c7d47; --ok-bg:#dcefe2; --warn:#99610d; --warn-bg:#f8ecd3; --bad:#b2322a; --bad-bg:#f6dcd9; --info:#1f5f99; --info-bg:#dbe9f6;
  --hatch:#c9d3dc;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --surface-2:#1d2832; --ink:#e6ecf1; --muted:#94a3b1;
  --line:#2b3844; --line-strong:#4b5e70; --head:#0a0f14; --head-ink:#e6ecf1;
  --accent:#ff7a33; --accent-ink:#1a0d04; --fill:#20384d; --fill-line:#3f6d93;
  --ok:#6fcf8e; --ok-bg:#183a25; --warn:#e7b25a; --warn-bg:#3b2c12; --bad:#f08a80; --bad-bg:#43201d; --info:#7db7ea; --info-bg:#173149;
  --hatch:#2f3d4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --surface-2:#1d2832; --ink:#e6ecf1; --muted:#94a3b1;
  --line:#2b3844; --line-strong:#4b5e70; --head:#0a0f14; --head-ink:#e6ecf1;
  --accent:#ff7a33; --accent-ink:#1a0d04; --fill:#20384d; --fill-line:#3f6d93;
  --ok:#6fcf8e; --ok-bg:#183a25; --warn:#e7b25a; --warn-bg:#3b2c12; --bad:#f08a80; --bad-bg:#43201d; --info:#7db7ea; --info-bg:#173149;
  --hatch:#2f3d4a; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--head);color:var(--head-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;background:var(--accent);transform:skewX(-14deg)}
.role{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--head-ink)}
.role .seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.role .seg button{color:var(--head-ink)}
.role .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

main{max-width:980px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-disp);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{color:var(--muted);margin:0;font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tabs button svg{width:22px;height:22px}
@media (max-width:400px){.tabs button{font-size:11px;padding:10px 2px 12px}.tabs button[aria-current="page"] svg{padding:3px 8px}}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--f-mono);padding:0 5px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:9px 10px;width:100%;box-sizing:border-box;min-width:0}
textarea{resize:vertical;min-height:60px}
.search{font-size:17px;padding:12px 14px !important}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select{width:auto;padding:6px 8px;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.fgrid select{padding:7px 8px;font-size:14px}
.szs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.szl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.sz{min-width:44px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font:700 14px var(--f-mono);cursor:pointer;display:inline-flex;align-items:baseline;gap:3px;justify-content:center}
.sz small{font:500 10px var(--f-body);color:var(--muted)}
.sz[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sz[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.sz.have{border-style:dashed}
.sz .qx{font:600 11px var(--f-mono);color:var(--muted);margin-left:2px}
.sz[aria-pressed="true"] .qx{color:var(--accent-ink)}
.sz.zero{border-color:var(--bad);border-style:dashed;color:var(--bad)}
.sz.zero .qx{color:var(--bad)}
.qn{color:var(--ink);font-weight:700}
.qn.zero{color:var(--bad)}
.qrows{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.qhead{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qsz{font:700 15px var(--f-mono)}
.m3{display:grid;grid-template-columns:62px minmax(0,1fr) auto 30px;gap:6px;align-items:center}
.m3 .del{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--bad);font-size:15px;cursor:pointer;padding:0}
.qrow.gone{opacity:.45}.qrow.gone .qsz{text-decoration:line-through;color:var(--bad)}
.qrow.gone input,.qrow.gone .stepper button{pointer-events:none}
.qrow.gone .del{background:var(--bad);color:#fff;border-color:var(--bad)}
.m3 input[type=text]{min-width:0;width:100%;box-sizing:border-box}
@media (max-width:480px){.m3{grid-template-columns:58px minmax(0,1fr) auto 28px;gap:5px}
  .m3 .stepper button{width:28px}.m3 .qty{width:38px !important}.m3 .del{width:28px;height:28px}
  .m3 input[type=text]{padding:9px 6px}}
.mixed{font-size:12px;color:var(--warn)}
.var{display:flex;flex-direction:column;gap:4px;padding-left:8px;border-left:3px solid var(--line-strong)}
.vl{font-size:12px;font-weight:600;color:var(--muted)}
.mk{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--info);margin-right:10px}

.code{font:700 15px var(--f-mono);letter-spacing:.02em;background:var(--ink);color:var(--surface);border-radius:4px;padding:6px 8px;border:0;cursor:pointer;white-space:nowrap;min-width:64px;text-align:center}
.code.none{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-strong);cursor:default;font-size:12px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .d{color:var(--muted);font-size:13px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:20px;text-align:center;color:var(--muted)}
.count{font-size:13px;color:var(--muted)}
.demo{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:2px 6px}

/* Plan : bouton Plan / 3D et vue 3D */
.seg3d{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.seg3d button{font:600 14px var(--f-body,inherit);padding:8px 16px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px}
.seg3d button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.p3d{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:10px;align-items:start}
.p3d-stage{position:relative;height:clamp(360px,64vh,740px);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);touch-action:none}
.p3d-stage canvas{display:block;width:100%;height:100%}
.p3d-msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted)}
.p3d-hint{position:absolute;left:8px;bottom:8px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;pointer-events:none}
.p3d-bar{grid-column:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.p3d-views{display:flex;flex-wrap:wrap;gap:6px}
.seg3d.sm button{min-height:34px;padding:5px 12px;font-size:13px}
.p3d-tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:4px 8px;font-size:13px;white-space:nowrap;transform:translate(14px,-130%);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.p3d-sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.p3d-pick li{align-items:center}.p3d-q{display:flex;align-items:center;gap:4px;flex:none}.p3d-q input{width:58px;font:inherit;padding:3px 6px}
.p3d-mv{display:flex;gap:6px}.p3d-mv select{flex:1;min-width:0}
.p3d-ok{display:flex;flex-direction:column;gap:6px;background:var(--ok-bg);color:var(--ok);border-radius:6px;padding:8px;font-weight:600}
.p3d-warn{color:var(--bad);font-size:13px;margin:0}
.p3d-list li.click{cursor:pointer}.p3d-list li.click:hover{background:var(--surface-2)}
.p3d-side{grid-column:2;grid-row:1/span 2;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.p3d .legend{grid-column:1/-1}
.p3d-code{font:700 24px var(--f-mono);color:var(--accent)}
.p3d-nums{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.p3d-nums b{display:block;font:700 22px var(--f-disp)}.p3d-nums span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.p3d-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;max-height:320px;overflow:auto}
.p3d-list li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:4px}.p3d-list li span:last-child{font-family:var(--f-mono);color:var(--muted)}
@media (max-width:760px){.p3d{grid-template-columns:minmax(0,1fr)}.p3d-side{grid-column:1;grid-row:auto}}
/* Plan */
.plan-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.plan{display:grid;min-width:280px;gap:5px;
  grid-template-columns:minmax(46px,.8fr) minmax(30px,.5fr) minmax(126px,1.6fr) minmax(12px,.35fr) minmax(66px,1fr);
  grid-template-areas:"fond fond fond fond fond" "g pl m al d" "ent ent ent ent ext"}
.col{display:flex;flex-direction:column;gap:5px}
/* gauche et droite : 5 racks plus longs sur la même longueur que les 6 du milieu, D1 aligné avec M1 */
.col.long .rack{flex:1}
.rack{border:1.5px solid var(--line-strong);border-radius:4px;background:var(--surface-2);padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:46px;box-sizing:border-box}
.mrow{display:flex;gap:5px;align-items:center}
.mrow .sep{width:1px;align-self:stretch;background:var(--line-strong)}
.rack.off{border-style:dashed;opacity:.55;justify-content:center}
.rk{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.03em;white-space:nowrap}
.rack.off .rk{font-weight:600;color:var(--muted)}
.chips{display:flex;gap:2px}
.chip{width:18px;height:22px;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface);font:600 11px var(--f-mono);color:var(--muted);cursor:pointer;padding:0;display:grid;place-items:center}
.chip.has{background:var(--fill);color:var(--ink);border-color:var(--fill-line)}
.chip.hit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.chip.void{visibility:hidden}
.zone-lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-disp);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center}
.plz{display:flex;gap:3px}.plz .pl{flex:0 0 38%}.plz>.zone-lbl:last-child{flex:1}
.pl{background:repeating-linear-gradient(-55deg,var(--hatch) 0 2px,transparent 2px 7px);border-radius:3px}
.fond{grid-area:fond}
/* Lumière de l'allée de droite */
.plan-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lightbtn{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-strong);background:#0b0f14;color:#cbd5e1;font:inherit;font-size:14px;cursor:pointer}
.lightbtn .sw{width:40px;height:22px;border-radius:999px;background:#334155;position:relative;transition:background .3s;flex:none}
.lightbtn .knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#94a3b8;transition:left .3s,background .3s}
.lightbtn.on{background:#fff7d6;color:#3b2f00;border-color:#facc15;box-shadow:0 0 18px rgba(250,204,21,.55)}
.lightbtn.on .sw{background:#facc15}.lightbtn.on .knob{left:21px;background:#fff}
.darknote{margin:10px 0;padding:8px 12px;border-radius:8px;background:#05070a;color:#94a3b8;font-size:13px;border:1px solid #1e293b}
.plan .dz,.plan .mrow>.chips:last-child{transition:filter .6s ease}
.plan.dark .dz,.plan.dark .mrow>.chips:last-child{filter:brightness(.24) saturate(.1) blur(.5px)}
.plan.dark .al{background:#000;border-radius:3px;color:#000}
.plan.lit .al{position:relative}
.plan.lit .al::before{content:"";position:absolute;top:4px;bottom:4px;left:50%;width:3px;margin-left:-1.5px;border-radius:2px;background:#fffbe6;box-shadow:0 0 10px 3px rgba(255,240,170,.8),0 0 30px 12px rgba(255,244,190,.35);opacity:0;transition:opacity .8s ease;pointer-events:none}
.plan.lit.glow .al::before{opacity:1}
.plan.fx .dz,.plan.fx .mrow>.chips:last-child,.plan.fx .al{animation:neon 1.2s steps(1,end)}
@keyframes neon{0%{filter:brightness(.15)}8%{filter:brightness(1.1)}14%{filter:brightness(.2)}22%{filter:brightness(1)}28%{filter:brightness(.35)}40%,100%{filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){.plan.fx .dz,.plan.fx .mrow>.chips:last-child,.plan.fx .al{animation:none}}

.fond .rack{flex-direction:row;justify-content:center;gap:12px;min-height:34px}
.ent{grid-area:ent;display:flex;align-items:flex-end;justify-content:center;padding-top:6px}
.ent span{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);display:flex;flex-direction:column;align-items:center;gap:2px}
.ext{grid-area:ext;display:flex;flex-direction:column;gap:5px;padding-top:8px;border-top:1px dashed var(--line-strong)}
.mface{font:600 9px var(--f-mono);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend .chip{cursor:default;width:18px;height:18px;font-size:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Commandes */
.order{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.order.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.order-h{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.order-h .num{font:700 15px var(--f-mono)}
.order-h .main{flex:1;min-width:0}
.order-b{border-top:1px solid var(--line);padding:4px 0 10px}
.order-b .row{border-top:1px solid var(--line)}
.order-b .row:first-child{border-top:0}
.order-foot{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px 0;align-items:center}
.pill{font-size:12px;font-weight:700;letter-spacing:.03em;border-radius:20px;padding:3px 9px;white-space:nowrap}
.st-demandee{background:var(--info-bg);color:var(--info)}
.st-prep{background:var(--warn-bg);color:var(--warn)}
.st-prete{background:var(--ok-bg);color:var(--ok)}
.st-recue{background:var(--surface-2);color:var(--muted)}
.ln-ok{background:var(--ok-bg);color:var(--ok)}
.ln-rupture{background:var(--bad-bg);color:var(--bad)}
.tog button[aria-pressed="true"].ok{background:var(--ok);color:#fff}
.tog button[aria-pressed="true"].ko{background:var(--bad);color:#fff}
.qty{width:52px !important;text-align:center;font-weight:700;font-size:16px;padding:7px 4px !important;border-radius:0 !important;border-left:0 !important;border-right:0 !important;-moz-appearance:textfield}
.qty::-webkit-inner-spin-button,.qty::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper{display:flex;align-items:center;flex-direction:column;gap:2px}

/* ---------- Couleurs conviviales ---------- */
:root{--zD:#1f6fb2;--zG:#7a4cc2;--zM:#0f8676;--zF:#b0601a;--zE:#3b8a2a;--zB:#c2416b;
  --t1:#1f6fb2;--t2:#0f8676;--t3:#e2570f;--t4:#7a4cc2;
  --head-grad:linear-gradient(120deg,#0f2a44 0%,#16507a 55%,#1b7d8f 100%)}
body{background:linear-gradient(180deg,#dfeaf4 0,var(--bg) 360px) no-repeat,var(--bg)}

.top{background:var(--head-grad);box-shadow:0 2px 10px rgba(0,0,0,.18)}
body::before{background:#0f2a44}
.brand::after{content:"❄";font-size:18px;color:#9fd8ff;margin-left:2px}
main h2{padding-left:10px;border-left:4px solid var(--accent)}
.sheet h2{border-left:0;padding-left:0}

.code[data-z]{color:#fff}
.code[data-z="D"]{background:var(--zD)}.code[data-z="G"]{background:var(--zG)}.code[data-z="M"]{background:var(--zM)}
.code[data-z="F"]{background:var(--zF)}.code[data-z="E"]{background:var(--zE)}.code[data-z="B"]{background:var(--zB)}

.rack[data-z="F"]{border-color:var(--zF)}.rack[data-z="E"]{border-color:var(--zE)}.rack[data-z="B"]{border-color:var(--zB)}
.rack[data-z="D"] .rk{color:var(--zD)}.rack[data-z="G"] .rk{color:var(--zG)}.rack[data-z="M"] .rk{color:var(--zM)}
.rack[data-z="F"] .rk{color:var(--zF)}.rack[data-z="E"] .rk{color:var(--zE)}.rack[data-z="B"] .rk{color:var(--zB)}

.cline{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.cline .t{font-weight:700}.cline .d{font-size:13px;color:var(--muted)}
.cline .del{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--bad);cursor:pointer;padding:0}
details.libre{border:1px dashed var(--line-strong);border-radius:12px;padding:10px 12px}
details.libre summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.libre .inline{margin-top:10px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fcard .t{font-size:18px;font-weight:700}.fcard .d{color:var(--muted);font-size:13px}
.fcard .where{font-size:14px;background:var(--surface-2);border-radius:8px;padding:6px 10px}
.oline{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.oline span:not(.pill){flex:1}
.bell{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok);border-radius:12px;padding:10px 12px;font-size:15px}
.edited{color:var(--warn)}
/* Pastille de synchro */
.sync{font:600 11px var(--f-body);letter-spacing:.04em;padding:3px 9px 3px 20px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--head-ink);position:relative;margin-right:auto}
.sync::before{content:"";position:absolute;left:8px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#e7b25a}
.sync[data-s="on"]::before{background:#4cd07d}.sync[data-s="off"]::before{background:#f08a80}
.sync:empty{display:none}
/* Préparation à plusieurs */
.lrow{flex-wrap:wrap}
.lctl-w{flex-basis:100%;min-width:0}
.lctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.chk{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.chk.on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chk.ok.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chk.ko{color:var(--bad);border-color:var(--bad)}
.chk:disabled{opacity:.5;cursor:not-allowed}
.prepq{flex-direction:row;align-items:center;gap:6px}
.lrow.ls-cours{background:color-mix(in srgb,var(--warn-bg) 55%,transparent)}
.lrow.ls-ok{background:color-mix(in srgb,var(--ok-bg) 45%,transparent)}
.lrow.ls-rupture{background:color-mix(in srgb,var(--bad-bg) 45%,transparent)}

<script>
/* ---------- Rayon : la même appli sert au snow et au ski (fichiers fabriqués à part, données séparées) ---------- */

/* ---------- Emplacements ---------- */
const LV=[1,2,3];
/* au pied de chaque face de rack, une zone au sol (niveau 0, ex. D1.0) pour poser des boîtes un moment ; et une zone d'arrivée (ARR1) */
const withFloor=L=>{const out=[],seen=new Set();L.forEach(c=>{const m=/^([A-Z]+\d+)\.\d$/.exec(c);if(m&&!seen.has(m[1])&&!/^GN/.test(c)){seen.add(m[1]);out.push(m[1]+'.0');}out.push(c);});out.push('ARR1');return out;};
const isFloor=e=>/\.0$/.test(e||'');
const ZONES=SKI?{GS:'Femme · racks gauche, côté ski',GN:'Femme · racks gauche, côté snow',HG:'Homme · côté mur',HD:'Homme · côté allée',FS:'Fond, côté ski',MUR:'Skis · le long du mur',FEN:'Skis · le long de la fenêtre',ARR:'Zone d\'arrivée (fournisseur / retour magasin)'}
  :{G:'Gauche',MG:'Milieu, côté gauche',MD:'Milieu, côté droit',D:'Droite',F:'Fond',E:'Étagère',BAV:'Bloc avant',BAR:'Bloc arrière',ARR:'Zone d\'arrivée (fournisseur / retour magasin)'};
/* ski : bottes femme sur les racks de gauche (face ski 1-3, face snow niveau 3 sauf G4, G0 niveau 3), bottes homme sur la rangée H (2 faces), fond côté ski, skis debout le long du mur et de la fenêtre */
const LOCS=SKI?(()=>{const L=[],add=(z,r,l)=>L.push(`${z}${r}.${l}`);add('GS',0,3);
  for(let r=1;r<=5;r++){LV.forEach(l=>add('GS',r,l));if(r!==4)add('GN',r,3);}
  for(let r=1;r<=5;r++)LV.forEach(l=>add('HD',r,l));for(let r=1;r<=5;r++)LV.forEach(l=>add('HG',r,l));
  LV.forEach(l=>add('FS',1,l));for(let i=1;i<=6;i++)L.push('MUR'+i);for(let i=1;i<=3;i++)L.push('FEN'+i);return withFloor(L);})()
  :(()=>{const L=[],add=(z,r,l)=>L.push(`${z}${r}.${l}`);
  [2,3].forEach(l=>add('G',4,l));
  for(let r=1;r<=6;r++)LV.forEach(l=>add('MG',r,l));
  for(let r=1;r<=6;r++)LV.forEach(l=>add('MD',r,l));
  for(let r=1;r<=5;r++)LV.forEach(l=>add('D',r,l));
  LV.forEach(l=>add('F',1,l));
  LV.forEach(l=>add('E',1,l)); /* une seule étagère, 3 niveaux */
  LV.forEach(l=>add('BAV',1,l));LV.forEach(l=>add('BAR',1,l));
  return withFloor(L);})();
function locLabel(c){if(c==='ARR1')return ZONES.ARR;const w=/^(MUR|FEN)(\d+)$/.exec(c||'');if(w)return `${ZONES[w[1]]} · zone ${w[2]}`;
  const m=/^([A-Z]+)(\d+)\.(\d+)$/.exec(c||'');if(!m)return c||'';const[,z,r,l]=m;
  let s=z==='E'?(r==='1'?'Étagère':`Étagère ${r}`):['F','BAV','BAR','FS'].includes(z)?ZONES[z]:`${ZONES[z]} · rack ${z==='GS'||z==='GN'?'G':z[0]==='H'?'H':''}${r}`;
  return l==='0'?`${s} · au sol, au pied du rack`:`${s} · niveau ${l}${l==='1'?' (bas)':l==='3'?' (haut)':''}`;}

/* ---------- Données ---------- */
const TYPE=SKI?{botte:'Chaussures de ski',board:'Skis'}:{botte:'Bottes',fix:'Fixations',board:'Snowboards'};
const sizesS=()=>{const a=[];for(let n=SKI?100:138;n<=(SKI?200:166);n++)a.push(n+' cm');return a;};
const sizesOf=t=>t==='botte'?S.sizesB:t==='board'?S.sizesS:S.sizesF;
const szLbl=(type,t)=>!SKI&&type==='botte'&&!/cm/.test(t)?'US '+t:t;
const GENRE={H:'Homme',F:'Femme',U:'Unisexe'};
const ST={demandee:'Demandée',prep:'En préparation',prete:'Prête',recue:'Reçue'};

function sizesB(){const a=[];if(SKI){for(let s=15;s<=33;s+=.5)a.push(String(s));return a;}for(let s=4;s<=14;s+=.5)a.push(String(s));a.push('15');for(let s=22;s<=30;s+=.5)a.push(s+' cm');return a;}

  const R=[],add=(emp,type,marque,modele,genre,tailles)=>tailles.forEach(t=>R.push({type,marque,modele,genre,taille:t,annee:'',emp,note:''}));

  add('D1.3','fix','Nitro','Cosmic','F',['S/M']);

    brands:['Burton','DC','Flux','K2','Nitro','Northwave','Ride','Salomon','ThirtyTwo','Union','Vans'],
    sizesB:sizesB(),sizesF:['S','M','L','XL','S/M','M/L','L/XL'],sizesS:sizesS(),orders:[],notifs:[],cart:[],cartNote:''};
}
function seedExemples(){
  const rows=[
    ['botte','Burton','Ion','H','9.5',2025,'D1.2'],['botte','Burton','Ion','H','10',2025,'D1.2'],['botte','Burton','Ion','H','10.5',2025,'D1.3'],
    ['botte','Burton','Photon Step On','H','11',2025,'D2.1'],['botte','Burton','Ritual','F','7',2025,'D2.2'],['botte','Burton','Ritual','F','7.5',2025,'D2.2'],
    ['botte','Salomon','Launch Boa','H','9',2025,'D3.1'],['botte','Salomon','Ivy Boa','F','6.5',2024,'D3.2'],['botte','ThirtyTwo','Lashed','H','10',2025,'D4.1'],
    ['botte','ThirtyTwo','Lashed','H','11',2025,'D4.1'],['botte','Vans','Hi-Standard OG','H','9.5',2024,'D4.2'],['botte','DC','Phase Boa','H','10.5',2025,'D5.1'],
    ['botte','Nitro','Team TLS','H','12',2024,'D5.3'],['botte','K2','Maysis','H','9',2023,'G4.2'],['botte','Ride','Hera','F','8',2023,'G4.3'],
    ['fix','Union','Force','U','M',2025,'MG1.1'],['fix','Union','Force','U','L',2025,'MG1.2'],['fix','Union','Strata','U','L',2025,'MG2.1'],
    ['fix','Union','Juliet','F','S',2025,'MG2.3'],['fix','Burton','Cartel','H','M',2025,'MD1.1'],['fix','Burton','Cartel','H','L',2025,'MD1.1'],
    ['fix','Burton','Lexa','F','S',2025,'MD1.2'],['fix','Burton','Malavita','H','XL',2024,'MD2.3'],['fix','Salomon','Hologram','U','M/L',2025,'MD3.1'],

  const articles=rows.map((r,i)=>({id:'a'+(i+1),type:r[0],marque:r[1],modele:r[2],genre:r[3],taille:r[4],annee:r[5],emp:r[6],note:''}));
  const now=Date.now();
  return {v:1,demo:true,seq:1001,articles,
    brands:['Burton','DC','Flux','K2','Nitro','Ride','Salomon','ThirtyTwo','Union','Vans'],
    sizesB:sizesB(),sizesF:['S','M','L','XL','S/M','M/L','L/XL'],sizesS:sizesS(),
    orders:[
      {id:1001,at:now-12*60000,status:'demandee',note:'Client en caisse pour essayer',lines:[{aid:'a2',qty:1,st:null},{aid:'a20',qty:1,st:null},{txt:'Burton Ion noir 11 si vous l\'avez',qty:1,st:null}]},
      {id:1000,at:now-26*3600000,status:'recue',note:'',lines:[{aid:'a16',qty:2,st:'ok'},{aid:'a12',qty:1,st:'rupture'}]}],
    notifs:[{id:1,to:'entrepot',text:'Nouvelle commande #1001 du magasin',at:now-12*60000,read:false}],
    cart:[],cartNote:''};
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1){
  /* ajoute la taille US 15 aux données déjà enregistrées sur l'appareil */
  if(!SKI&&!s.sizesB.includes('15')){const i=s.sizesB.indexOf('14');s.sizesB.splice(i<0?s.sizesB.length:i+1,0,'15');}
  /* « Noir » déjà saisi devient « Black » */
  (s.articles||[]).forEach(a=>{if(a.couleur)a.couleur=fixColor(a.couleur);});
  if(!s.sizesS)s.sizesS=sizesS();
  return s;}}catch(e){}return seed();}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(typeof cloudPush==='function')cloudPush();}
let role='entrepot';try{role=localStorage.getItem(KEY+'-role')||'entrepot';}catch(e){}
const st={tab:'search',q:'',fType:'',fGenre:'',fMarque:'',fModele:'',fAnnee:'',fZone:'',fCouleur:'',fSerrage:'',fTailles:[],focus:null,focusOrder:null,open:null,armed:null,sh:{step:null,v:{},hist:[],q:1},sq:'',sqType:''};
if(role==='magasin')st.tab='cmd';
const ZONE_OF=SKI?{GS:'BF',GN:'BF',HG:'BH',HD:'BH',FS:'FS',MUR:'SK',FEN:'SK',ARR:'ARR'}:{D:'D',G:'G',MG:'M',MD:'M',F:'F',E:'E',BAV:'B',BAR:'B',ARR:'ARR'};
const ZONE_LBL=SKI?{BF:'Bottes femme',BH:'Bottes homme',FS:'Fond côté ski',SK:'Skis',ARR:'Zone d\'arrivée'}:{ARR:'Zone d\'arrivée',D:'Droite',G:'Gauche',M:'Milieu',F:'Fond',E:'Étagère',B:'Bloc'};
const zoneOf=emp=>ZONE_OF[(/^[A-Z]+/.exec(emp||'')||[''])[0]]||'';
function sizeRankStr(t){if(/cm/.test(t))return 100+parseFloat(t);const n=parseFloat(t);if(!isNaN(n))return n;const i=S.sizesF.indexOf(t);return 200+(i<0?99:i);}

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const art=id=>S.articles.find(a=>a.id===id);
const artName=a=>`${a.marque} ${a.modele}`;
const qOf=a=>a&&a.qty!=null?a.qty:1; /* les articles saisis avant les quantités comptent pour 1 */
const qHtml=a=>{const q=qOf(a);return q?`<b class="qn">Qté ${q}</b>`:`<b class="qn zero">Rupture</b>`;};
const serOf=a=>a.type==='botte'&&SERRAGE[a.serrage]||'';
const artDesc=a=>`${TYPE[a.type]} · ${GENRE[a.genre]} · ${szLbl(a.type,a.taille)}${a.couleur?' · '+a.couleur:''}${serOf(a)?' · '+serOf(a):''} · ${a.annee||'—'}`;
const fmtDT=t=>new Date(t).toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const locRank=c=>{const i=LOCS.indexOf(c);return i<0?999:i;};
function sizeRank(a){if(a.type!=='fix')return parseFloat(a.taille)||0;const i=S.sizesF.indexOf(a.taille);return i<0?99:i;}
function sortArts(list){return list.slice().sort((x,y)=>x.type.localeCompare(y.type)||x.marque.localeCompare(y.marque)||x.modele.localeCompare(y.modele)||sizeRank(x)-sizeRank(y));}
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return"à l'instant";if(m<60)return`il y a ${m} min`;const h=Math.round(m/60);if(h<24)return`il y a ${h} h`;return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
const filtering=()=>!!(st.q.trim()||st.fType||st.fGenre||st.fMarque||st.fModele||st.fAnnee||st.fZone||st.fCouleur||st.fSerrage||st.fTailles.length);
const isSizeTok=t=>/^\d{1,2}(\.5)?$/.test(t)||/^(xs|s|m|l|xl|xxl|s\/m|m\/l|l\/xl)$/.test(t);
/* skip : nom du filtre à ignorer, pour calculer les choix encore possibles dans ce filtre */
function matches(a,skip){
  if(skip!=='type'&&st.fType&&a.type!==st.fType)return false;
  if(skip!=='genre'&&st.fGenre&&a.genre!==st.fGenre)return false;
  if(skip!=='marque'&&st.fMarque&&a.marque!==st.fMarque)return false;
  if(skip!=='modele'&&st.fModele&&a.modele!==st.fModele)return false;
  if(skip!=='annee'&&st.fAnnee&&String(a.annee)!==st.fAnnee)return false;
  if(skip!=='zone'&&st.fZone&&role!=='magasin'&&zoneOf(a.emp)!==st.fZone)return false;
  if(skip!=='couleur'&&st.fCouleur&&(a.couleur||'')!==st.fCouleur)return false;
  if(skip!=='serrage'&&st.fSerrage&&serOf(a)!==st.fSerrage)return false;
  if(skip!=='taille'&&st.fTailles.length&&!st.fTailles.includes(a.taille))return false;
  return textMatch(a,st.q);}
function textMatch(a,q){
  const toks=norm(q).replace(/(\d),5/g,'$1.5').split(/\s+/).filter(Boolean);if(!toks.length)return true;
  const sz=toks.filter(isSizeTok),other=toks.filter(t=>!isSizeTok(t));
  if(sz.length){const full=norm(a.taille).replace(/\s*cm$/,''),parts=full.split('/');if(!sz.some(t=>t===full||parts.includes(t)))return false;}
  const hay=norm(`${a.marque} ${a.modele} ${TYPE[a.type]} ${a.type==='fix'?'fix fixation':a.type==='board'?(SKI?'ski skis':'snowboard board planche'):(SKI?'chaussure chaussures botte boots':'botte boots')} ${GENRE[a.genre]} ${a.taille} ${a.annee} ${a.emp} ${ZONE_LBL[zoneOf(a.emp)]||''} ${a.couleur||''} ${serOf(a)} ${a.note}`);
  const words=new Set(hay.split(/\s+/));
  return other.every(t=>t.length<=2?words.has(t):hay.includes(t));}
/* compte en pièces (paires), comme le total affiché et l'appli magasin */
function facet(skip,get){const Q=role==='magasin'?availOf:qOf,m=new Map();S.articles.filter(a=>matches(a,skip)).forEach(a=>{const k=String(get(a)??'');if(k)m.set(k,(m.get(k)||0)+Q(a));});return m;}
/* total d'une recherche : modèles et pièces (au magasin : disponibles, avec ce qui est déjà en commande) */
function sumLine(list,o={}){const mods=new Set(list.map(a=>[a.type,a.marque,a.modele,a.genre].join('|'))).size,p=list.reduce((t,a)=>t+qOf(a),0),ty=new Set(list.map(a=>a.type));
  const u=SKI?['paire','paires']:ty.size===1&&ty.has('board')?['planche','planches']:o.shop&&!ty.has('board')?['paire','paires']:['pièce','pièces'],w=n=>`${n.toLocaleString('fr-FR')} ${n>1?u[1]:u[0]}`;
  let t=`<b>${mods} modèle${mods>1?'s':''}</b>`;if(o.lines)t+=` · ${list.length} article${list.length>1?'s':''}`;
  if(o.shop){const av=list.reduce((x,a)=>x+availOf(a),0);t+=` · <b>${w(av)} disponible${av>1?'s':''}</b>${p>av?` <small>(${p} en stock, dont ${p-av} déjà en commande)</small>`:''}`;}else t+=` · <b>${w(p)}</b>`;
  return t;}
const focusOrd=()=>st.focusOrder&&S.orders.find(o=>o.id===st.focusOrder);
function hits(){const fo=focusOrd();if(fo)return new Set(fo.lines.map(l=>l.aid&&art(l.aid)).filter(Boolean).map(a=>a.emp));
  if(st.focus){const a=art(st.focus);return new Set(a?[a.emp]:[]);}if(!filtering())return new Set();return new Set(S.articles.filter(matches).map(a=>a.emp));}
const unread=()=>S.notifs.filter(n=>n.to===role&&!n.read);

let actx;function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;[0,.18].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i?1175:880;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.18,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.25);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.3);});}catch(e){}}
let toastT;function toast(html,sound){const r=$('#toastRoot');r.innerHTML=`<div class="toast" role="status">${html}</div>`;if(sound)beep();clearTimeout(toastT);toastT=setTimeout(()=>r.innerHTML='',3800);}
function notify(to,text){S.notifs.push({id:Date.now()+Math.random(),to,text,at:Date.now(),read:false});}

const IC={search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',

/* ---------- Place dans un emplacement, d'après les mesures (Réglages › Dimensions) ----------

function locDims(code){const d=dims(),m=/^([A-Z]+)(\d+)\.(\d)$/.exec(code||'');if(!m||m[3]==='0')return {L:0,P:0,H:0,pose:''};const[,z,r,l]=m;let g=null,o=null;
  if(SKI){g=z==='GS'||z==='GN'?d.locs['BF'+l]:z==='HG'||z==='HD'?d.locs['BH'+l]:z==='FS'?d.locs.FS:null;o=d.over[code];const x=Object.assign({},g||{},o||{});
    return {L:x.L||0,P:x.P?(z[0]==='H'?x.P/2:x.P):0,H:x.H||0,pose:(g&&g.pose)||''};}
  /* racks de gauche : mesures du groupe « Gauche », les mêmes pour tous ; niveau 1 sans hauteur = celle de D1.1 */
  if(z==='G'){const x=d.locs['G'+l]||{};return {L:x.L||0,P:x.P||0,H:x.H||(l==='1'?locDims('D1.1').H:0),pose:x.pose||''};}
  if(z==='D'){g=d.locs[l==='3'?'D3':'D12'];o=d.over[code];}else if(z==='MG'||z==='MD'){g=d.locs['M'+l];o=d.over[`M${r}.${l}`];}
  const x=Object.assign({},g||{},o||{});return {L:x.L||0,P:x.P?(/^M[GD]/.test(code)?x.P/2:x.P):0,H:x.H||0,pose:(g&&g.pose)||''};}
/* une boîte posée : [long du rack, profondeur, hauteur] selon qu'elle est à plat ou sur la tranche */
const boxOri=(o,b)=>o==='flat'?[b.L,b.l,b.H]:o==='flatL'?[b.l,b.L,b.H]:o==='edge'?[b.L,b.H,b.l]:[b.H,b.L,b.l];

/* files de boîtes depuis l'allée ; plusieurs façons de remplir la profondeur, on garde celle qui loge le plus */
function laneSet(pose,P,r,Lc,Hc){const mk=(front,back)=>{const out=[];let v=0;const put=(o,d)=>{out.push({v,o,d});v+=d;};
    if(front){const d=boxOri(front,r)[1];if(d<=P+.5)put(front,d);}const db=boxOri(back,r)[1];while(v+db<=P+.5)put(back,db);return out;};
  const C=pose==='tranche'?[[null,'book'],[null,'edge']]:pose==='mixte'?[['flat','edge'],['flatL','edge'],[null,'flat'],[null,'flatL']]:[[null,'flat'],[null,'flatL']];
  let best=null,bc=-1;C.forEach(([f,b])=>{const ln=mk(f,b);if(!ln.length)return;const c=capFor(r,Lc,Hc,ln);if(c>bc){bc=c;best=ln;}});
  return best||[{v:0,o:'flat',d:P}];}

/* nombre de boîtes de format b qui tiennent dans un emplacement mesuré (0 = pas mesuré) */
function slotCap(code,b){const k=code+'|'+b.L+'|'+b.l+'|'+b.H;if(SLOTC.has(k))return SLOTC.get(k);const d=locDims(code);let c=0;
  if(d.L&&d.P&&d.H&&capGroup(code))c=capFor(b,d.L,d.H,laneSet(d.pose||'plat',d.P,b,d.L,d.H));SLOTC.set(k,c);return c;}
/* boîte moyenne d'un type (d'après les boîtes mesurées), et boîte d'un modèle (la plus grande de ses tailles) */
function typBox(t){const bs=dims().boxes.filter(b=>b.type===t&&b.L&&b.l&&b.H);if(!bs.length)return BOX_DEF[t]||BOX_DEF.botte;const m=k=>Math.round(bs.reduce((s,b)=>s+b[k],0)/bs.length*10)/10;return {L:m('L'),l:m('l'),H:m('H')};}
function modelBox(t,marque,modele){const bs=dims().boxes.filter(b=>b.type===t&&b.L&&b.l&&b.H&&(!b.marque||norm(b.marque)===norm(marque))&&(!b.modele||norm(b.modele)===norm(modele)));

function locUse(code){let f=0;S.articles.forEach(a=>{if(a.emp!==code)return;const q=qOf(a);if(!q)return;const c=slotCap(code,boxOf(a));if(c)f+=q/c;});return f;}

/* ---------- Déplacer des articles (menu Déplacer et 3D) ----------

function moveArticles(pairs,to,cote){const before=JSON.stringify(S.articles),stamp=Date.now().toString(36);let n=0;

/* Modifie une seule ligne : en ligne, la ligne est mise à jour dans la commande telle qu'elle est en ce moment,
   pour ne pas effacer ce qu'un autre préparateur vient de faire sur une autre ligne. */
function lineSet(o,i,patch,orderPatch){
  Object.assign(o.lines[i],patch);if(orderPatch)Object.assign(o,orderPatch);

      tx.set(ref,{json:JSON.stringify(r),at:Date.now()});})

/* Plusieurs lignes d'un coup (une marque) : même principe que lineSet, en une seule transaction.
   Une ligne déjà prise par quelqu'un d'autre n'est pas reprise. */
function linesSet(o,list,orderPatch){if(!list.length)return;
  list.forEach(({i,patch})=>Object.assign(o.lines[i],patch));if(orderPatch)Object.assign(o,orderPatch);saveLocal();
  if(cloud.on&&cloud.sent.orders){const id=String(o.id);cloud.sent.orders.set(id,JSON.stringify(o));const ref=cloud.fs.doc(cloud.db,C('orders'),id);let taken=[];

      list.forEach(({i,patch})=>{const L=r.lines[i];if(!L)return;if(patch.st==='cours'&&L.st&&L.by&&L.by!==patch.by){taken.push(L.by);return;}Object.assign(L,patch);});

function brandGroups(o){const open=role==='entrepot'&&(o.status==='demandee'||o.status==='prep');
  const g=new Map();o.lines.forEach((l,i)=>{const k=brandOf(l);if(!g.has(k))g.set(k,[]);g.get(k).push([l,i]);});
  const groups=[...g.entries()].map(([k,arr])=>({k,arr:arr.sort((x,y)=>lineRank(x[0])-lineRank(y[0]))}))
    .sort((x,y)=>Math.min(...x.arr.map(e=>lineRank(e[0])))-Math.min(...y.arr.map(e=>lineRank(e[0]))));
  return groups.map(({k,arr})=>{const ls=arr.map(e=>e[0]),n=ls.reduce((s,l)=>s+l.qty,0);
    const fin=ls.every(l=>l.st==='ok'||l.st==='rupture');
    const who=[...new Set(ls.filter(l=>l.st==='cours'&&l.by).map(l=>l.by))];
    const doneBy=[...new Set(ls.filter(l=>(l.st==='ok'||l.st==='rupture')&&l.by).map(l=>l.by))];
    const free=ls.filter(l=>!l.st).length,mineC=ls.filter(l=>l.st==='cours'&&l.by===me()).length,others=who.filter(x=>x!==me());
    const nv=ls.filter(l=>l.st==='ok'||l.st==='rupture').length;
    let state,cls;
    if(fin){state=`✓ Validée${doneBy.length?' · '+doneBy.join(', '):''}`;cls='ok';}
    else if(who.length){state=`En cours · ${who.join(', ')}${nv?` · ${nv}/${ls.length} validées`:''}`;cls=mineC?'mine':'busy';}
    else{state=nv?`${nv}/${ls.length} validées`:'Libre';cls='free';}
    const B=esc(k),arm=st.armed==='bunl'+o.id+':'+k;let btns='';
    if(open&&!fin){
      if(free)btns+=`<button type="button" class="btn ${who.length?'':'primary'}" data-act="bclaim" data-o="${o.id}" data-b="${B}">✋ Je prends ${k===LIBRE?'les demandes libres':B}${free<ls.length?` (${free} restante${free>1?'s':''})`:''}</button>`;
      if(mineC)btns+=`<button type="button" class="btn primary" data-act="bok" data-o="${o.id}" data-b="${B}">✓ Tout valider (${mineC})</button><button type="button" class="btn ghost sm" data-act="bfree" data-o="${o.id}" data-b="${B}">Libérer</button>`;
      if(others.length&&!mineC)btns+=`<button type="button" class="btn ghost sm${arm?' armed':''}" data-act="bunlock" data-o="${o.id}" data-b="${B}">${arm?`Confirmer : libérer ${B}`:'Libérer (oublié ?)'}</button>`;}
    return `<div class="bgrp b-${cls}"><div class="bgrp-h"><div><b class="bname">${B}</b> <small>${ls.length} ligne${ls.length>1?'s':''} · ${n} pièce${n>1?'s':''}</small></div><span class="bstate">${esc(state)}</span></div>
      ${btns?`<div class="bgrp-b">${btns}</div>`:''}${arr.map(([l,i])=>lineRow(o,l,i)).join('')}</div>`;}).join('');}

      const h=[0x50,0x4b,3,4,...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)];
      parts.push(new Uint8Array(h),nb,db);
      cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
      off+=h.length+nb.length+db.length;});
    const csz=cen.reduce((x,b)=>x+b.length,0);
    return new Blob([...parts,...cen,new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(csz),...u32(off),0,0])],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});},
  col(i){let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;},
  x:v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''),
  /* sheet = {name, widths:[], rows:[[cells]], styles:[row style], freeze:true} ; cellule = texte, nombre ou null */

      return `<row r="${ri+1}">${r.map((v,ci)=>{if(v==null||v==='')return stl?`<c r="${XL.col(ci)}${ri+1}" s="${stl}"/>`:'';const ref=XL.col(ci)+(ri+1),sa=stl?` s="${stl}"`:'';

      `<cols>${Array.from({length:ncol},(_,i)=>`<col min="${i+1}" max="${i+1}" width="${sh.widths[i]||8}" customWidth="1"/>`).join('')}</cols>`+
      `<sheetData>${rows}</sheetData>${sh.filter?`<autoFilter ref="A${sh.freeze}:${XL.col(ncol-1)}${sh.rows.length}"/>`:''}</worksheet>`;},
  book(sheets){const n=sheets.length;
    const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;

function inventaireXlsx(){

  const types=Object.keys(TYPE).filter(t=>S.articles.some(a=>a.type===t));

  const arts=S.articles.slice().sort((x,y)=>Object.keys(TYPE).indexOf(x.type)-Object.keys(TYPE).indexOf(y.type)||coll.compare(x.marque,y.marque)||coll.compare(x.modele,y.modele)||coll.compare(x.genre,y.genre)||sizeRankStr(x.taille)-sizeRankStr(y.taille)||coll.compare(x.couleur||'',y.couleur||''));
  const R=a=>reserved(a.id),Q=qOf,D=a=>Math.max(0,Q(a)-R(a));

const caps=()=>{if(!S.caps||!S.caps[Object.keys(CAP_GROUPS)[0]])S.caps=capsCalc();return S.caps;};
/* place d'un emplacement : d'après les mesures s'il est mesuré (bx = boîte du modèle qu'on range), sinon d'après les capacités de Réglages */

/* Règles de rangement (choix de l'entrepôt) :

/* Conseils pour ranger n boîtes d'un modèle au même endroit : [{emp, why, moves:[{ids,from,to,label,n}]}] */
function placeSuggest(t,marque,modele,genre,n){curGenre=genre;
  const big=t==='botte'&&n>=bigLot();
  const occ=occMap(),BX=mBox(t,marque,modele),X=capCtx(occ,BX),ok=(ty,e,b)=>locTier(ty,e,b)>0,managed=LOCS.filter(e=>ok(t,e,big));

      const homes=new Set(S.articles.filter(a=>key(a)===g.k&&a.emp!==L).map(a=>a.emp));
      const dests=LOCS.filter(e=>e!==L&&ok(g.t,e,false)&&Y.free(e,g.t)>=g.n).sort((x,y)=>(homes.has(y)-homes.has(x))||tierOrder(g.t,x,false)-tierOrder(g.t,y,false)||Y.free(x,g.t)-Y.free(y,g.t));

  const occ=occMap(),X=capCtx(occ,mBox(t,marque,modele)),K=[t,norm(marque),norm(modele),genre].join('|');
  const same=new Set(S.articles.filter(a=>[a.type,norm(a.marque),norm(a.modele),a.genre].join('|')===K).map(a=>a.emp));
  const zs=Object.keys(sizes).filter(z=>sizes[z]>0).sort((x,y)=>(t==='fix'?(S.sizesF.indexOf(x)+1||99)-(S.sizesF.indexOf(y)+1||99):sizeRankStr(x)-sizeRankStr(y))).map(z=>({z,q:sizes[z]}));

/* ---------- Arrivage : saisir tout ce qui arrive, puis plan de rangement ---------- */
const arr=()=>{if(!S.arr)S.arr={from:'fournisseur',note:'',groups:[]};return S.arr;};
const gTot=g=>Object.values(g.sizes).reduce((x,n)=>x+n,0);

/* Libérer un emplacement conseillé en déplaçant d'autres modèles (entiers) vers d'autres racks permis.
   Proposé seulement si c'est utile : pas de place en un seul endroit, ou seulement en dernier recours,
   ou pour rejoindre le même modèle. On déplace au maximum 4 modèles et moins de boîtes qu'on n'en range. */
function optimizeFor(t,marque,modele,genre,n){curGenre=genre;const big=t==='botte'&&n>=bigLot();
  const occ=occMap(),BX=mBox(t,marque,modele),X=capCtx(occ,BX),key=a=>[a.type,norm(a.marque),norm(a.modele),a.genre].join('|'),K=[t,norm(marque),norm(modele),genre].join('|');
  const same=new Set(S.articles.filter(a=>key(a)===K).map(a=>a.emp)),brand=new Set(S.articles.filter(a=>a.type===t&&norm(a.marque)===norm(marque)).map(a=>a.emp));
  let best=null;
  LOCS.filter(L=>locTier(t,L,big)===1&&X.cap(L,t)>=n).forEach(L=>{
    if(X.free(L,t)>=n)return;
    const occ2=JSON.parse(JSON.stringify(occ)),Y=capCtx(occ2,BX);
    const groups=new Map();S.articles.filter(a=>a.emp===L&&key(a)!==K&&qOf(a)>0&&!a._new).forEach(a=>{const k=key(a);const g=groups.get(k)||{ids:[],n:0,t:a.type,a,k};g.ids.push(a.id);g.n+=qOf(a);groups.set(k,g);});

      const dests=LOCS.filter(e=>e!==L&&locTier(g.t,e,false)>0&&Y.free(e,g.t)>=g.n)
        .sort((x,y)=>(homes.has(y)-homes.has(x))||tierOrder(g.t,x,false)-tierOrder(g.t,y,false)||Y.free(x,g.t)-Y.free(y,g.t));

      moves.push({ids:g.ids,from:L,to:D,n:g.n,label:`${g.a.marque} ${g.a.modele} ${GENRE[g.a.genre]||''}`.trim()});}

    if(!best||score<best.score)best={emp:L,moves,score,moved,why:`${same.has(L)?'avec le même modèle, ':''}en libérant ${L} : ${moves.length} ${plural(moves.length,'modèle déplacé','modèles déplacés')} (${moved} ${plural(moved,'boîte','boîtes')})`};});

/* Plan : simulé sur une copie du stock, un modèle après l'autre (les plus gros d'abord) */
function planArrivage(){const A=arr(),real=S.articles,sim=JSON.parse(JSON.stringify(real));S.articles=sim;const out=[];
  try{
    [...A.groups].sort((a,b)=>gTot(b)-gTot(a)).forEach(g=>{const n=gTot(g);if(!n)return;
      const step={g,n,chunks:[],moves:[],why:'',alts:[]};

  render();}


/* ---------- Dimensions (cm) : emplacements et boîtes ----------
   S.dims = {locs:{D12:{L,P,H,pose},...}, over:{emp:{L,P,H}}, boxes:[{id,type,marque,modele,from,to,L,l,H}]}
   Pas encore utilisé pour le calcul : on collecte d'abord les mesures. */
const DIM_GROUPS=SKI?{BF1:['Racks gauche (bottes femme) · niveau 1','Profondeur d\'une face'],BF2:['Racks gauche (bottes femme) · niveau 2','Profondeur d\'une face'],BF3:['Racks gauche (bottes femme) · niveau 3','Profondeur d\'une face'],
  BH1:['Bottes homme · niveau 1 (2 faces)','Profondeur totale'],BH2:['Bottes homme · niveau 2 (2 faces)','Profondeur totale'],BH3:['Bottes homme · niveau 3 (2 faces)','Profondeur totale'],FS:['Fond, côté ski','Profondeur']}:{D12:['Droite · niveaux 1 et 2','Profondeur'],D3:['Droite · niveau 3','Profondeur'],
  G1:['Gauche · niveau 1 (tous les racks G ; hauteur vide = celle de D1.1)','Profondeur côté snow'],G2:['Gauche · niveau 2 (tous les racks G)','Profondeur côté snow'],G3:['Gauche · niveau 3 (tous les racks G, sans dessus)','Profondeur côté snow'],
  M1:['Milieu · niveau 1 (étagère double face G + D)','Profondeur totale, allée G → allée D'],M2:['Milieu · niveau 2 (étagère double face G + D)','Profondeur totale, allée G → allée D'],M3:['Milieu · niveau 3 (étagère double face G + D)','Profondeur totale, allée G → allée D']};
/* Au milieu, MG et MD du même rack et du même niveau sont une seule étagère : on la note M (ex. M3.2) */
const DIM_LOCS=[...new Set(LOCS.filter(capGroup).map(e=>e.replace(/^M[GD]/,'M')))];
const dimRank=e=>{const i=DIM_LOCS.indexOf(e);return i<0?999:i;};
const POSE={plat:'À plat',tranche:'Sur la tranche',mixte:'À plat devant + sur la tranche derrière'};
const dims=()=>{const d=S.dims=S.dims||{};d.locs=d.locs||{};
  /* ancien groupe « milieu niveaux 1 et 2 » : ses mesures sont reprises pour les niveaux 1 et 2, séparés */
  if(d.locs.M12){['M1','M2'].forEach(k=>{if(!d.locs[k])d.locs[k]={...d.locs.M12};});delete d.locs.M12;}
  if(d.over)Object.keys(d.over).forEach(e=>{if(/^M[GD]\d/.test(e)){const m=e.replace(/^M[GD]/,'M');if(!d.over[m])d.over[m]=d.over[e];delete d.over[e];}});d.over=d.over||{};d.boxes=d.boxes||[];return d;};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return n>0?Math.round(n*10)/10:null;};
const fmtD=(o,keys)=>keys.map(k=>o&&o[k]!=null?String(o[k]).replace('.',','):'?').join(' × ');
/* le plus précis l'emporte : modèle > marque > toutes marques ; puis la plage de tailles la plus étroite */
function boxFor(a){const rk=z=>a.type==='fix'?(S.sizesF.indexOf(z)+1||99):sizeRankStr(z);const r=rk(a.taille);
  const c=dims().boxes.filter(b=>b.type===a.type&&(!b.marque||norm(b.marque)===norm(a.marque))&&(!b.modele||norm(b.modele)===norm(a.modele))&&(!b.from||rk(b.from)<=r)&&(!b.to||r<=rk(b.to)));
  return c.sort((x,y)=>(!!y.modele-!!x.modele)||(!!y.marque-!!x.marque)||((x.to?rk(x.to):999)-(x.from?rk(x.from):0))-((y.to?rk(y.to):999)-(y.from?rk(y.from):0)))[0]||null;}
function vDims(){const d=dims();
  const inp=(attr,v,lbl)=>`<input type="text" inputmode="decimal" ${attr} value="${v!=null?String(v).replace('.',','):''}" placeholder="cm" aria-label="${lbl}" class="dim-in">`;

    <label class="dimp">Boîtes posées <select data-dim="${g}:pose"><option value="">—</option>${Object.entries(POSE).map(([k,l])=>`<option value="${k}"${o.pose===k?' selected':''}>${l}</option>`).join('')}</select></label></div>`;}).join('');
  const ov=Object.entries(d.over).sort((a,b)=>dimRank(a[0])-dimRank(b[0])).map(([e,o])=>`<div class="dimrow"><b class="mono">${e}</b> ${fmtD(o,['L','P','H'])} cm${o.note?' · '+esc(o.note):''} <button type="button" class="btn sm ghost" data-act="dimoverdel" data-e="${e}" aria-label="Retirer">✕</button></div>`).join('');
  const typeOpt=t=>Object.entries(SKI?{botte:TYPE.botte}:{botte:'Bottes',fix:'Fixations'}).map(([k,l])=>`<option value="${k}"${k===t?' selected':''}>${l}</option>`).join('');
  const bt=st.boxType||'botte',sz=sizesOf(bt);
  const boxes=d.boxes.slice().sort((x,y)=>x.type.localeCompare(y.type)||(x.marque||'').localeCompare(y.marque||'')||(x.modele||'').localeCompare(y.modele||''));
  /* couverture : modèles en stock sans dimensions de boîte */
  const models=new Map();S.articles.filter(a=>a.type!=='board').forEach(a=>{const k=[a.type,a.marque,a.modele].join('|');const m=models.get(k)||{a,miss:new Set(),n:0};m.n++;if(!boxFor(a))m.miss.add(a.taille);models.set(k,m);});
  const miss=[...models.values()].filter(m=>m.miss.size).sort((x,y)=>x.a.type.localeCompare(y.a.type)||x.a.marque.localeCompare(y.a.marque)||x.a.modele.localeCompare(y.a.modele));
  return `<div class="card"><h3>Dimensions des emplacements</h3>
      <p class="sub">En centimètres, la place utile (sans les montants). Si tous les emplacements d'un groupe sont pareils, une seule ligne suffit. Au milieu, MG et MD du même rack et du même niveau sont <b>la même étagère</b> : indiquez la profondeur totale, d'une allée à l'autre.</p>
      <div class="dimgs">${grp}</div>
      <details class="dimdet"${Object.keys(d.over).length?' open':''}><summary>Un emplacement a des mesures différentes ?</summary>
        ${ov||'<p class="sub">Aucun pour l\'instant.</p>'}
        <div class="dimadd"><select id="ovEmp" aria-label="Emplacement">${DIM_LOCS.map(e=>`<option>${e}</option>`).join('')}</select>
          ${inp('id="ovL"',null,'Longueur')}${inp('id="ovP"',null,'Profondeur')}${inp('id="ovH"',null,'Hauteur')}
          <input type="text" id="ovNote" placeholder="Note (ex. : poteau au milieu)" aria-label="Note">
          <button type="button" class="btn sm" data-act="dimoveradd">Ajouter</button></div></details></div>
    <div class="card"><h3>Dimensions des boîtes</h3>

      ${boxes.map(b=>`<div class="dimrow"><span><b>${b.type==='fix'?'Fixations':'Bottes'}</b> · ${b.marque?esc(b.marque):'toutes marques'} · ${b.modele?esc(b.modele):'tous modèles'} · ${b.from||b.to?`${esc(szLbl(b.type,b.from||'…'))} → ${esc(szLbl(b.type,b.to||'…'))}`:'toutes tailles'}</span> <b class="mono">${fmtD(b,['L','l','H'])} cm</b> <button type="button" class="btn sm ghost" data-act="boxdel" data-id="${b.id}" aria-label="Retirer">✕</button></div>`).join('')||'<p class="sub">Aucune boîte mesurée pour l\'instant.</p>'}
      <div class="boxadd">
        <div class="field"><label for="bxType">Type</label><select id="bxType">${typeOpt(bt)}</select></div>
        <div class="field"><label for="bxMarque">Marque <small class="opt">vide = toutes</small></label><input type="text" id="bxMarque" list="dl-bxm" autocomplete="off"><datalist id="dl-bxm">${S.brands.map(b=>`<option value="${esc(b)}"></option>`).join('')}</datalist></div>
        <div class="field"><label for="bxModele">Modèle <small class="opt">vide = tous</small></label><input type="text" id="bxModele" list="dl-bxmo" autocomplete="off"><datalist id="dl-bxmo">${modelOptions('')}</datalist></div>
        <div class="field"><label for="bxFrom">Tailles de</label><select id="bxFrom"><option value="">la plus petite</option>${sz.map(z=>`<option value="${esc(z)}">${esc(szLbl(bt,z))}</option>`).join('')}</select></div>
        <div class="field"><label for="bxTo">à</label><select id="bxTo"><option value="">la plus grande</option>${sz.map(z=>`<option value="${esc(z)}">${esc(szLbl(bt,z))}</option>`).join('')}</select></div>
        <div class="field"><label>Longueur × largeur × hauteur (cm)</label><div class="inline">${inp('id="bxL"',null,'Longueur')}${inp('id="bxl"',null,'Largeur')}${inp('id="bxH"',null,'Hauteur')}</div></div>
        <button type="button" class="btn primary" data-act="boxadd">Ajouter cette boîte</button></div>
      <details class="dimdet"><summary>${miss.length?`<b>${miss.length} modèle${miss.length>1?'s':''} en stock</b> sans dimensions de boîte (sur ${models.size})`:`Tous les modèles en stock ont des dimensions ✓`}</summary>
        ${miss.map(m=>`<div class="d">${m.a.type==='fix'?'Fix.':'Bottes'} · <b>${esc(m.a.marque)}</b> ${esc(m.a.modele)} <small class="opt">${[...m.miss].sort((x,y)=>sizeRankStr(x)-sizeRankStr(y)).map(z=>szLbl(m.a.type,z)).join(', ')}</small></div>`).join('')}</details></div>`;}


/* ---------- Mot de passe de protection (évite d'effacer le stock par mégarde) ----------
   Seule une empreinte du mot de passe est gardée (S.lock.h), partagée entre les appareils. */
function pwHash(pw){let h1=0x811c9dc5,h2=0x1505;const t='entrepot-snow|'+pw;
  for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0;}
  return h1.toString(16)+'-'+h2.toString(16);}
const LOCK_ACT={wipe:['Partir de zéro','Tout le stock (articles, commandes) sera effacé pour tout le monde. Impossible de revenir en arrière.','Effacer tout le stock'],
  reset:['Recharger la liste importée','Le stock actuel sera remplacé par la liste importée au début, pour tout le monde.','Recharger la liste'],
  pwchange:['Changer le mot de passe','Entrez le mot de passe actuel.','Continuer'],
  restore:['Revenir à une sauvegarde','Le stock (articles) sera remis comme dans la sauvegarde choisie, pour tout le monde. L\'état actuel est d\'abord gardé dans une sauvegarde.','Revenir à cette sauvegarde']};
function lockSheet(act){
  if(!S.lock||!S.lock.h||act==='pwset'){sheet(`<form id="lockNew" class="sheet-in" style="display:flex;flex-direction:column;gap:12px" data-next="${act}">
      <div class="sheet-h"><h2>Créer un mot de passe</h2><button type="button" class="btn ghost" data-act="close">Annuler</button></div>
      <p class="sub">Ce mot de passe sera demandé avant d'<b>effacer</b> ou de <b>recharger</b> le stock. Choisissez-le et notez-le bien.</p>
      <div class="field"><label for="pw1">Nouveau mot de passe</label><input type="password" id="pw1" autocomplete="new-password"></div>
      <div class="field"><label for="pw2">Le retaper</label><input type="password" id="pw2" autocomplete="new-password"></div>
      <button type="submit" class="btn primary">Enregistrer le mot de passe</button></form>`);setTimeout(()=>$('#pw1')&&$('#pw1').focus(),50);return;}
  const [title,txt,btn]=LOCK_ACT[act];
  sheet(`<form id="lockAsk" class="sheet-in" style="display:flex;flex-direction:column;gap:12px" data-act-to="${act}">
    <div class="sheet-h"><h2>${title}</h2><button type="button" class="btn ghost" data-act="close">Annuler</button></div>
    <p class="sub">${txt}</p>
    <div class="field"><label for="pwAsk">Mot de passe</label><input type="password" id="pwAsk" autocomplete="current-password"></div>
    <button type="submit" class="btn ${act==='pwchange'?'primary':'danger'}">${btn}</button></form>`);setTimeout(()=>$('#pwAsk')&&$('#pwAsk').focus(),50);}
function doReset(){S={...seed(),lock:S.lock,caps:S.caps,dims:S.dims};save();render();toast('Liste importée rechargée');}
function doWipe(){const keep={brands:S.brands,sizesB:S.sizesB,sizesF:S.sizesF,sizesS:S.sizesS,lock:S.lock,caps:S.caps,dims:S.dims};S={...seed(),...keep,demo:false,articles:[],orders:[],notifs:[],seq:1000};save();render();toast('Tout est effacé. Ajoutez votre premier article.');}
document.addEventListener('submit',e=>{const f=e.target;
  if(f.id==='lockNew'){e.preventDefault();const a=$('#pw1').value,b=$('#pw2').value;
    if(a.length<4){toast('Au moins 4 caractères');$('#pw1').focus();return;}if(a!==b){toast('Les deux mots de passe sont différents');$('#pw2').focus();return;}
    S.lock={h:pwHash(a),at:Date.now()};save();closeSheet();render();toast('<b>Mot de passe enregistré</b>');const nx=f.dataset.next;if(nx&&nx!=='pwchange'&&nx!=='pwset')lockSheet(nx);return;}
  if(f.id==='lockAsk'){e.preventDefault();const act=f.dataset.actTo;
    if(pwHash($('#pwAsk').value)!==S.lock.h){toast('<b>Mot de passe incorrect</b>');$('#pwAsk').value='';$('#pwAsk').focus();return;}
    closeSheet();if(act==='wipe')doWipe();else if(act==='reset')doReset();else if(act==='pwchange')lockSheet('pwset');else if(act==='restore')doRestore(st.restoreId);}});

/* ---------- Magasin : mini-appli téléphone ---------- */
/* Commander pas à pas : type → marque → modèle → homme/femme → taille → couleur → nombre */
const SH_STEPS=['type','marque','modele','genre','taille','couleur','qty'];
const SH_Q_GRID='Combien par taille ?';const SH_Q={grid:SH_Q_GRID,type:'Quoi ?',marque:'Quelle marque ?',modele:'Quel modèle ?',genre:'Homme ou femme ?',taille:'Quelle taille ?',couleur:'Quelle couleur ?',qty:'Combien ?'};
const shVal=(a,k)=>k==='couleur'?(a.couleur||''):a[k];
/* quantité déjà demandée (commandes en cours + commande en préparation sur ce téléphone) */
function reserved(aid){let n=0;
  S.orders.forEach(o=>{if(o.id===S.editing||!(o.status==='demandee'||o.status==='prep'))return;o.lines.forEach(l=>{if(l.aid===aid&&l.st!=='rupture')n+=l.qty;});});
  S.cart.forEach(l=>{if(l.aid===aid)n+=l.qty;});return n;}
const availOf=a=>Math.max(0,qOf(a)-reserved(a.id));
function shPool(upto){const v=st.sh.v,ks=SH_STEPS.slice(0,SH_STEPS.indexOf(upto));
  return S.articles.filter(a=>ks.every(k=>v[k]===undefined||shVal(a,k)===v[k]));}
function shOpts(k){const m=new Map();shPool(k).forEach(a=>{const x=shVal(a,k);const o=m.get(x)||{n:0,stock:0};o.n++;o.stock+=availOf(a);m.set(x,o);});return m;}
function shStart(preset){st.sh={step:'type',v:{},hist:[],q:1};
  if(preset){Object.assign(st.sh.v,preset);st.sh.hist=Object.keys(preset);shNext(st.sh.hist[st.sh.hist.length-1]);}}
function shNext(from){let i=SH_STEPS.indexOf(from)+1;
  while(i<SH_STEPS.length){const k=SH_STEPS[i];
    if(k==='qty'){st.sh.step='qty';st.sh.q=1;return;}
    if(k==='taille'){st.sh.step='grid';st.sh.gq={};return;}
    const o=shOpts(k);
    if((k==='genre'||k==='couleur')&&o.size===1){st.sh.v[k]=[...o.keys()][0];i++;continue;}
    st.sh.step=k;return;}}
function shPick(k,val){st.sh.v[k]=val;st.sh.hist.push(k);shNext(k);}
function shBack(){const k=st.sh.hist.pop();
  if(!k){st.sh.step=null;return;}
  SH_STEPS.slice(SH_STEPS.indexOf(k)).forEach(x=>delete st.sh.v[x]);st.sh.step=k;}
function shLabel(k,x){if(k==='type')return TYPE[x];if(k==='genre')return GENRE[x];if(k==='taille')return szLbl(st.sh.v.type,x);if(k==='couleur')return x||'Sans couleur précisée';return x;}

function bell(){const u=unread();if(!u.length)return'';const n=u[u.length-1];
  return `<div class="bell" role="status"><span>🔔 <b>${esc(n.text)}</b>${u.length>1?` <small>(+${u.length-1})</small>`:''}</span><button type="button" class="btn sm primary" data-act="seen">Voir</button></div>`;}

function vShopCmd(){
  if(!st.sh.step&&!S.cart.length&&!S.editing)shStart();
  const sh=st.sh;
  if(!sh.step)return vShopCart();
  const v=sh.v,crumbs=SH_STEPS.filter(k=>v[k]!==undefined&&k!=='qty').map(k=>`<span>${esc(shLabel(k,v[k]))}</span>`).join('');
  const head=`<div class="shead">${sh.hist.length||S.cart.length||S.editing?`<button type="button" class="btn back" data-act="shback">← Retour</button>`:''}
    ${crumbs?`<div class="crumbs">${crumbs}</div>`:''}</div>
    <h2 class="q">${SH_Q[sh.step]}</h2>`;
  if(sh.step==='qty')return head+shQty();
  if(sh.step==='grid')return head+`<div class="count">${sumLine(shPool('taille'),{shop:1})} pour ce choix</div>`+shGrid();
  const o=shOpts(sh.step);
  let keys=[...o.keys()];
  const tot=`<div class="count">${sumLine(shPool(sh.step),{shop:1})}${sh.step==='type'?' en tout':' pour ce choix'}</div>`;
  if(sh.step==='type')keys=Object.keys(TYPE);
  const sorter={taille:(x,y)=>sizeRankStr(x)-sizeRankStr(y),genre:(x,y)=>'HFU'.indexOf(x)-'HFU'.indexOf(y)}[sh.step]||((x,y)=>x===''?1:y===''?-1:x.localeCompare(y));
  if(sh.step!=='type')keys.sort(sorter);
  const tile=x=>{const c=o.get(x)||{n:0,stock:0};const z=!c.stock;
    const sub=sh.step==='type'?(c.n?`${c.stock} en stock`:'aucun enregistré'):z?'Rupture de stock':`${c.stock} en stock`;
    return `<button type="button" class="tile${sh.step==='type'?' big t-'+x:''}${z?' zero':''}" data-act="shpick" data-k="${sh.step}" data-v="${esc(x)}">${sh.step==='type'?PIC[x]||'':''}${esc(shLabel(sh.step,x))}<small>${sub}</small></button>`;};
  const empty=!keys.length?`<div class="empty">Rien d'enregistré ici pour l'instant.</div>`:'';
  return head+tot+`<div class="tiles${sh.step==='taille'?' sizes':''}">${keys.map(tile).join('')}</div>${empty}
    <details class="libre"><summary>Pas dans la liste ? Écrire la demande</summary>
      <div class="inline"><div class="field"><label for="freeTxt">Ce que vous cherchez</label><input type="text" id="freeTxt" placeholder="Ex. : Burton Ion 10.5 noir" value="${esc([v.marque,v.modele,v.genre&&GENRE[v.genre],v.taille&&shLabel('taille',v.taille)].filter(Boolean).join(' '))}"></div>
      <div class="field" style="flex:0 0 70px"><label for="freeQty">Nombre</label><input type="number" id="freeQty" min="1" max="50" value="1" style="text-align:center"></div>
      <button type="button" class="btn" data-act="free">Ajouter</button></div></details>`;}


/* Grille : toutes les tailles du modèle, un compteur − n + par taille, bouton fixe en bas */
function shGridPool(){const sh=st.sh,pool=shPool('taille');
  /* les articles sans couleur précisée s'affichent avec toutes les couleurs */
  const cols=new Map();pool.forEach(a=>{const c=a.couleur||'';cols.set(c,(cols.get(c)||0)+availOf(a));});
  if(cols.size>1&&cols.has(''))cols.delete('');
  if(cols.size>1&&(sh.v.couleur===undefined||!cols.has(sh.v.couleur)))sh.v.couleur=[...cols.entries()].sort((x,y)=>y[1]-x[1])[0][0];
  const list=cols.size>1?pool.filter(a=>!a.couleur||(a.couleur||'')===sh.v.couleur):pool;

function gridTot(){return Object.values(st.sh.gq||{}).reduce((x,y)=>x+(y||0),0);}
function shGrid(){const sh=st.sh,{cols,rows,a}=shGridPool();if(!a)return '<div class="empty">Rien d\'enregistré.</div>';

      <button type="button" class="btn primary block" data-act="gadd" id="gaddBtn"${tot?'':' disabled'}>${tot?`Ajouter ${tot} ${tot>1?pl[1]:pl[0]} à la commande`:'Choisissez les quantités'}</button></div>`;}
function gridAdd(){const {rows,a}=shGridPool(),gq=st.sh.gq||{};let n=0;
  rows.forEach(r=>{let rest=gq[r.z]||0;if(!rest)return;n+=rest;
    const g=r.arts.slice().sort((x,y)=>availOf(y)-availOf(x));
    const put=(x,k)=>{const ex=S.cart.find(l=>l.aid===x.id);if(ex)ex.qty+=k;else S.cart.push({aid:x.id,qty:k});};
    g.forEach(x=>{const k=Math.min(availOf(x),rest);if(k>0){put(x,k);rest-=k;}});if(rest>0)put(g[0],rest);});
  return {n,a};}

/* ---------- Pick-up : un employé du magasin monte chercher lui-même ----------

function vShopPick(){const pk=st.pk||(st.pk={});Object.keys(pk).forEach(id=>{const a=art(id);if(!a||!qOf(a))delete pk[id];else pk[id]=Math.min(qOf(a),Math.max(1,pk[id]));});

  const basket=chosen.length?`<div class="card mvbar"><div class="mvhead"><b>Je prends ${nb} boîte${nb>1?'s':''}</b><button type="button" class="btn sm ghost" data-act="pkclear">Tout retirer</button></div>
      <div class="list">${chosen.map(a=>`<div class="d">×${pk[a.id]} · <b>${esc(a.marque)} ${esc(a.modele)}</b> ${esc(szLbl(a.type,a.taille))} · <b class="mono">${esc(a.emp)}</b>${pk[a.id]>availOf(a)?' · <span class="bad">réservée pour une commande</span>':''}</div>`).join('')}</div>
      ${nameField('Qui prend ? (touchez votre nom)',NOMS.magasin,'Autre nom…')}
      <button type="button" class="btn primary block" data-act="pkgo">✓ J'ai pris ${nb} boîte${nb>1?'s':''}</button></div>`:'';
  return `<h2 class="q">Pick-up</h2>

    ${show?`<div class="count">${sumLine(list,{shop:1})}</div><div class="list">${list.slice(0,MAX).map(row).join('')||'<div class="empty">Rien trouvé.</div>'}</div>${list.length>MAX?`<p class="sub">Les ${MAX} premiers sont affichés : précisez la recherche.</p>`:''}`

function pickGo(){const pk=st.pk||{},L=Object.entries(pk).map(([id,k])=>[art(id),k]).filter(([a,k])=>a&&k>0);if(!L.length)return;
  const who=me();if(!who){needName();return;}
  const at=Date.now(),d=new Date(at),pre=String(d.getDate()).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0'),k=S.orders.filter(o=>o.pickup&&o.num&&o.num.startsWith('P'+pre+'-')).length+1;
  const o={id:at,num:`P${pre}-${k}`,at,by:who,status:'recue',pickup:true,deducted:true,readyAt:at,lines:[]};let n=0;
  L.forEach(([a,q])=>{q=Math.min(q,qOf(a));if(!q)return;a.qty=qOf(a)-q;n+=q;o.lines.push({aid:a.id,qty:q,st:'ok',done:q,by:who});});
  if(!n)return;S.orders.push(o);
  notify('entrepot',`Pick-up : ${who} a pris ${n} boîte${n>1?'s':''} (${L.slice(0,3).map(([a])=>`${a.marque} ${a.modele} ${szLbl(a.type,a.taille)} en ${a.emp}`).join(', ')}${L.length>3?'…':''})`);
  pushMeta={kind:'pickup',ref:String(o.id),label:'Pick-up de '+who};save();st.pk={};render();
  toast(`<b>Noté : ${n} boîte${n>1?'s':''}</b> retirée${n>1?'s':''} du stock. L'entrepôt est prévenu.`);}
function pickUndo(id){const o=S.orders.find(x=>String(x.id)===String(id)&&x.pickup);if(!o){toast('Pick-up introuvable');return;}
  o.lines.forEach(l=>{const a=art(l.aid);if(a)a.qty=qOf(a)+doneOf(l);});S.orders=S.orders.filter(x=>x!==o);
  notify('entrepot',`Pick-up #${onum(o)} annulé : les boîtes sont remises en stock`);
  pushMeta={kind:'undo',label:'Pick-up annulé'};save();render();toast('<b>Pick-up annulé</b> : les boîtes sont remises en stock');}
function shopOrder(o){
  const live=o.status==='demandee'||o.status==='prep';

      ${o.status==='demandee'?`<button type="button" class="btn danger${st.armed==='ocan'+o.id?' armed':''}" data-act="ocancel" data-o="${o.id}">${st.armed==='ocan'+o.id?'Confirmer : annuler #'+onum(o):'✕ Annuler la commande'}</button>`
        :o.status==='prep'?`<small class="opt">En préparation à l'entrepôt : pour annuler, prévenez-les.</small>`:''}
      ${o.status==='prete'?`<button type="button" class="btn primary" data-act="ost" data-o="${o.id}" data-v="recue">J'ai reçu la commande</button>`:''}
      ${o.pickup&&Date.now()-o.at<36e5*12?`<button type="button" class="btn${st.armed==='pku'+o.id?' armed':''}" data-act="pkundo" data-o="${o.id}">${st.armed==='pku'+o.id?'Confirmer : remettre en stock':'↶ Annuler ce pick-up'}</button>`:''}</div></div></div>`;}
function vShopMine(){const mine=S.orders.slice().sort((a,b)=>b.at-a.at);
  const open=mine.filter(o=>o.status!=='recue'),old=mine.filter(o=>o.status==='recue').slice(0,10);

function shopSend(){
  if(!S.cart.length)return;const by=(S.myName||'').trim();if(!by){$('#myName').focus();toast('Touchez votre nom');return;}
  if(S.editing){const o=S.orders.find(x=>x.id===S.editing);
    if(!o||!(o.status==='demandee'||o.status==='prep')){toast('Trop tard : la commande est déjà prête.');shEditEnd();render();return;}
    o.lines=S.cart.map(l=>{const old=o.lines.find(x=>x.aid===l.aid&&x.txt===l.txt&&x.qty===l.qty);return {...l,st:old?old.st:null};});
    o.note=S.cartNote.trim();o.editedAt=Date.now();o.by=by;
    notify('entrepot',`Commande #${onum(o)} corrigée par ${by}`);
    shEditEnd();save();st.tab='mine';render();toast(`Correction de la commande <b>#${onum(o)}</b> envoyée. L'entrepôt est prévenu.`);return;}
  const now=Date.now(),o={id:(S.seq=Math.max(S.seq||1000,...S.orders.map(x=>+x.id||0))+1),num:newNum(now),at:now,by,status:'demandee',note:S.cartNote.trim(),lines:S.cart.map(l=>({...l,st:null}))};
  S.orders.push(o);notify('entrepot',`Nouvelle commande #${onum(o)} de ${by} (${o.lines.length} ligne${o.lines.length>1?'s':''})`);
  S.cart=[];S.cartNote='';st.sh={step:null,v:{},hist:[],q:1};save();st.tab='mine';render();toast(`Commande <b>#${onum(o)}</b> envoyée. L'entrepôt est prévenu.`);}
function shEditEnd(){const b=S.cartSaved||{cart:[],note:''};S.cart=b.cart;S.cartNote=b.note;S.cartSaved=null;S.editing=null;st.sh={step:null,v:{},hist:[],q:1};}
function shopClick(act,t){
  switch(act){
    case'shpick':shPick(t.dataset.k,t.dataset.v);break;
    case'shback':shBack();break;
    case'shnew':shStart();break;
    case'shq':st.sh.q=Math.max(1,Math.min(50,st.sh.q+(+t.dataset.d)));render();return true;
    case'shadd':{const g=shPool('qty').slice().sort((x,y)=>availOf(y)-availOf(x));let rest=st.sh.q;
      const put=(a,n)=>{const ex=S.cart.find(l=>l.aid===a.id);if(ex)ex.qty+=n;else S.cart.push({aid:a.id,qty:n});};
      g.forEach(a=>{const n=Math.min(availOf(a),rest);if(n>0){put(a,n);rest-=n;}});
      if(rest>0)put(g[0],rest);
      const q=st.sh.q,pv={...st.sh.v},nx=t.dataset.next;st.sh={step:null,v:{},hist:[],q:1};
      if(nx==='taille')shStart({type:pv.type,marque:pv.marque,modele:pv.modele,genre:pv.genre});
      else if(nx==='modele')shStart({type:pv.type,marque:pv.marque});
      save();render();window.scrollTo(0,0);toast(`Ajouté : <b>${q}</b> · ${esc(artName(g[0]))}${nx==='taille'?' · choisissez la taille suivante':nx==='modele'?' · choisissez le modèle suivant':''}`);return true;}
    case'gq':{const z=t.dataset.z,gq=st.sh.gq=st.sh.gq||{};gq[z]=Math.max(0,Math.min(50,(gq[z]||0)+(+t.dataset.d)));render();return true;}
    case'gcol':st.sh.v.couleur=t.dataset.v;st.sh.gq={};render();return true;
    case'gadd':{const {n,a}=gridAdd();if(!n)return true;st.sh={step:null,v:{},hist:[],q:1};save();render();window.scrollTo(0,0);toast(`Ajouté : <b>${n}</b> · ${esc(a.marque+' '+a.modele)}`);return true;}
    case'shmore':{const a=art(t.dataset.id);if(!a)return true;shStart(t.dataset.k==='taille'?{type:a.type,marque:a.marque,modele:a.modele,genre:a.genre}:{type:a.type,marque:a.marque});break;}
    case'shorder':{const a=art(t.dataset.id);st.tab='cmd';shStart({type:a.type,marque:a.marque,modele:a.modele,genre:a.genre});break;}
    case'sqtype':st.sqType=st.sqType===t.dataset.v?'':t.dataset.v;break;
    case'seen':unread().forEach(n=>n.read=true);save();st.tab='mine';break;
    case'oedit':{const o=S.orders.find(x=>x.id===+t.dataset.o);if(!o)return true;
      if(!S.editing)S.cartSaved={cart:S.cart,note:S.cartNote};
      S.editing=o.id;S.cart=o.lines.map(l=>l.aid?{aid:l.aid,qty:l.qty}:{txt:l.txt,qty:l.qty});S.cartNote=o.note||'';st.sh={step:null,v:{},hist:[],q:1};st.tab='cmd';save();break;}
    case'ecancel':shEditEnd();save();break;
    case'ocancel':{const id=+t.dataset.o,k='ocan'+id;if(st.armed!==k){st.armed=k;render();return true;}st.armed=null;
      const o=S.orders.find(x=>x.id===id);if(!o)return true;
      if(o.status!=='demandee'){toast("Trop tard : l'entrepôt a déjà commencé la préparation.");break;}
      if(S.editing===id)shEditEnd();
      S.orders=S.orders.filter(x=>x.id!==id);notify('entrepot',`Commande #${onum(o)} annulée par ${me()||'le magasin'}`);
      save();toast(`Commande <b>#${esc(onum(o))}</b> annulée`);break;}
    default:return false;}
  render();window.scrollTo(0,0);return true;}

  sheet(`<div class="sheet-h"><div><div class="code" style="display:inline-block;font-size:20px;cursor:default">${code}</div><p class="sub" style="margin-top:6px">${esc(locLabel(code))}</p></div><button type="button" class="btn ghost" data-act="close">Fermer</button></div>

    ${ent?`<button type="button" class="btn primary" data-act="new" data-code="${code}">+ Ranger un nouveau modèle ici</button>`:''}`);}
function locOptions(cur){const groups={};LOCS.forEach(c=>{const z=/^[A-Z]+/.exec(c)[0];(groups[z]=groups[z]||[]).push(c);});
  const old=cur&&!LOCS.includes(cur)?`<option value="${esc(cur)}" selected>${esc(cur)} (n'existe plus, à changer)</option>`:'';

function sizeOptions(type,cur){const arr=sizesOf(type);const list=cur&&!arr.includes(cur)?[cur,...arr]:arr;return list.map(s=>`<option${s===cur?' selected':''}>${esc(s)}</option>`).join('');}

    </div></form>`);
  const f=$('#artForm');f.dataset.type=a.type;enterNav(f);
  /* lignes à ranger : une taille peut revenir plusieurs fois avec des couleurs différentes */
  let rows=[],nk=0;const sizeList=()=>sizesOf(f.dataset.type);
  const genColor=()=>$('#f-couleur').value.trim();
  const readRows=()=>{if(!multi)return;rows.forEach(r=>{const s=f.querySelector(`[data-fs="${r.k}"]`),c=f.querySelector(`[data-fc="${r.k}"]`),q=f.querySelector(`[data-fqi="${r.k}"]`);
    if(s)r.s=s.value;if(c)r.c=c.value.trim();if(q)r.q=Math.max(1,Math.min(999,parseInt(q.value)||1));});};
  const haveHere=()=>{const m=norm($('#f-marque').value.trim()),mo=norm($('#f-modele').value.trim()),emp=$('#f-emp').value,co=norm(fixColor(genColor())),ge=$('#f-genre').value;
    return new Set(S.articles.filter(x=>x.type===f.dataset.type&&norm(x.marque)===m&&norm(x.modele)===mo&&x.emp===emp&&x.genre===ge&&norm(x.couleur)===co).map(x=>x.taille));};
  function renderSizes(){if(!multi)return;readRows();const have=haveHere(),used=new Set(rows.map(r=>r.s));

    const row=(lbl,arr)=>`<div class="szs">${lbl?`<span class="szl">${lbl}</span>`:''}${arr.map(chip).join('')}</div>`;
    const html=SKI&&f.dataset.type==='botte'?row('Mondopoint',S.sizesB):f.dataset.type==='botte'?row('US',S.sizesB.filter(s=>!/cm/.test(s)))+'<div style="height:6px"></div>'+row('cm',S.sizesB.filter(s=>/cm/.test(s))):f.dataset.type==='board'?row('cm',S.sizesS):row('',S.sizesF);

    const marque=sameAs($('#f-marque').value.trim(),S.brands);if(!marque){$('#f-marque').focus();toast('Indiquez la marque');return;}
    const modele=sameAs($('#f-modele').value.trim(),[...new Set(S.articles.filter(x=>x.marque===marque).map(x=>x.modele))]);if(!modele){$('#f-modele').focus();toast('Indiquez le modèle');return;}

    else{const stamp=Date.now().toString(36);rows.forEach((r,i)=>{const couleur=r.c?sameAs(fixColor(r.c),known):base.couleur;
      const ex=S.articles.find(x=>x.type===base.type&&x.marque===marque&&x.modele===modele&&x.genre===base.genre&&x.emp===base.emp&&norm(x.couleur)===norm(couleur)&&x.taille===r.s);
      if(ex){ex.qty=qOf(ex)+r.q;added++;}else S.articles.push({id:'a'+stamp+i,...base,couleur,taille:r.s,qty:r.q});});}
    save();closeSheet();render();
    const n=rows.length,tot=rows.reduce((x,r)=>x+r.q,0);
