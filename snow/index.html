    toast(id?`Modifié : <b>${esc(base.emp)}</b> · ${esc(marque+' '+modele)}`:`${n} ligne${n>1?'s':''} (${tot} pièce${tot>1?'s':''}) rangée${n>1?'s':''} en <b>${esc(base.emp)}</b> · ${esc(marque+' '+modele)}${added?` · ${added} ajoutée${added>1?'s':''} au stock existant`:''}`);});
}

/* « noir » est toujours enregistré « Black » */
function fixColor(c){return /^noire?$/i.test(String(c||'').trim())?'Black':c;}
/* Entrée dans un formulaire : passe à la case du dessous au lieu d'enregistrer */
function enterNav(f){
  f.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||e.isComposing)return;const t=e.target;
    if(!(t instanceof HTMLInputElement)||['button','submit','checkbox','radio'].includes(t.type))return;
    e.preventDefault();
    if(t.id==='m-call'){$('#m-apply').click();return;}
    const col=['mc','mqi','fqi'].find(k=>t.dataset[k]!==undefined);
    let next=null;

    else{const all=[...f.querySelectorAll('input:not([type=hidden]),select')].filter(x=>!x.disabled&&x.offsetParent!==null);next=all[all.indexOf(t)+1];}
    const go=n=>{n.focus();if(n.select)try{n.select();}catch(_){}};
    if(!next){t.blur();return;}
    if(col){/* enregistrer d'abord la valeur (la liste peut se redessiner), puis retrouver la case suivante */

    let cfgArts=null,artsSeen=false,migrating=false;
    const tryMigrate=async()=>{if(migrating||!artsSeen||!cfgArts||!cfgArts.length||(cloud.sent.arts&&cloud.sent.arts.size))return;migrating=true;
      try{for(let i=0;i<cfgArts.length;i+=400){const B=fs.writeBatch(db);cfgArts.slice(i,i+400).forEach(x=>B.set(fs.doc(db,C('arts'),artDocId(x.id)),{json:JSON.stringify(x),at:Date.now()}));await B.commit();}
        const j=cfgJson();cloud.sent.stock=j;await fs.setDoc(fs.doc(db,C('cfg'),'stock'),{json:j,v:2,at:Date.now()});}
      catch(e){console.warn('Migration',e);migrating=false;}};
    /* réglages (listes, mesures, mot de passe) */
    fs.onSnapshot(fs.doc(db,C('cfg'),'stock'),snap=>{
      if(!snap.exists()){cloud.empty=true;softRender();return;}
      cloud.empty=false;
      const o=JSON.parse(snap.data().json);
      if(Array.isArray(o.articles)&&o.articles.length&&!(cloud.sent.arts&&cloud.sent.arts.size)){cfgArts=o.articles;S.articles=o.articles;tryMigrate();}
      else if(o.articles&&cloud.sent.arts&&cloud.sent.arts.size&&role==='entrepot')setTimeout(()=>{cloud.sent.stock='';cloudPush();},1500); /* migration coupée en route, ou ancienne version de l'appli : on retire les articles de cfg */
      CFG_KEYS.forEach(k=>{if(o[k]!==undefined)S[k]=o[k];});cloud.sent.stock=cfgJson();
      saveLocal();softRender();setSync('on','En ligne');
    },cloudErr);
    /* articles : un document chacun */
    fs.onSnapshot(fs.collection(db,C('arts')),qs=>{
      const m=new Map();qs.forEach(d=>m.set(d.id,d.data().json));artsSeen=true;
      const first=!cloud.sent.arts;
      if(!m.size){if(cfgArts&&cfgArts.length){tryMigrate();return;}if(first&&S.articles.length)return; /* base vide : on attend le bouton « Envoyer » */}
      cloud.sent.arts=m;S.articles=[...m.values()].map(x=>JSON.parse(x));
      saveLocal();softRender();setSync('on','En ligne');dailyBackup();
    },cloudErr);
    [['orders','orders'],['notifs','notifs']].forEach(([col,key])=>{
      fs.onSnapshot(fs.collection(db,C(col)),qs=>{
        const m=new Map();qs.forEach(d=>m.set(d.id,d.data().json));
        const first=!cloud.sent[col];
        if(first&&!m.size&&cloud.empty&&S[key].length)return; /* base vide : on attend le bouton « Envoyer » */
        const before=unreadIds();
        cloud.sent[col]=m;
        S[key]=[...m.values()].map(x=>JSON.parse(x));
        if(key==='orders')S.orders.sort((x,y)=>x.at-y.at);
        saveLocal();softRender();setSync('on','En ligne');
        if(key==='notifs'&&!first){const fresh=unread().filter(n=>!before.has(String(n.id)));
          if(fresh.length){toast(`🔔 <b>${esc(fresh[fresh.length-1].text)}</b>`,true);try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}}
      },cloudErr);});
    /* historique : les 20 dernières modifications du stock */
    if(role==='entrepot')fs.onSnapshot(fs.query(fs.collection(db,C('journal')),fs.orderBy('at','desc'),fs.limit(20)),qs=>{
      cloud.journal=qs.docs.map(d=>({id:d.id,...d.data()}));updUndo();if(st.tab==='settings'||st.tab==='move')softRender();},e=>console.warn('Historique',e));
  }catch(e){console.warn('Synchro indisponible',e);cloud.on=false;setSync('off','Hors ligne');}
}
window.addEventListener('offline',()=>setSync('off','Hors ligne'));
window.addEventListener('online',()=>{if(cloud.on)setSync('on','En ligne');});
render();
cloudStart();
</script>
