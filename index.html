<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<link rel="manifest" href="manifest-entrepot.webmanifest">
<link rel="icon" href="icon-entrepot-v2-192.png">
<link rel="apple-touch-icon" href="icon-entrepot-v2-192.png">
<meta name="apple-mobile-web-app-title" content="Entrepôt">
<title>Entrepôt Snow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : appli mobile, en-tête sombre type signalétique d'entrepôt, barre d'onglets en bas, plan du U au centre */
:root{
  --bg:#edf1f4; --surface:#ffffff; --surface-2:#f5f8fa; --ink:#17212b; --muted:#5a6876;
  --line:#d2dae1; --line-strong:#9fb0bf; --head:#17212b; --head-ink:#f2f5f7;
  --accent:#e2570f; --accent-ink:#ffffff; --fill:#d6e6f3; --fill-line:#8fb4d3;
  --ok:#2c7d47; --ok-bg:#dcefe2; --warn:#99610d; --warn-bg:#f8ecd3; --bad:#b2322a; --bad-bg:#f6dcd9; --info:#1f5f99; --info-bg:#dbe9f6;
  --hatch:#c9d3dc;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --surface-2:#1d2832; --ink:#e6ecf1; --muted:#94a3b1;
  --line:#2b3844; --line-strong:#4b5e70; --head:#0a0f14; --head-ink:#e6ecf1;
  --accent:#ff7a33; --accent-ink:#1a0d04; --fill:#20384d; --fill-line:#3f6d93;
  --ok:#6fcf8e; --ok-bg:#183a25; --warn:#e7b25a; --warn-bg:#3b2c12; --bad:#f08a80; --bad-bg:#43201d; --info:#7db7ea; --info-bg:#173149;
  --hatch:#2f3d4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --surface-2:#1d2832; --ink:#e6ecf1; --muted:#94a3b1;
  --line:#2b3844; --line-strong:#4b5e70; --head:#0a0f14; --head-ink:#e6ecf1;
  --accent:#ff7a33; --accent-ink:#1a0d04; --fill:#20384d; --fill-line:#3f6d93;
  --ok:#6fcf8e; --ok-bg:#183a25; --warn:#e7b25a; --warn-bg:#3b2c12; --bad:#f08a80; --bad-bg:#43201d; --info:#7db7ea; --info-bg:#173149;
  --hatch:#2f3d4a; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--head);color:var(--head-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;background:var(--accent);transform:skewX(-14deg)}
.role{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--head-ink)}
.role .seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.role .seg button{color:var(--head-ink)}
.role .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

main{max-width:980px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-disp);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{color:var(--muted);margin:0;font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tabs button svg{width:22px;height:22px}
@media (max-width:400px){.tabs button{font-size:11px;padding:10px 2px 12px}.tabs button[aria-current="page"] svg{padding:3px 8px}}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--f-mono);padding:0 5px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:9px 10px;width:100%;box-sizing:border-box;min-width:0}
textarea{resize:vertical;min-height:60px}
.search{font-size:17px;padding:12px 14px !important}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select{width:auto;padding:6px 8px;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.fgrid select{padding:7px 8px;font-size:14px}
.szs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.szl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.sz{min-width:44px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font:700 14px var(--f-mono);cursor:pointer;display:inline-flex;align-items:baseline;gap:3px;justify-content:center}
.sz small{font:500 10px var(--f-body);color:var(--muted)}
.sz[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sz[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.sz.have{border-style:dashed}
.sz .qx{font:600 11px var(--f-mono);color:var(--muted);margin-left:2px}
.sz[aria-pressed="true"] .qx{color:var(--accent-ink)}
.sz.zero{border-color:var(--bad);border-style:dashed;color:var(--bad)}
.sz.zero .qx{color:var(--bad)}
.qn{color:var(--ink);font-weight:700}
.qn.zero{color:var(--bad)}
.qrows{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.qhead{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qsz{font:700 15px var(--f-mono)}
.m3{display:grid;grid-template-columns:62px minmax(0,1fr) auto 30px;gap:6px;align-items:center}
.m3 .del{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--bad);font-size:15px;cursor:pointer;padding:0}
.qrow.gone{opacity:.45}.qrow.gone .qsz{text-decoration:line-through;color:var(--bad)}
.qrow.gone input,.qrow.gone .stepper button{pointer-events:none}
.qrow.gone .del{background:var(--bad);color:#fff;border-color:var(--bad)}
.m3 input[type=text]{min-width:0;width:100%;box-sizing:border-box}
@media (max-width:480px){.m3{grid-template-columns:58px minmax(0,1fr) auto 28px;gap:5px}
  .m3 .stepper button{width:28px}.m3 .qty{width:38px !important}.m3 .del{width:28px;height:28px}
  .m3 input[type=text]{padding:9px 6px}}
.mixed{font-size:12px;color:var(--warn)}
.var{display:flex;flex-direction:column;gap:4px;padding-left:8px;border-left:3px solid var(--line-strong)}
.vl{font-size:12px;font-weight:600;color:var(--muted)}
.mk{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--info);margin-right:10px}

.code{font:700 15px var(--f-mono);letter-spacing:.02em;background:var(--ink);color:var(--surface);border-radius:4px;padding:6px 8px;border:0;cursor:pointer;white-space:nowrap;min-width:64px;text-align:center}
.code.none{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-strong);cursor:default;font-size:12px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .d{color:var(--muted);font-size:13px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:20px;text-align:center;color:var(--muted)}
.count{font-size:13px;color:var(--muted)}
.demo{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:2px 6px}

/* Plan */
.plan-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.plan{display:grid;min-width:280px;gap:5px;
  grid-template-columns:minmax(46px,.8fr) minmax(12px,.35fr) minmax(126px,1.6fr) minmax(12px,.35fr) minmax(66px,1fr);
  grid-template-areas:"fond fond fond fond fond" "g pl m al d" "ent ent ent ext ext"}
.col{display:flex;flex-direction:column;gap:5px}
.rack{border:1.5px solid var(--line-strong);border-radius:4px;background:var(--surface-2);padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:46px;box-sizing:border-box}
.mrow{display:flex;gap:5px;align-items:center}
.mrow .sep{width:1px;align-self:stretch;background:var(--line-strong)}
.rack.off{border-style:dashed;opacity:.55;justify-content:center}
.rk{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.03em;white-space:nowrap}
.rack.off .rk{font-weight:600;color:var(--muted)}
.chips{display:flex;gap:2px}
.chip{width:18px;height:22px;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface);font:600 11px var(--f-mono);color:var(--muted);cursor:pointer;padding:0;display:grid;place-items:center}
.chip.has{background:var(--fill);color:var(--ink);border-color:var(--fill-line)}
.chip.hit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.chip.void{visibility:hidden}
.zone-lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-disp);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center}
.pl{background:repeating-linear-gradient(-55deg,var(--hatch) 0 2px,transparent 2px 7px);border-radius:3px}
.fond{grid-area:fond}
.fond .rack{flex-direction:row;justify-content:center;gap:12px;min-height:34px}
.ent{grid-area:ent;display:flex;align-items:flex-end;justify-content:center;padding-top:6px}
.ent span{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);display:flex;flex-direction:column;align-items:center;gap:2px}
.ext{grid-area:ext;display:flex;flex-direction:column;gap:5px;padding-top:8px;border-top:1px dashed var(--line-strong)}
.mface{font:600 9px var(--f-mono);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend .chip{cursor:default;width:18px;height:18px;font-size:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Commandes */
.order{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.order.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.order-h{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.order-h .num{font:700 15px var(--f-mono)}
.order-h .main{flex:1;min-width:0}
.order-b{border-top:1px solid var(--line);padding:4px 0 10px}
.order-b .row{border-top:1px solid var(--line)}
.order-b .row:first-child{border-top:0}
.order-foot{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px 0;align-items:center}
.pill{font-size:12px;font-weight:700;letter-spacing:.03em;border-radius:20px;padding:3px 9px;white-space:nowrap}
.st-demandee{background:var(--info-bg);color:var(--info)}
.st-prep{background:var(--warn-bg);color:var(--warn)}
.st-prete{background:var(--ok-bg);color:var(--ok)}
.st-recue{background:var(--surface-2);color:var(--muted)}
.ln-ok{background:var(--ok-bg);color:var(--ok)}
.ln-rupture{background:var(--bad-bg);color:var(--bad)}
.tog button[aria-pressed="true"].ok{background:var(--ok);color:#fff}
.tog button[aria-pressed="true"].ko{background:var(--bad);color:#fff}
.qty{width:52px !important;text-align:center;font-weight:700;font-size:16px;padding:7px 4px !important;border-radius:0 !important;border-left:0 !important;border-right:0 !important;-moz-appearance:textfield}
.qty::-webkit-inner-spin-button,.qty::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper{display:flex;align-items:center;flex-direction:column;gap:2px}
.stepper .lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stepper .in{display:flex}
.stepper button{width:36px;border:1px solid var(--line-strong);background:var(--surface-2);font-size:18px;font-weight:700;cursor:pointer}
.stepper button:first-child{border-radius:6px 0 0 6px}.stepper button:last-child{border-radius:0 6px 6px 0}
.qbig{font:700 16px var(--f-mono);min-width:44px;text-align:center;border:2px solid var(--ink);border-radius:6px;padding:4px 6px;white-space:nowrap}
[hidden]{display:none !important}
.names{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.btn.nm{min-height:46px;padding:0 16px;font-size:16px;font-weight:600}
.btn.nm.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lbl-s{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#myName.nm-other{max-width:220px}#myName.nm-other.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.where{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.where h4{margin:0;font-size:14px}.where .sub{margin:0}
.wopt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;padding:10px;border:1px solid var(--line-strong);border-radius:10px;background:none;color:inherit;font:inherit;cursor:pointer}
.wopt .we{font-weight:700;font-size:16px;min-width:56px}.wopt small{color:var(--muted)}.wopt .mv{display:block;color:var(--accent);margin-top:4px}
.wopt .pick{font-weight:700;font-size:13px;color:var(--muted)}
.wopt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.wopt.on .pick{color:var(--accent)}
.mono{font-family:var(--f-mono)}
.capt{width:100%;border-collapse:collapse}.capt td,.capt th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}.capt input{width:74px}
h3.sec{margin:16px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.agrp-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.agrp .t,.plrow .t{font-weight:700}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.acell{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:4px;font:700 12px var(--f-mono);color:var(--muted)}
.acell input{width:100%;text-align:center;padding:6px 2px;font:700 16px var(--f-mono)}.acell.on{border-color:var(--accent);color:var(--ink)}
.warnc{border-color:var(--accent)}.mvl{margin-top:6px}.pe{color:var(--accent)}.bad{color:var(--bad)}
.arr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.testbtn{white-space:nowrap;flex:none}.testbtn.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.testban{background:#7c3aed;color:#fff;font-weight:700;border-radius:8px;padding:8px 12px;font-size:13px}
.tsz{margin-top:6px;padding:6px 8px;border-left:3px solid #7c3aed;background:color-mix(in srgb,#7c3aed 10%,transparent);font-size:13px;display:flex;flex-direction:column;gap:3px}
.chk{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:5px}
.chk.t{border-left:3px solid #7c3aed}.chk-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.chk-sz{font-size:13px;color:#a78bfa;font-weight:600}
.chk select{width:100%}
.dimgs{display:flex;flex-direction:column;gap:10px;margin-top:8px}.dimg{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.dimf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.dimf label,.dimp{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.dimf .dim-in{width:100%}
.dimp{flex-direction:row;align-items:center;gap:8px}
.dim-in{width:70px;text-align:center}.dimrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.dimdet{margin-top:10px}.dimdet summary{cursor:pointer;font-weight:600;padding:6px 0}
.dimadd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}.dimadd #ovNote{flex:1;min-width:160px}
.boxadd{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-items:end;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.opt{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.who{margin:8px 12px 0;font-size:14px}
.pick{margin:8px 12px 2px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.pick h4{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pick .pr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pick .pr .code{min-width:58px;font-size:14px;padding:4px 6px}
.pick .pr small{color:var(--muted)}
.note{margin:6px 12px 0;padding:8px 10px;background:var(--surface-2);border-radius:6px;font-size:14px}
.info{background:var(--info-bg);color:var(--info);border-radius:8px;padding:10px 12px;font-size:14px}

function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return"à l'instant";if(m<60)return`il y a ${m} min`;const h=Math.round(m/60);if(h<24)return`il y a ${h} h`;return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
const filtering=()=>!!(st.q.trim()||st.fType||st.fGenre||st.fMarque||st.fModele||st.fAnnee||st.fZone||st.fCouleur||st.fSerrage||st.fTailles.length);
const isSizeTok=t=>/^\d{1,2}(\.5)?$/.test(t)||/^(xs|s|m|l|xl|xxl|s\/m|m\/l|l\/xl)$/.test(t);
/* skip : nom du filtre à ignorer, pour calculer les choix encore possibles dans ce filtre */
function matches(a,skip){
  if(skip!=='type'&&st.fType&&a.type!==st.fType)return false;
  if(skip!=='genre'&&st.fGenre&&a.genre!==st.fGenre)return false;
  if(skip!=='marque'&&st.fMarque&&a.marque!==st.fMarque)return false;
  if(skip!=='modele'&&st.fModele&&a.modele!==st.fModele)return false;
  if(skip!=='annee'&&st.fAnnee&&String(a.annee)!==st.fAnnee)return false;
  if(skip!=='zone'&&st.fZone&&zoneOf(a.emp)!==st.fZone)return false;
  if(skip!=='couleur'&&st.fCouleur&&(a.couleur||'')!==st.fCouleur)return false;
  if(skip!=='serrage'&&st.fSerrage&&serOf(a)!==st.fSerrage)return false;
  if(skip!=='taille'&&st.fTailles.length&&!st.fTailles.includes(a.taille))return false;
  return textMatch(a,st.q);}
function textMatch(a,q){
  const toks=norm(q).replace(/(\d),5/g,'$1.5').split(/\s+/).filter(Boolean);if(!toks.length)return true;
  const sz=toks.filter(isSizeTok),other=toks.filter(t=>!isSizeTok(t));
  if(sz.length){const full=norm(a.taille).replace(/\s*cm$/,''),parts=full.split('/');if(!sz.some(t=>t===full||parts.includes(t)))return false;}
  const hay=norm(`${a.marque} ${a.modele} ${TYPE[a.type]} ${a.type==='fix'?'fix fixation':a.type==='board'?'snowboard board planche':'botte boots'} ${GENRE[a.genre]} ${a.taille} ${a.annee} ${a.emp} ${ZONE_LBL[zoneOf(a.emp)]||''} ${a.couleur||''} ${serOf(a)} ${a.note}`);
  const words=new Set(hay.split(/\s+/));
  return other.every(t=>t.length<=2?words.has(t):hay.includes(t));}
function facet(skip,get){const m=new Map();S.articles.filter(a=>matches(a,skip)).forEach(a=>{const k=String(get(a)??'');if(k)m.set(k,(m.get(k)||0)+1);});return m;}
const focusOrd=()=>st.focusOrder&&S.orders.find(o=>o.id===st.focusOrder);
function hits(){const fo=focusOrd();if(fo)return new Set(fo.lines.map(l=>l.aid&&art(l.aid)).filter(Boolean).map(a=>a.emp));
  if(st.focus){const a=art(st.focus);return new Set(a?[a.emp]:[]);}if(!filtering())return new Set();return new Set(S.articles.filter(matches).map(a=>a.emp));}

let actx;function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;[0,.18].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i?1175:880;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.18,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.25);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.3);});}catch(e){}}

function chip(code,l,H,count){

function lineSet(o,i,patch,orderPatch){

/* ---------- Capacités et conseil de rangement ----------
   Droite : niveaux 1-2 = même capacité, niveau 3 à part. Milieu (MG et MD) : pareil, en plus petit.
   Fond, Gauche (fins de série), Étagère et Blocs ne sont pas gérés (rangement libre).
   Capacité par défaut = l'emplacement le plus rempli du groupe (considéré comme plein). */
const CAP_GROUPS={D12:'Droite · niveaux 1 et 2',D3:'Droite · niveau 3',M12:'Milieu (côtés G et D) · niveaux 1 et 2',M3:'Milieu (côtés G et D) · niveau 3'};
function capGroup(emp){const m=/^([A-Z]+)\d+\.(\d)$/.exec(emp||'');if(!m)return null;
  if(m[1]==='D')return m[2]==='3'?'D3':'D12';if(m[1]==='MG'||m[1]==='MD')return m[2]==='3'?'M3':'M12';return null;}
function occMap(){const o={};S.articles.forEach(a=>{const x=o[a.emp]=o[a.emp]||{botte:0,fix:0,board:0};x[a.type]=(x[a.type]||0)+qOf(a);});return o;}
function capsCalc(){const c={};Object.keys(CAP_GROUPS).forEach(g=>c[g]={botte:0,fix:0});
  Object.entries(occMap()).forEach(([emp,o])=>{const g=capGroup(emp);if(!g)return;
    if(o.botte&&!o.fix)c[g].botte=Math.max(c[g].botte,o.botte);if(o.fix&&!o.botte)c[g].fix=Math.max(c[g].fix,o.fix);});
  const rs=Object.values(c).filter(x=>x.botte&&x.fix).map(x=>x.botte/x.fix),r=rs.length?rs.reduce((a,b)=>a+b)/rs.length:1.1;
  Object.values(c).forEach(x=>{if(!x.botte&&x.fix)x.botte=Math.round(x.fix*r);if(!x.fix&&x.botte)x.fix=Math.round(x.botte/r);if(!x.botte)x.botte=20;if(!x.fix)x.fix=18;});
  return c;}
const caps=()=>{if(!S.caps||!S.caps.D12)S.caps=capsCalc();return S.caps;};
function capCtx(occ){const C=caps();
  const cap=(emp,t)=>{const g=capGroup(emp);return g?(t==='botte'?C[g].botte:C[g].fix):0;};
  const fill=emp=>{const g=capGroup(emp);if(!g)return 1;const o=occ[emp]||{botte:0,fix:0,board:0};return (o.botte||0)/C[g].botte+((o.fix||0)+(o.board||0))/C[g].fix;};
  const free=(emp,t)=>Math.max(0,Math.floor((1-fill(emp))*cap(emp,t)+1e-6));
  const add=(emp,t,n)=>{const x=occ[emp]=occ[emp]||{botte:0,fix:0,board:0};x[t]=(x[t]||0)+n;};
  return {cap,fill,free,add};}
const plural=(n,a,b)=>n>1?b:a;
/* Règles de rangement (choix de l'entrepôt) :
   - bottes : de préférence au milieu (MG / MD), plus facile d'accès ;
     droite niveaux 1-2 seulement pour un gros lot (seuil dans Réglages) ou en dernier recours ;
     droite niveau 3 : jamais de bottes.
   - fixations : à droite (tous niveaux) ; milieu en dernier recours.
   locTier : 0 = interdit, 1 = conseillé, 2 = dernier recours */
const bigLot=()=>(caps().big||40);
function locTier(t,emp,big){const g=capGroup(emp);if(!g)return 0;
  if(t==='botte'){if(g==='D3')return 0;if(g==='M12'||g==='M3')return 1;return big?1:2;}
  if(g==='D12'||g==='D3')return 1;return 2;}
const tierOrder=(t,e,big)=>{const k=locTier(t,e,big);/* à rang égal : milieu avant droite pour les bottes */return k*2+(t==='botte'&&capGroup(e)[0]==='D'?1:0);};
/* Conseils pour ranger n boîtes d'un modèle au même endroit : [{emp, why, moves:[{ids,from,to,label,n}]}] */
function placeSuggest(t,marque,modele,genre,n){
  const big=t==='botte'&&n>=bigLot();
  const occ=occMap(),X=capCtx(occ),ok=(ty,e,b)=>locTier(ty,e,b)>0,managed=LOCS.filter(e=>ok(t,e,big));
  const key=a=>[a.type,norm(a.marque),norm(a.modele),a.genre].join('|'),K=[t,norm(marque),norm(modele),genre].join('|');
  const here=new Map();S.articles.filter(a=>key(a)===K).forEach(a=>here.set(a.emp,(here.get(a.emp)||0)+qOf(a)));
  const sameLocs=[...here.entries()].sort((a,b)=>b[1]-a[1]);const res=[];
  /* 1. avec le même modèle, s'il y a la place (et si l'emplacement est permis) */
  const fit=sameLocs.find(([e])=>ok(t,e,big)&&X.free(e,t)>=n);
  if(fit)res.push({emp:fit[0],why:`avec ${fit[1]} ${modele} déjà là · place pour ≈ ${X.free(fit[0],t)}`,moves:[]});
  /* 2. sinon : libérer de la place à côté du même modèle en déplaçant de petits restes */
  const main=sameLocs.find(([e])=>ok(t,e,big));
  if(!fit&&main){const L=main[0],occ2=JSON.parse(JSON.stringify(occ)),Y=capCtx(occ2);
    const groups=new Map();S.articles.filter(a=>a.emp===L&&key(a)!==K&&qOf(a)>0&&!a._new).forEach(a=>{const k=key(a);const g=groups.get(k)||{ids:[],n:0,t:a.type,a,k};g.ids.push(a.id);g.n+=qOf(a);groups.set(k,g);});
    const moves=[];
    for(const g of [...groups.values()].filter(g=>g.n<=Math.max(6,n)).sort((x,y)=>x.n-y.n)){if(Y.free(L,t)>=n||moves.length>=3)break; /* seulement de petits restes */
      const homes=new Set(S.articles.filter(a=>key(a)===g.k&&a.emp!==L).map(a=>a.emp));
      const dests=LOCS.filter(e=>e!==L&&ok(g.t,e,false)&&Y.free(e,g.t)>=g.n).sort((x,y)=>(homes.has(y)-homes.has(x))||tierOrder(g.t,x,false)-tierOrder(g.t,y,false)||Y.free(x,g.t)-Y.free(y,g.t));
      if(!dests.length)continue;const D=dests[0];
      Y.add(L,g.t,-g.n);Y.add(D,g.t,g.n);
      moves.push({ids:g.ids,from:L,to:D,n:g.n,label:`${g.a.marque} ${g.a.modele} ${GENRE[g.a.genre]||''}`.trim()});}
    if(moves.length&&Y.free(L,t)>=n)res.push({emp:L,why:`avec ${main[1]} ${modele} déjà là, après ${moves.length} ${plural(moves.length,'déplacement','déplacements')}`,moves});}
  /* 3. un emplacement conseillé avec de la place : même marque d'abord, puis le plus juste */
  const brandAt=new Set(S.articles.filter(a=>a.type===t&&norm(a.marque)===norm(marque)).map(a=>a.emp));
  managed.filter(e=>!res.some(r=>r.emp===e)&&X.free(e,t)>=n)
    .sort((a,b)=>tierOrder(t,a,big)-tierOrder(t,b,big)||(brandAt.has(b)-brandAt.has(a))||X.free(a,t)-X.free(b,t)).slice(0,res.length?2:3)
    .forEach(e=>res.push({emp:e,why:(X.fill(e)<0.02?'emplacement vide':brandAt.has(e)?`avec d'autres ${marque}`:'place libre')+` · place pour ≈ ${X.free(e,t)}`+(locTier(t,e,big)===2?' · dernier recours':''),moves:[]}));
  return {res,split:null,here:sameLocs};}
/* Trop gros pour un seul endroit : on répartit par groupes de tailles entières (une taille n'est coupée que si elle ne tient nulle part) */
function splitLot(t,marque,modele,genre,sizes){
  const n=Object.values(sizes).reduce((x,y)=>x+y,0),big=t==='botte'&&n>=bigLot();
  const occ=occMap(),X=capCtx(occ),K=[t,norm(marque),norm(modele),genre].join('|');
  const same=new Set(S.articles.filter(a=>[a.type,norm(a.marque),norm(a.modele),a.genre].join('|')===K).map(a=>a.emp));
  const zs=Object.keys(sizes).filter(z=>sizes[z]>0).sort((x,y)=>(t==='fix'?(S.sizesF.indexOf(x)+1||99)-(S.sizesF.indexOf(y)+1||99):sizeRankStr(x)-sizeRankStr(y))).map(z=>({z,q:sizes[z]}));
  const locs=LOCS.filter(e=>locTier(t,e,big)>0&&X.free(e,t)>0).map(e=>({e,room:X.free(e,t)}))
    .sort((a,b)=>(same.has(b.e)-same.has(a.e))||tierOrder(t,a.e,big)-tierOrder(t,b.e,big)||b.room-a.room);
  const chunks=new Map(),take=(L,z,q)=>{const c=chunks.get(L.e)||{emp:L.e,n:0,sizes:{}};c.sizes[z]=(c.sizes[z]||0)+q;c.n+=q;L.room-=q;chunks.set(L.e,c);};
  let i=0;
  for(const L of locs){if(i>=zs.length)break;while(i<zs.length&&zs[i].q<=L.room){take(L,zs[i].z,zs[i].q);i++;}}
  const rest=[];for(;i<zs.length;i++){let q=zs[i].q;for(const L of [...locs].sort((a,b)=>b.room-a.room)){if(q<=0)break;const k=Math.min(q,L.room);if(k>0){take(L,zs[i].z,k);q-=k;}}if(q>0)rest.push({z:zs[i].z,q});}
  const out=[...chunks.values()];if(rest.length){const c={emp:null,n:0,sizes:{}};rest.forEach(r=>{c.sizes[r.z]=r.q;c.n+=r.q;});out.push(c);}
  return out;}
function applyMoves(moves){let k=0;moves.forEach(m=>m.ids.forEach(id=>{const a=art(id);if(!a||a.emp!==m.from)return;
  const ex=S.articles.find(x=>x!==a&&x.emp===m.to&&x.type===a.type&&x.marque===a.marque&&x.modele===a.modele&&x.genre===a.genre&&x.taille===a.taille&&norm(x.couleur)===norm(a.couleur));
  if(ex){ex.qty=qOf(ex)+qOf(a);S.articles=S.articles.filter(y=>y!==a);}else a.emp=m.to;k++;}));return k;}
function movesSheet(moves,emp,title){

    <div class="sheet-h"><h2>${title}</h2><button type="button" class="btn ghost" data-act="close">OK</button></div>

/* ---------- Arrivage : saisir tout ce qui arrive, puis plan de rangement ---------- */

const gSizes=g=>Object.keys(g.sizes).filter(z=>g.sizes[z]>0).sort((x,y)=>(g.type==='fix'?(S.sizesF.indexOf(x)+1||99)-(S.sizesF.indexOf(y)+1||99):sizeRankStr(x)-sizeRankStr(y)));
const gName=g=>`${g.marque} ${g.modele}`;

/* Plan : simulé sur une copie du stock, un modèle après l'autre (les plus gros d'abord) */
function planArrivage(){const A=arr(),real=S.articles,sim=JSON.parse(JSON.stringify(real));S.articles=sim;const out=[];
  try{
    [...A.groups].sort((a,b)=>gTot(b)-gTot(a)).forEach(g=>{const n=gTot(g);if(!n)return;
      const step={g,n,chunks:[],moves:[],why:'',alts:[]};
      /* un morceau = un emplacement + ses tailles ; on l'ajoute au stock simulé pour le modèle suivant */
      const put=(emp,sz)=>{const k=Object.values(sz).reduce((x,y)=>x+y,0);step.chunks.push({emp,n:k,sizes:sz});
        if(emp)Object.entries(sz).forEach(([z,q])=>S.articles.push({id:'sim'+Math.random(),_new:1,type:g.type,marque:g.marque,modele:g.modele,genre:g.genre,taille:z,couleur:g.couleur,emp,qty:q}));};
      if(g.emp){g.over={};Object.keys(g.sizes).forEach(z=>g.over[z]=g.emp);delete g.emp;}
      const over=g.over||{},forced={},all={};
      Object.keys(g.sizes).forEach(z=>{if(!(g.sizes[z]>0))return;if(over[z])(forced[over[z]]=forced[over[z]]||{})[z]=g.sizes[z];else all[z]=g.sizes[z];});
      Object.entries(forced).forEach(([e,sz])=>{put(e,sz);step.chunks[step.chunks.length-1].forced=true;});
      const nRest=Object.values(all).reduce((x,y)=>x+y,0);
      if(!nRest){step.why='emplacement choisi par vous';out.push(step);return;}
      if(g.type==='board'){const h=S.articles.find(a=>a.type==='board'&&norm(a.marque)===norm(g.marque)&&norm(a.modele)===norm(g.modele));put(h?h.emp:null,all);step.why=h?'avec le même modèle':'snowboards : choisissez l\'emplacement';out.push(step);return;}

      else{splitLot(g.type,g.marque,g.modele,g.genre,all).forEach(c=>put(c.emp,c.sizes));
        step.why=`trop gros pour un seul endroit : réparti par tailles en ${step.chunks.filter(c=>c.emp).length} emplacements`;}

  }finally{S.articles=real;}
  return out;}

function arrValidate(){const A=arr(),T=!!A.test,realA=S.articles,realB=S.brands;
  if(T){S.articles=JSON.parse(JSON.stringify(realA));S.brands=realB.slice();}
  const plan=planArrivage();let n=0,mv=0;const stamp=Date.now().toString(36);const known=[...new Set(S.articles.map(x=>x.couleur).filter(Boolean))];
  if(!S.brands.includes)S.brands=[];
  plan.forEach((p,pi)=>{if(p.moves.length)mv+=applyMoves(p.moves);const g=p.g;
    if(!S.brands.includes(g.marque)){S.brands.push(g.marque);S.brands.sort((x,y)=>x.localeCompare(y));}
    chunkLines(p).forEach((l,li)=>{if(!l.emp)return;
      const ex=S.articles.find(x=>x.type===g.type&&x.marque===g.marque&&x.modele===g.modele&&x.genre===g.genre&&x.emp===l.emp&&x.taille===l.taille&&norm(x.couleur)===norm(g.couleur));
      if(ex)ex.qty=qOf(ex)+l.qty;else S.articles.push({id:'a'+stamp+'r'+pi+'_'+li,type:g.type,marque:g.marque,modele:g.modele,genre:g.genre,taille:l.taille,annee:g.annee,emp:l.emp,note:'',couleur:g.couleur,serrage:g.serrage,qty:l.qty});
      n+=l.qty;});});
  const done=plan;
  if(T){S.articles=realA;S.brands=realB;}
  else{(S.arrLog=S.arrLog||[]).push({at:Date.now(),from:A.from,note:A.note,n,models:plan.length,by:me()});if(S.arrLog.length>30)S.arrLog.shift();
    S.arr={from:A.from,note:'',groups:[],test:false};save();}
  sheet(`<div class="sheet-in" style="display:flex;flex-direction:column;gap:10px">
    ${T?`<div class="testban">ESSAI · rien n'a été changé dans le stock</div>`:''}
    <div class="sheet-h"><h2>${T?'Essai de rangement':'Arrivage rangé'} · ${n} boîtes</h2><button type="button" class="btn ghost" data-act="close">OK</button></div>

    <p class="sub">${T?`C'était un essai : le stock n'a pas bougé. L'arrivage est gardé, vous pouvez le modifier et réessayer.`:`Le stock est à jour${mv?', déplacements compris':''}.`}</p></div>`);
  render();}


/* ---------- Dimensions (cm) : emplacements et boîtes ----------
   S.dims = {locs:{D12:{L,P,H,pose},...}, over:{emp:{L,P,H}}, boxes:[{id,type,marque,modele,from,to,L,l,H}]}
   Pas encore utilisé pour le calcul : on collecte d'abord les mesures. */
const DIM_GROUPS={D12:['Droite · niveaux 1 et 2','Profondeur'],D3:['Droite · niveau 3','Profondeur'],
  M12:['Milieu · niveaux 1 et 2 (étagère double face G + D)','Profondeur totale, allée G → allée D'],M3:['Milieu · niveau 3 (étagère double face G + D)','Profondeur totale, allée G → allée D']};
const POSE={plat:'À plat',tranche:'Sur la tranche',mixte:'À plat devant + sur la tranche derrière'};
const dims=()=>{const d=S.dims=S.dims||{};d.locs=d.locs||{};d.over=d.over||{};d.boxes=d.boxes||[];return d;};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return n>0?Math.round(n*10)/10:null;};
const fmtD=(o,keys)=>keys.map(k=>o&&o[k]!=null?String(o[k]).replace('.',','):'?').join(' × ');
/* le plus précis l'emporte : modèle > marque > toutes marques ; puis la plage de tailles la plus étroite */
function boxFor(a){const rk=z=>a.type==='fix'?(S.sizesF.indexOf(z)+1||99):sizeRankStr(z);const r=rk(a.taille);
  const c=dims().boxes.filter(b=>b.type===a.type&&(!b.marque||norm(b.marque)===norm(a.marque))&&(!b.modele||norm(b.modele)===norm(a.modele))&&(!b.from||rk(b.from)<=r)&&(!b.to||r<=rk(b.to)));
  return c.sort((x,y)=>(!!y.modele-!!x.modele)||(!!y.marque-!!x.marque)||((x.to?rk(x.to):999)-(x.from?rk(x.from):0))-((y.to?rk(y.to):999)-(y.from?rk(y.from):0)))[0]||null;}
function vDims(){const d=dims();
  const inp=(attr,v,lbl)=>`<input type="text" inputmode="decimal" ${attr} value="${v!=null?String(v).replace('.',','):''}" placeholder="cm" aria-label="${lbl}" class="dim-in">`;

    <div class="dimf"><label>Longueur${inp(`data-dim="${g}:L"`,o.L,'Longueur')}</label><label>${g[0]==='M'?'Profondeur totale':'Profondeur'}${inp(`data-dim="${g}:P"`,o.P,pl)}</label><label>Hauteur${inp(`data-dim="${g}:H"`,o.H,'Hauteur')}</label></div>
    <label class="dimp">Boîtes posées <select data-dim="${g}:pose"><option value="">—</option>${Object.entries(POSE).map(([k,l])=>`<option value="${k}"${o.pose===k?' selected':''}>${l}</option>`).join('')}</select></label></div>`;}).join('');
  const ov=Object.entries(d.over).sort((a,b)=>locRank(a[0])-locRank(b[0])).map(([e,o])=>`<div class="dimrow"><b class="mono">${e}</b> ${fmtD(o,['L','P','H'])} cm${o.note?' · '+esc(o.note):''} <button type="button" class="btn sm ghost" data-act="dimoverdel" data-e="${e}" aria-label="Retirer">✕</button></div>`).join('');

  const bt=st.boxType||'botte',sz=sizesOf(bt);

  /* couverture : modèles en stock sans dimensions de boîte */
  const models=new Map();S.articles.filter(a=>a.type!=='board').forEach(a=>{const k=[a.type,a.marque,a.modele].join('|');const m=models.get(k)||{a,miss:new Set(),n:0};m.n++;if(!boxFor(a))m.miss.add(a.taille);models.set(k,m);});

  return `<div class="card"><h3>Dimensions des emplacements</h3>

      <div class="dimgs">${grp}</div>
      <details class="dimdet"${Object.keys(d.over).length?' open':''}><summary>Un emplacement a des mesures différentes ?</summary>
        ${ov||'<p class="sub">Aucun pour l\'instant.</p>'}
        <div class="dimadd"><select id="ovEmp" aria-label="Emplacement">${LOCS.filter(capGroup).map(e=>`<option>${e}</option>`).join('')}</select>
          ${inp('id="ovL"',null,'Longueur')}${inp('id="ovP"',null,'Profondeur')}${inp('id="ovH"',null,'Hauteur')}
          <input type="text" id="ovNote" placeholder="Note (ex. : poteau au milieu)" aria-label="Note">
          <button type="button" class="btn sm" data-act="dimoveradd">Ajouter</button></div></details></div>
    <div class="card"><h3>Dimensions des boîtes</h3>
      <p class="sub">Longueur × largeur × hauteur de la boîte, en cm. Une ligne peut valoir pour toutes les marques, une marque, ou un seul modèle, et pour une plage de tailles. <b>Le plus précis l'emporte</b> : modèle, puis marque, puis toutes marques.</p>
      ${boxes.map(b=>`<div class="dimrow"><span><b>${b.type==='fix'?'Fixations':'Bottes'}</b> · ${b.marque?esc(b.marque):'toutes marques'} · ${b.modele?esc(b.modele):'tous modèles'} · ${b.from||b.to?`${esc(szLbl(b.type,b.from||'…'))} → ${esc(szLbl(b.type,b.to||'…'))}`:'toutes tailles'}</span> <b class="mono">${fmtD(b,['L','l','H'])} cm</b> <button type="button" class="btn sm ghost" data-act="boxdel" data-id="${b.id}" aria-label="Retirer">✕</button></div>`).join('')||'<p class="sub">Aucune boîte mesurée pour l\'instant.</p>'}
      <div class="boxadd">
        <div class="field"><label for="bxType">Type</label><select id="bxType">${typeOpt(bt)}</select></div>
        <div class="field"><label for="bxMarque">Marque <small class="opt">vide = toutes</small></label><input type="text" id="bxMarque" list="dl-bxm" autocomplete="off"><datalist id="dl-bxm">${S.brands.map(b=>`<option value="${esc(b)}"></option>`).join('')}</datalist></div>
        <div class="field"><label for="bxModele">Modèle <small class="opt">vide = tous</small></label><input type="text" id="bxModele" list="dl-bxmo" autocomplete="off"><datalist id="dl-bxmo">${modelOptions('')}</datalist></div>
        <div class="field"><label for="bxFrom">Tailles de</label><select id="bxFrom"><option value="">la plus petite</option>${sz.map(z=>`<option value="${esc(z)}">${esc(szLbl(bt,z))}</option>`).join('')}</select></div>
        <div class="field"><label for="bxTo">à</label><select id="bxTo"><option value="">la plus grande</option>${sz.map(z=>`<option value="${esc(z)}">${esc(szLbl(bt,z))}</option>`).join('')}</select></div>
        <div class="field"><label>Longueur × largeur × hauteur (cm)</label><div class="inline">${inp('id="bxL"',null,'Longueur')}${inp('id="bxl"',null,'Largeur')}${inp('id="bxH"',null,'Hauteur')}</div></div>
        <button type="button" class="btn primary" data-act="boxadd">Ajouter cette boîte</button></div>
      <details class="dimdet"><summary>${miss.length?`<b>${miss.length} modèle${miss.length>1?'s':''} en stock</b> sans dimensions de boîte (sur ${models.size})`:`Tous les modèles en stock ont des dimensions ✓`}</summary>
        ${miss.map(m=>`<div class="d">${m.a.type==='fix'?'Fix.':'Bottes'} · <b>${esc(m.a.marque)}</b> ${esc(m.a.modele)} <small class="opt">${[...m.miss].sort((x,y)=>sizeRankStr(x)-sizeRankStr(y)).map(z=>szLbl(m.a.type,z)).join(', ')}</small></div>`).join('')}</details></div>`;}


/* ---------- Mot de passe de protection (évite d'effacer le stock par mégarde) ----------
   Seule une empreinte du mot de passe est gardée (S.lock.h), partagée entre les appareils. */
function pwHash(pw){let h1=0x811c9dc5,h2=0x1505;const t='entrepot-snow|'+pw;
  for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0;}
  return h1.toString(16)+'-'+h2.toString(16);}
const LOCK_ACT={wipe:['Partir de zéro','Tout le stock (articles, commandes) sera effacé pour tout le monde. Impossible de revenir en arrière.','Effacer tout le stock'],
  reset:['Recharger la liste importée','Le stock actuel sera remplacé par la liste importée au début, pour tout le monde.','Recharger la liste'],
  pwchange:['Changer le mot de passe','Entrez le mot de passe actuel.','Continuer']};

  sheet(`<form id="lockAsk" class="sheet-in" style="display:flex;flex-direction:column;gap:12px" data-act-to="${act}">

function doReset(){S={...seed(),lock:S.lock,caps:S.caps,dims:S.dims};save();render();toast('Liste importée rechargée');}
function doWipe(){const keep={brands:S.brands,sizesB:S.sizesB,sizesF:S.sizesF,sizesS:S.sizesS,lock:S.lock,caps:S.caps,dims:S.dims};S={...seed(),...keep,demo:false,articles:[],orders:[],notifs:[],seq:1000};save();render();toast('Tout est effacé. Ajoutez votre premier article.');}
document.addEventListener('submit',e=>{const f=e.target;
  if(f.id==='lockNew'){e.preventDefault();const a=$('#pw1').value,b=$('#pw2').value;
    if(a.length<4){toast('Au moins 4 caractères');$('#pw1').focus();return;}if(a!==b){toast('Les deux mots de passe sont différents');$('#pw2').focus();return;}
    S.lock={h:pwHash(a),at:Date.now()};save();closeSheet();render();toast('<b>Mot de passe enregistré</b>');const nx=f.dataset.next;if(nx&&nx!=='pwchange'&&nx!=='pwset')lockSheet(nx);return;}
  if(f.id==='lockAsk'){e.preventDefault();const act=f.dataset.actTo;
    if(pwHash($('#pwAsk').value)!==S.lock.h){toast('<b>Mot de passe incorrect</b>');$('#pwAsk').value='';$('#pwAsk').focus();return;}
    closeSheet();if(act==='wipe')doWipe();else if(act==='reset')doReset();else if(act==='pwchange')lockSheet('pwset');}});

/* Commander pas à pas : type → marque → modèle → homme/femme → taille → couleur → nombre */
const SH_STEPS=['type','marque','modele','genre','taille','couleur','qty'];
const SH_Q={type:'Quoi ?',marque:'Quelle marque ?',modele:'Quel modèle ?',genre:'Homme ou femme ?',taille:'Quelle taille ?',couleur:'Quelle couleur ?',qty:'Combien ?'};
const shVal=(a,k)=>k==='couleur'?(a.couleur||''):a[k];
/* quantité déjà demandée (commandes en cours + commande en préparation sur ce téléphone) */
function reserved(aid){let n=0;
  S.orders.forEach(o=>{if(o.id===S.editing||!(o.status==='demandee'||o.status==='prep'))return;o.lines.forEach(l=>{if(l.aid===aid&&l.st!=='rupture')n+=l.qty;});});
  S.cart.forEach(l=>{if(l.aid===aid)n+=l.qty;});return n;}
const availOf=a=>Math.max(0,qOf(a)-reserved(a.id));
function shPool(upto){const v=st.sh.v,ks=SH_STEPS.slice(0,SH_STEPS.indexOf(upto));
  return S.articles.filter(a=>ks.every(k=>v[k]===undefined||shVal(a,k)===v[k]));}
function shOpts(k){const m=new Map();shPool(k).forEach(a=>{const x=shVal(a,k);const o=m.get(x)||{n:0,stock:0};o.n++;o.stock+=availOf(a);m.set(x,o);});return m;}
function shStart(preset){st.sh={step:'type',v:{},hist:[],q:1};
  if(preset){Object.assign(st.sh.v,preset);st.sh.hist=Object.keys(preset);shNext(st.sh.hist[st.sh.hist.length-1]);}}
function shNext(from){let i=SH_STEPS.indexOf(from)+1;
  while(i<SH_STEPS.length){const k=SH_STEPS[i];
    if(k==='qty'){st.sh.step='qty';st.sh.q=1;return;}
    const o=shOpts(k);
    if((k==='genre'||k==='couleur')&&o.size===1){st.sh.v[k]=[...o.keys()][0];i++;continue;}
    st.sh.step=k;return;}}
function shPick(k,val){st.sh.v[k]=val;st.sh.hist.push(k);shNext(k);}
function shBack(){const k=st.sh.hist.pop();
  if(!k){st.sh.step=null;return;}
  SH_STEPS.slice(SH_STEPS.indexOf(k)).forEach(x=>delete st.sh.v[x]);st.sh.step=k;}
function shLabel(k,x){if(k==='type')return TYPE[x];if(k==='genre')return GENRE[x];if(k==='taille')return szLbl(st.sh.v.type,x);if(k==='couleur')return x||'Sans couleur précisée';return x;}

  if(!st.sh.step&&!S.cart.length&&!S.editing)shStart();
  const sh=st.sh;
  if(!sh.step)return vShopCart();
  const v=sh.v,crumbs=SH_STEPS.filter(k=>v[k]!==undefined&&k!=='qty').map(k=>`<span>${esc(shLabel(k,v[k]))}</span>`).join('');
  const head=`<div class="shead">${sh.hist.length||S.cart.length||S.editing?`<button type="button" class="btn back" data-act="shback">← Retour</button>`:''}
    ${crumbs?`<div class="crumbs">${crumbs}</div>`:''}</div>
    <h2 class="q">${SH_Q[sh.step]}</h2>`;
  if(sh.step==='qty')return head+shQty();
  const o=shOpts(sh.step);
  let keys=[...o.keys()];
  if(sh.step==='type')keys=Object.keys(TYPE);
  const sorter={taille:(x,y)=>sizeRankStr(x)-sizeRankStr(y),genre:(x,y)=>'HFU'.indexOf(x)-'HFU'.indexOf(y)}[sh.step]||((x,y)=>x===''?1:y===''?-1:x.localeCompare(y));
  if(sh.step!=='type')keys.sort(sorter);
  const tile=x=>{const c=o.get(x)||{n:0,stock:0};const z=!c.stock;
    const sub=sh.step==='type'?(c.n?`${c.stock} en stock`:'aucun enregistré'):z?'Rupture de stock':`${c.stock} en stock`;
    return `<button type="button" class="tile${sh.step==='type'?' big t-'+x:''}${z?' zero':''}" data-act="shpick" data-k="${sh.step}" data-v="${esc(x)}">${sh.step==='type'?PIC[x]||'':''}${esc(shLabel(sh.step,x))}<small>${sub}</small></button>`;};
  const empty=!keys.length?`<div class="empty">Rien d'enregistré ici pour l'instant.</div>`:'';
  return head+`<div class="tiles${sh.step==='taille'?' sizes':''}">${keys.map(tile).join('')}</div>${empty}
    <details class="libre"><summary>Pas dans la liste ? Écrire la demande</summary>
      <div class="inline"><div class="field"><label for="freeTxt">Ce que vous cherchez</label><input type="text" id="freeTxt" placeholder="Ex. : Burton Ion 10.5 noir" value="${esc([v.marque,v.modele,v.genre&&GENRE[v.genre],v.taille&&shLabel('taille',v.taille)].filter(Boolean).join(' '))}"></div>
      <div class="field" style="flex:0 0 70px"><label for="freeQty">Nombre</label><input type="number" id="freeQty" min="1" max="50" value="1" style="text-align:center"></div>
      <button type="button" class="btn" data-act="free">Ajouter</button></div></details>`;}

function shQty(){const sh=st.sh,g=shPool('qty');const tot=g.reduce((s,a)=>s+availOf(a),0),q=sh.q;
  const a=g[0];const locs=[...new Set(g.map(x=>x.emp))].sort((x,y)=>locRank(x)-locRank(y));
  const alert=!tot?`<div class="alert bad">⚠ <b>Rupture de stock</b> : il n'en reste aucun à l'entrepôt.</div>`
    :q>tot?`<div class="alert warn">⚠ Il n'en reste que <b>${tot}</b>. L'entrepôt ne pourra pas tout fournir.</div>`
    :`<div class="alert ok">✓ Il en reste <b>${tot}</b> à l'entrepôt.</div>`;
  return `<div class="card pickd"><div class="t"><span class="mk">${esc(a.marque)}</span> ${esc(a.modele)}</div>
      <div class="d">${esc([TYPE[a.type],GENRE[sh.v.genre],shLabel('taille',sh.v.taille),sh.v.couleur,serOf(a)].filter(Boolean).join(' · '))}</div>
      <div class="d">📍 ${locs.map(c=>`<b>${esc(c)}</b> ${esc(locLabel(c))}`).join('<br>📍 ')}</div></div>
    ${alert}
    <div class="bigstep"><button type="button" data-act="shq" data-d="-1" aria-label="Moins">−</button><output aria-live="polite">${q}</output><button type="button" data-act="shq" data-d="1" aria-label="Plus">+</button></div>
    <button type="button" class="btn primary block" data-act="shadd">${tot?'Ajouter à la commande':'Demander quand même'}</button>`;}

function cartLine(l,i){const a=l.aid&&art(l.aid);
  let warn='';
  if(a){const left=Math.max(0,qOf(a)-(reserved(a.id)-l.qty));
    warn=!left?`<div class="alert bad sm">Rupture de stock</div>`:l.qty>left?`<div class="alert warn sm">Il n'en reste que ${left}</div>`:`<div class="d ok">✓ ${left} en stock</div>`;}
  return `<div class="cline"><div class="main"><div class="t">${a?`<span class="mk">${esc(a.marque)}</span> ${esc(a.modele)}`:`« ${esc(l.txt)} »`}</div>
      <div class="d">${a?esc([TYPE[a.type],GENRE[a.genre],szLbl(a.type,a.taille),a.couleur,serOf(a)].filter(Boolean).join(' · ')):'Demande écrite'}</div>${warn}</div>
    <div class="stepper"><div class="in"><button type="button" data-act="qstep" data-i="${i}" data-d="-1" aria-label="Moins">−</button><input type="number" class="qty" min="1" max="50" value="${l.qty}" data-qty="${i}" inputmode="numeric" aria-label="Nombre"><button type="button" data-act="qstep" data-i="${i}" data-d="1" aria-label="Plus">+</button></div></div>

  return `${ed?`<div class="alert warn" style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span>Vous corrigez la commande <b>#${ed.id}</b></span><button type="button" class="btn sm" data-act="ecancel">Annuler</button></div>`:''}

    <button type="button" class="btn block add" data-act="shnew">+ Ajouter un article</button>
    <div class="field"><label for="cartNote">Notes pour l'entrepôt <small class="opt">facultatif</small></label><textarea id="cartNote" placeholder="Ex. : client en caisse, urgent">${esc(S.cartNote)}</textarea></div>
    ${nameField('Qui commande ? (touchez votre nom)',NOMS.magasin,'Autre nom…')}

function vShopFind(){
  const q=st.sq||'',ft=st.sqType||'';
  const list=sortArts(S.articles.filter(a=>(!ft||a.type===ft)&&textMatch(a,q)));
  const groups=new Map();list.forEach(a=>{const k=[a.type,a.marque,a.modele,a.genre].join('|');if(!groups.has(k))groups.set(k,[]);groups.get(k).push(a);});

    const locs=[...new Set(g.map(x=>x.emp))].sort((x,y)=>locRank(x)-locRank(y));

    return `<div class="fcard"><div class="t"><span class="mk">${esc(a.marque)}</span> ${esc(a.modele)}</div><div class="d">${TYPE[a.type]} · ${GENRE[a.genre]}${serOf(a)?' · '+esc(serOf(a)):''}</div>
      ${[...vars.entries()].map(([c,xs])=>`<div class="var">${vars.size>1||c?`<span class="vl">${esc(c||'Sans couleur')}</span>`:''}<div class="szs">${xs.map(sz).join('')}</div></div>`).join('')}
      <div class="where">${locs.map(c=>`<div>📍 <b>${esc(c)}</b> ${esc(locLabel(c))}${locs.length>1?`<br><small>${esc(g.filter(x=>x.emp===c).map(x=>szLbl(x.type,x.taille)+(vars.size>1&&x.couleur?' '+x.couleur:'')).join(', '))}</small>`:''}</div>`).join('')}</div>

    <div class="tiles three">${[['botte','Bottes'],['fix','Fixations'],['board','Snowboards']].map(([v,l])=>`<button type="button" class="tile t-${v}" data-act="sqtype" data-v="${v}" aria-pressed="${ft===v}">${PIC[v]}${l}</button>`).join('')}</div>
    ${show?`<div class="count">${groups.size} modèle${groups.size>1?'s':''}</div>${cards||'<div class="empty">Rien trouvé.</div>'}`
      :'<p class="sub">Tapez un nom ou touchez un type pour voir le stock et où il est rangé.</p>'}`;}

function shopOrder(o){
  const live=o.status==='demandee'||o.status==='prep';
  const lines=o.lines.map(l=>{const a=l.aid&&art(l.aid);
    const name=a?`${a.marque} ${a.modele} · ${GENRE[a.genre]} · ${szLbl(a.type,a.taille)}${a.couleur?' · '+a.couleur:''}`:`« ${l.txt} »`;
    const fin=l.st==='ok'||l.st==='rupture',d=doneOf(l);
    return `<div class="oline"><b class="qbig">×${l.qty}</b><span>${esc(name)}${fin?`<br><small>${l.qty} demandée${l.qty>1?'s':''} · <b>${d} préparée${d>1?'s':''}</b></small>`:l.st==='cours'?'<br><small>En cours de préparation</small>':''}</span>${fin?`<span class="pill ln-${d<l.qty?'rupture':'ok'}">${d}/${l.qty}</span>`:''}</div>`;}).join('');
  return `<div class="order o-${o.status}"><div class="order-h" style="cursor:default"><span class="num">#${o.id}</span>
      <span class="main"><span class="count">${fmtDT(o.at)}${o.editedAt?` · corrigée à ${new Date(o.editedAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`:''}</span></span>
      <span class="pill st-${o.status}">${ST[o.status]}</span></div>
    <div class="order-b">${lines}${o.note?`<div class="note">${esc(o.note)}</div>`:''}
      <div class="order-foot">${live?`<button type="button" class="btn" data-act="oedit" data-o="${o.id}">✎ Corriger</button>`:''}
      ${o.status==='prete'?`<button type="button" class="btn primary" data-act="ost" data-o="${o.id}" data-v="recue">J'ai reçu la commande</button>`:''}</div></div></div>`;}
function vShopMine(){const mine=S.orders.slice().sort((a,b)=>b.at-a.at);
  const open=mine.filter(o=>o.status!=='recue'),old=mine.filter(o=>o.status==='recue').slice(0,10);
  return `<h2 class="q">Mes commandes</h2>
    <div class="info">Prototype : passez sur <b>Entrepôt</b> en haut pour préparer la commande, puis revenez ici pour voir la notification.</div>
    ${open.map(shopOrder).join('')||'<div class="empty">Aucune commande en cours.</div>'}
    ${old.length?`<h3>Reçues</h3>${old.map(shopOrder).join('')}`:''}`;}

function shopSend(){
  if(!S.cart.length)return;const by=(S.myName||'').trim();if(!by){$('#myName').focus();toast('Touchez votre nom');return;}
  if(S.editing){const o=S.orders.find(x=>x.id===S.editing);
    if(!o||!(o.status==='demandee'||o.status==='prep')){toast('Trop tard : la commande est déjà prête.');shEditEnd();render();return;}
    o.lines=S.cart.map(l=>{const old=o.lines.find(x=>x.aid===l.aid&&x.txt===l.txt&&x.qty===l.qty);return {...l,st:old?old.st:null};});
    o.note=S.cartNote.trim();o.editedAt=Date.now();o.by=by;
    notify('entrepot',`Commande #${o.id} corrigée par ${by}`);
    shEditEnd();save();st.tab='mine';render();toast(`Correction de la commande <b>#${o.id}</b> envoyée. L'entrepôt est prévenu.`);return;}
  const o={id:(S.seq=Math.max(S.seq||1000,...S.orders.map(x=>+x.id||0))+1),at:Date.now(),by,status:'demandee',note:S.cartNote.trim(),lines:S.cart.map(l=>({...l,st:null}))};
  S.orders.push(o);notify('entrepot',`Nouvelle commande #${o.id} de ${by} (${o.lines.length} ligne${o.lines.length>1?'s':''})`);
  S.cart=[];S.cartNote='';st.sh={step:null,v:{},hist:[],q:1};save();st.tab='mine';render();toast(`Commande <b>#${o.id}</b> envoyée. L'entrepôt est prévenu.`);}
function shEditEnd(){const b=S.cartSaved||{cart:[],note:''};S.cart=b.cart;S.cartNote=b.note;S.cartSaved=null;S.editing=null;st.sh={step:null,v:{},hist:[],q:1};}
function shopClick(act,t){
  switch(act){
    case'shpick':shPick(t.dataset.k,t.dataset.v);break;
    case'shback':shBack();break;
    case'shnew':shStart();break;
    case'shq':st.sh.q=Math.max(1,Math.min(50,st.sh.q+(+t.dataset.d)));render();return true;
    case'shadd':{const g=shPool('qty').slice().sort((x,y)=>availOf(y)-availOf(x));let rest=st.sh.q;
      const put=(a,n)=>{const ex=S.cart.find(l=>l.aid===a.id);if(ex)ex.qty+=n;else S.cart.push({aid:a.id,qty:n});};
      g.forEach(a=>{const n=Math.min(availOf(a),rest);if(n>0){put(a,n);rest-=n;}});
      if(rest>0)put(g[0],rest);
      const q=st.sh.q;st.sh={step:null,v:{},hist:[],q:1};save();render();window.scrollTo(0,0);toast(`Ajouté : <b>${q}</b> · ${esc(artName(g[0]))}`);return true;}
    case'shorder':{const a=art(t.dataset.id);st.tab='cmd';shStart({type:a.type,marque:a.marque,modele:a.modele,genre:a.genre});break;}
    case'sqtype':st.sqType=st.sqType===t.dataset.v?'':t.dataset.v;break;
    case'seen':unread().forEach(n=>n.read=true);save();st.tab='mine';break;
    case'oedit':{const o=S.orders.find(x=>x.id===+t.dataset.o);if(!o)return true;
      if(!S.editing)S.cartSaved={cart:S.cart,note:S.cartNote};
      S.editing=o.id;S.cart=o.lines.map(l=>l.aid?{aid:l.aid,qty:l.qty}:{txt:l.txt,qty:l.qty});S.cartNote=o.note||'';st.sh={step:null,v:{},hist:[],q:1};st.tab='cmd';save();break;}
    case'ecancel':shEditEnd();save();break;
    default:return false;}
  render();window.scrollTo(0,0);return true;}

    ${ent?`<button type="button" class="btn primary" data-act="new" data-code="${code}">+ Ranger un nouveau modèle ici</button>`:''}`);}
function locOptions(cur){const groups={};LOCS.forEach(c=>{const z=/^[A-Z]+/.exec(c)[0];(groups[z]=groups[z]||[]).push(c);});

  function renderSizes(){if(!multi)return;readRows();const have=haveHere(),used=new Set(rows.map(r=>r.s));

      <button type="button" class="del" data-fdel="${r.k}" title="Retirer cette ligne" aria-label="Retirer cette ligne">✕</button></div>`).join('');
    $('#f-sizes').innerHTML=html+(n?`<div class="qrows"><div class="qhead m3"><span>Taille</span><span>Couleur</span><span>Quantité</span><span></span></div>${qrows}

    $('#f-save').textContent=n>1?`Enregistrer les ${n} lignes (${tot} pièces)`:'Enregistrer';renderWhere(tot);}
  /* Où ranger ? conseils selon la place libre des racks */

    if(whereSel)whereSel=res.find(r=>r.emp===whereSel.emp&&!!r.moves.length===!!whereSel.moves.length)||null;

      ${res.map((r,i)=>{const on=whereSel?whereSel===r:(cur===r.emp&&!r.moves.length);
        return `<button type="button" class="wopt${on?' on':''}" data-fwhere="${i}"><span class="mono we">${esc(r.emp)}</span><span><b>${esc(locLabel(r.emp))}</b><br><small>${esc(r.why)}</small>${r.moves.length?`<small class="mv">${r.moves.map(m=>`↪ déplacer ${esc(m.label)} (${m.n}) de ${esc(m.from)} vers ${esc(m.to)}`).join('<br>')}</small>`:''}</span><span class="pick">${on?'✓ Choisi':'Choisir'}</span></button>`;}).join('')}
      ${!res.length?`<p class="sub"><b>Pas de place pour tout au même endroit.</b> Utilisez l'onglet <b>Arrivage</b> : il répartit le modèle par groupes de tailles.</p>`:''}

    w._res=res;}
  renderSizes();
  f.addEventListener('click',e=>{
    const wo=e.target.closest('[data-fwhere]');if(wo){const r=$('#f-where')._res[+wo.dataset.fwhere];whereSel=r;$('#f-emp').value=r.emp;renderSizes();return;}
    const z=e.target.closest('[data-fz]');if(z){readRows();const s=z.dataset.fz;if(rows.some(r=>r.s===s))rows=rows.filter(r=>r.s!==s);else rows.push({k:'r'+(++nk),s,c:'',q:1});renderSizes();return;}
    const ad=e.target.closest('[data-fadd]');if(ad){readRows();const last=rows[rows.length-1];const k='r'+(++nk);rows.push({k,s:last?last.s:sizeList()[0],c:'',q:1});renderSizes();const c=f.querySelector(`[data-fc="${k}"]`);if(c)c.focus();return;}

      if(s==='__one'){const i=$('#f-qty');i.value=Math.max(0,Math.min(999,(parseInt(i.value)||0)+d));}

    const b=e.target.closest('[data-ft]');if(!b)return;f.dataset.type=b.dataset.ft;

  $('#f-marque').addEventListener('input',e=>{$('#dl-modeles').innerHTML=modelOptions(sameAs(e.target.value.trim(),S.brands));renderSizes();});
  $('#f-modele').addEventListener('input',renderSizes);

  $('#f-emp').addEventListener('change',()=>{whereSel=null;renderSizes();});
  $('#f-couleur').addEventListener('input',renderSizes);
  $('#f-genre').addEventListener('change',renderSizes);
  f.addEventListener('submit',e=>{e.preventDefault();

    const modele=sameAs($('#f-modele').value.trim(),[...new Set(S.articles.filter(x=>x.marque===marque).map(x=>x.modele))]);if(!modele){$('#f-modele').focus();toast('Indiquez le modèle');return;}

    const known=[...new Set(S.articles.map(x=>x.couleur).filter(Boolean))];

}

/* « noir » est toujours enregistré « Black » */
function fixColor(c){return /^noire?$/i.test(String(c||'').trim())?'Black':c;}
/* Entrée dans un formulaire : passe à la case du dessous au lieu d'enregistrer */
function enterNav(f){
  f.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||e.isComposing)return;const t=e.target;
    if(!(t instanceof HTMLInputElement)||['button','submit','checkbox','radio'].includes(t.type))return;
    e.preventDefault();
    if(t.id==='m-call'){$('#m-apply').click();return;}
    const col=['mc','mqi','fqi'].find(k=>t.dataset[k]!==undefined);
    let next=null;
    if(col){const all=[...f.querySelectorAll(`[data-${col}]`)].filter(x=>!x.closest('.gone'));next=all[all.indexOf(t)+1];}
    else{const all=[...f.querySelectorAll('input:not([type=hidden]),select')].filter(x=>!x.disabled&&x.offsetParent!==null);next=all[all.indexOf(t)+1];}
    const go=n=>{n.focus();if(n.select)try{n.select();}catch(_){}};
    if(!next){t.blur();return;}
    if(col){/* enregistrer d'abord la valeur (la liste peut se redessiner), puis retrouver la case suivante */
      const key=next.dataset[col];t.dispatchEvent(new Event('change',{bubbles:true}));
      const n=[...f.querySelectorAll(`[data-${col}]`)].find(x=>x.dataset[col]===key);if(n)go(n);return;}
    go(next);});}
function colorOpts(){return [...new Set(['Black','Blanc','Gris','Bleu','Rouge','Vert','Rose','Violet','Beige','Kaki',...S.articles.map(x=>x.couleur).filter(Boolean)])].sort((x,y)=>x.localeCompare(y)).map(c=>`<option value="${esc(c)}"></option>`).join('');}

    newIds().forEach((k,i)=>{
      const taille=f.querySelector(`[data-ns="${k}"]`).value;
      const couleur=sameAs(fixColor(f.querySelector(`[data-mc="${k}"]`).value.trim()),known);
      const qty=Math.max(0,Math.min(999,parseInt(f.querySelector(`[data-mqi="${k}"]`).value)||0));
      const same=S.articles.find(x=>x.type===a0.type&&x.marque===marque&&x.modele===modele&&x.genre===$('#m-genre').value&&x.emp===emp&&x.taille===taille&&norm(x.couleur)===norm(couleur));
      if(same){same.qty=Math.min(999,qOf(same)+qty);}
      else S.articles.push({id:'a'+stamp+'n'+i,type:a0.type,marque,modele,genre:$('#m-genre').value,taille,annee:an?parseInt(an)||'':a0.annee,emp,note:'',couleur,serrage:ser!=='__keep'?ser:(a0.serrage||''),qty});
      added++;});
    save();closeSheet();render();
    const kept=list.length-gone.size;
    toast(`${kept} taille${kept>1?'s':''} modifiée${kept>1?'s':''}${added?` · <b>${added} ajoutée${added>1?'s':''}</b>`:''}${gone.size?` · <b>${gone.size} retirée${gone.size>1?'s':''}</b>`:''} · <b>${esc(emp)}</b> · ${esc(marque+' '+modele)}`);});
}

/* ---------- Actions ---------- */
document.addEventListener('click',e=>{
  if(e.target.classList.contains('scrim')){closeSheet();return;}
  const t=e.target.closest('[data-act],[data-tab],[data-role],[data-ftype],[data-fgenre],[data-fsize]');if(!t)return;
  if(t.dataset.fgenre!==undefined){st.fGenre=t.dataset.fgenre;st.focus=null;render();return;}
  if(t.dataset.fsize!==undefined){const v=t.dataset.fsize,i=st.fTailles.indexOf(v);if(i<0)st.fTailles.push(v);else st.fTailles.splice(i,1);st.focus=null;render();return;}
  if(t.dataset.tab){st.tab=t.dataset.tab;if(st.tab!=='plan'){st.focus=null;st.focusOrder=null;}
    if(st.tab==='orders'||st.tab==='mine'){const u=unread();u.forEach(n=>n.read=true);if(u.length)save();}
    st.open=null;render();window.scrollTo(0,0);return;}
  if(t.dataset.role){if(role===t.dataset.role)return;role=t.dataset.role;st.tab=role==='magasin'?'cmd':'search';st.focus=null;st.focusOrder=null;try{localStorage.setItem(KEY+'-role',role);}catch(e){}
    const u=unread();render();if(u.length)toast(`Notification · <b>${esc(u[u.length-1].text)}</b>`,true);else toast(`Vous êtes côté <b>${role==='entrepot'?'Entrepôt':'Magasin'}</b>`);return;}
  if(t.dataset.ftype!==undefined){st.fType=t.dataset.ftype;st.fTailles=[];st.focus=null;render();return;}
  const act=t.dataset.act,id=t.dataset.id,oid=+t.dataset.o;
  if(act==='setname'){S.myName=t.dataset.n;save();render();return;}
  if(role==='magasin'&&shopClick(act,t))return;
  const order=()=>S.orders.find(o=>o.id===oid);
  switch(act){
    case'close':closeSheet();break;
    case'inventaire':inventaireXlsx();break;
    case'dimoveradd':{const e=$('#ovEmp').value,o={L:num($('#ovL').value),P:num($('#ovP').value),H:num($('#ovH').value),note:$('#ovNote').value.trim()};
      if(!o.L&&!o.P&&!o.H){toast('Indiquez au moins une mesure');return;}dims().over[e]=o;save();render();toast(`Mesures de <b>${e}</b> enregistrées`);break;}
    case'dimoverdel':delete dims().over[t.dataset.e];save();render();break;
    case'boxadd':{const b={id:'b'+Date.now().toString(36),type:$('#bxType').value,marque:sameAs($('#bxMarque').value.trim(),S.brands),modele:$('#bxModele').value.trim(),from:$('#bxFrom').value,to:$('#bxTo').value,L:num($('#bxL').value),l:num($('#bxl').value),H:num($('#bxH').value)};
      if(!b.L||!b.l||!b.H){toast('Indiquez longueur, largeur et hauteur');return;}
      if(b.modele){const ms=[...new Set(S.articles.filter(a=>!b.marque||a.marque===b.marque).map(a=>a.modele))];b.modele=sameAs(b.modele,ms);}
      dims().boxes.push(b);save();render();toast('Boîte ajoutée');break;}
    case'boxdel':dims().boxes=dims().boxes.filter(b=>b.id!==t.dataset.id);save();render();break;
    case'arradd':arrSheet(null);break;
    case'arredit':arrSheet(t.dataset.g);break;
    case'arrfrom':arr().from=t.dataset.v;saveLocal();render();break;
    case'arrdel':{const k='ad'+t.dataset.g;if(st.armed!==k){st.armed=k;render();return;}st.armed=null;arr().groups=arr().groups.filter(g=>g.id!==t.dataset.g);saveLocal();render();break;}
    case'arrclr':if(st.armed!=='arrclr'){st.armed='arrclr';render();return;}st.armed=null;arr().groups=[];arr().note='';saveLocal();render();toast('Arrivage effacé');break;
    case'arrok':if(!arr().test&&st.armed!=='arrok'){st.armed='arrok';render();return;}st.armed=null;arrValidate();break;
    case'arrtest':arr().test=!arr().test;st.armed=null;saveLocal();render();toast(arr().test?'<b>Mode test</b> : le stock ne sera pas modifié':'Mode test arrêté : la validation range vraiment');break;
    case'capcalc':{const b=caps().big;S.caps=capsCalc();if(b)S.caps.big=b;}save();render();toast('Capacités recalculées d\'après le stock');break;
    case'export':{const data={app:'entrepot-snow',at:Date.now(),stock:Object.fromEntries(STOCK_KEYS.map(k=>[k,S[k]]))};
      const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));const a=document.createElement('a');
      a.href=url;a.download=`stock-entrepot-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
      toast(`Copie téléchargée : <b>${S.articles.length} articles</b>. Elle est dans le dossier Téléchargements.`);break;}
    case'cloudinit':if(!cloud.on)return;cloud.empty=false;cloud.sent.stock='';cloud.sent.orders=cloud.sent.orders||new Map();cloud.sent.notifs=cloud.sent.notifs||new Map();cloudPush();render();toast(`Stock envoyé en ligne : <b>${S.articles.length} articles</b>`);break;
    case'clear':st.q='';st.fType=st.fGenre=st.fMarque=st.fModele=st.fAnnee=st.fZone=st.fCouleur=st.fSerrage='';st.fTailles=[];render();break;
    case'locate':closeSheet();st.focus=id;st.focusOrder=null;st.tab='plan';render();window.scrollTo(0,0);break;
    case'unfocus':st.focus=null;st.focusOrder=null;render();break;
    case'oplan':st.focus=null;st.focusOrder=oid;st.tab='plan';render();window.scrollTo(0,0);break;
    case'loc':openLoc(t.dataset.code);break;
    case'new':openArt(null,t.dataset.code);break;
    case'edit':openArt(id);break;
    case'more':openArt(null,null,id);break;
    case'model':openModel(id);break;
    case'del':if(st.armed!=='del'+id){st.armed='del'+id;t.classList.add('armed');t.textContent='Confirmer la suppression';return;}
      S.articles=S.articles.filter(a=>a.id!==id);save();closeSheet();render();toast('Article supprimé');break;
    case'cart':{const ex=S.cart.find(l=>l.aid===id);if(ex)ex.qty++;else S.cart.push({aid:id,qty:1});save();closeSheet();render();
      toast(`Ajouté à la demande · <b>quantité à régler dans Commandes</b>`);break;}
    case'crm':S.cart.splice(+t.dataset.i,1);save();render();break;
    case'free':{const v=$('#freeTxt').value.trim();if(!v){$('#freeTxt').focus();return;}S.cart.push({txt:v,qty:Math.max(1,parseInt($('#freeQty').value)||1)});st.sh={step:null,v:{},hist:[],q:1};save();render();window.scrollTo(0,0);break;}
    case'qstep':{const l=S.cart[+t.dataset.i];l.qty=Math.min(50,Math.max(1,l.qty+(+t.dataset.d)));save();render();break;}
    case'send':shopSend();break;
    case'open':st.open=st.open===oid?null:oid;render();break;
    case'lclaim':{const o=order(),i=+t.dataset.i,l=o.lines[i];if(!me()){needName();return;}
      if(l.st==='cours'&&l.by===me())lineSet(o,i,{st:null,by:null});
      else if(!l.st)lineSet(o,i,{st:'cours',by:me(),done:doneOf(l),at:Date.now()},o.status==='demandee'?{status:'prep'}:null);
      break;}
    case'lok':{const o=order(),i=+t.dataset.i,l=o.lines[i];if(!me()){needName();return;}
      if(l.st==='ok'||l.st==='rupture')lineSet(o,i,{st:'cours',by:me()});
      else if(l.st==='cours'){const inp=document.querySelector(`[data-done="${o.id}:${i}"]`);const d=Math.max(0,Math.min(999,parseInt(inp?inp.value:doneOf(l))||0));
        lineSet(o,i,{st:d?'ok':'rupture',done:d,by:me(),at:Date.now()});}
      break;}
    case'lko':{const o=order(),i=+t.dataset.i;lineSet(o,i,{st:'rupture',done:0,by:me(),at:Date.now()});break;}
    case'ldone':{const o=order(),i=+t.dataset.i,l=o.lines[i];lineSet(o,i,{done:Math.max(0,Math.min(999,doneOf(l)+(+t.dataset.d)))});break;}
    case'lunlock':{const k='unl'+oid+':'+t.dataset.i;if(st.armed!==k){st.armed=k;render();return;}st.armed=null;lineSet(order(),+t.dataset.i,{st:null,by:null});break;}
    case'odel':{const k='odel'+oid;if(st.armed!==k){st.armed=k;render();return;}st.armed=null;
      S.orders=S.orders.filter(o=>String(o.id)!==String(oid));S.notifs=S.notifs.filter(n=>!String(n.text||'').includes('#'+oid+' '));
      if(st.open==oid)st.open=null;save();render();toast(`Commande #${esc(String(oid))} supprimée`);break;}
    case'ost':{const o=order();o.status=t.dataset.v;
      if(o.status==='prete'){const asked=o.lines.reduce((x,l)=>x+l.qty,0),prepd=o.lines.reduce((x,l)=>x+(l.st==='ok'?doneOf(l):0),0);
        /* retire du stock les lignes servies (une seule fois par commande) */
        let out=0,libre=0;
        o.readyAt=o.readyAt||Date.now();
        if(!o.deducted){o.lines.filter(l=>l.st==='ok').forEach(l=>{const a=l.aid&&art(l.aid);if(a){const before=qOf(a);a.qty=Math.max(0,before-doneOf(l));out+=before-a.qty;}else libre++;});o.deducted=true;}
        notify('magasin',`Commande #${o.id} prête : ${prepd} préparée${prepd>1?'s':''} sur ${asked} demandée${asked>1?'s':''}${prepd<asked?' (il en manque '+(asked-prepd)+')':''}`);
        toast(`Commande <b>#${o.id}</b> prête. Le magasin est prévenu.<br>Stock mis à jour : <b>−${out} pièce${out>1?'s':''}</b>${libre?` · ${libre} demande${libre>1?'s':''} libre${libre>1?'s':''} à retirer à la main`:''}`);}
      if(o.status==='recue')toast(`Commande <b>#${o.id}</b> reçue`);
      save();render();break;}
    case'rmtag':S[t.dataset.k].splice(+t.dataset.i,1);save();render();break;
    case'addtag':{const k=t.dataset.k,inp=$('#add-'+k),v=inp.value.trim();if(!v){inp.focus();return;}if(!S[k].includes(v)){S[k].push(v);if(k==='brands')S[k].sort((x,y)=>x.localeCompare(y));if(k==='sizesB'||k==='sizesS')S[k].sort((x,y)=>sizeRankStr(x)-sizeRankStr(y));}save();render();break;}
    case'reset':lockSheet('reset');break;
    case'wipe':lockSheet('wipe');break;
    case'pwchange':lockSheet('pwchange');break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){st.q=t.value;st.focus=null;const pos=t.selectionStart;render();const q=$('#q');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}}
  else if(t.id==='sq'){st.sq=t.value;const pos=t.selectionStart;render();const q=$('#sq');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}}
  else if(t.id==='cartNote'){S.cartNote=t.value;save();}
  else if(t.id==='myName'){S.myName=t.value;save();}
  else if(t.id==='arrNote'){arr().note=t.value;saveLocal();}
  else if(t.dataset&&t.dataset.cap){const v=parseInt(t.value);if(t.dataset.cap==='big'){if(v>0){caps().big=Math.min(500,v);save();}}else{const[g,ty]=t.dataset.cap.split(':');if(v>0){caps()[g][ty]=Math.min(999,v);save();}}}
  else if(t.dataset&&t.dataset.done){const [oid,i]=t.dataset.done.split(':');const o=S.orders.find(x=>String(x.id)===oid);if(o){o.lines[+i].done=Math.max(0,Math.min(999,parseInt(t.value)||0));saveLocal();}}
  else if(t.dataset.qty!==undefined){S.cart[+t.dataset.qty].qty=Math.max(1,parseInt(t.value)||1);save();}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.dim){const[g,k]=t.dataset.dim.split(':');const o=dims().locs[g]=dims().locs[g]||{};o[k]=k==='pose'?(t.value||null):num(t.value);save();return;}
  if(t.id==='bxType'){st.boxType=t.value;render();return;}
  if(t.dataset&&t.dataset.arrchunk!==undefined){const g=arr().groups.find(x=>x.id===t.dataset.arrchunk);if(g){g.over=g.over||{};
    t.dataset.sizes.split('|').filter(Boolean).forEach(z=>{if(t.value)g.over[z]=t.value;else delete g.over[z];});saveLocal();render();}return;}
  if(t.id==='importFile'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const sk=d&&d.stock;
      if(!sk||!Array.isArray(sk.articles))throw new Error('format');
      STOCK_KEYS.forEach(k=>{if(sk[k]!==undefined)S[k]=sk[k];});
      if(cloud.on){cloud.empty=false;cloud.sent.stock='';cloud.sent.orders=cloud.sent.orders||new Map();cloud.sent.notifs=cloud.sent.notifs||new Map();}
      save();render();toast(`Copie chargée : <b>${S.articles.length} articles</b>${cloud.on?' · envoyés en ligne':''}`);}
    catch(err){toast("Ce fichier n'est pas une copie du stock.");}};r.readAsText(t.files[0]);t.value='';return;}
  const map={fMarque:'fMarque',fModele:'fModele',fAnnee:'fAnnee',fZone:'fZone',fCouleur:'fCouleur',fSerrage:'fSerrage'};
  if(map[t.id]){st[map[t.id]]=t.value;if(t.id==='fMarque')st.fModele='';st.focus=null;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.id==='freeTxt'){e.preventDefault();document.querySelector('[data-act="free"]').click();}
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('add-')){e.preventDefault();e.target.nextElementSibling;document.querySelector(`[data-act="addtag"][data-k="${e.target.id.slice(4)}"]`).click();}});
/* ---------- Synchro en ligne (Firebase) : le stock, les commandes et les avis passent d'un téléphone à l'autre ---------- */
const FB_CONFIG={apiKey:"AIzaSyDDC3AhQPbLAy8hGg9txd_kooWxOM5UrPk",authDomain:"entrepotsnow.firebaseapp.com",projectId:"entrepotsnow",
  storageBucket:"entrepotsnow.firebasestorage.app",messagingSenderId:"754342580173",appId:"1:754342580173:web:20ee46db9b4aab080c7e84"};
const FBU='https://www.gstatic.com/firebasejs/10.12.2/';
const STOCK_KEYS=['articles','brands','sizesB','sizesF','sizesS','demo','caps','dims','lock'];
/* ?ns=test : bac à sable pour les essais, sans toucher aux vraies données */
const NS=(()=>{try{return (new URLSearchParams(location.search).get('ns')||'').replace(/[^a-z0-9]/gi,'');}catch(e){return'';}})();
const C=n=>NS?NS+'_'+n:n;
const cloud={on:false,fs:null,db:null,pending:false,sent:{stock:null,orders:null,notifs:null}};
const stockJson=()=>JSON.stringify(Object.fromEntries(STOCK_KEYS.map(k=>[k,S[k]])));
function setSync(state,txt){const e=$('#sync');if(!e)return;e.dataset.s=state;e.textContent=txt;}
/* ne pas redessiner sous les doigts de quelqu'un qui tape */
function softRender(){const ae=document.activeElement;
  if(ae&&$('#view').contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){cloud.pending=true;return;}render();}
document.addEventListener('focusout',()=>{if(!cloud.pending)return;setTimeout(()=>{const ae=document.activeElement;
  if(!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))){cloud.pending=false;render();}},60);});
function cloudPush(){
  if(!cloud.on)return;const {fs,db}=cloud;
  if(cloud.sent.stock!==null&&role==='entrepot'){const j=stockJson();
    if(j!==cloud.sent.stock){cloud.sent.stock=j;fs.setDoc(fs.doc(db,C('cfg'),'stock'),{json:j,at:Date.now()}).catch(cloudErr);}}
  [['orders',S.orders],['notifs',S.notifs]].forEach(([col,arr])=>{const sent=cloud.sent[col];if(!sent)return;
    const seen=new Set();
    arr.forEach(x=>{const id=String(x.id).replace('.','_'),j=JSON.stringify(x);seen.add(id);
      if(sent.get(id)!==j){sent.set(id,j);fs.setDoc(fs.doc(db,C(col),id),{json:j,at:Date.now()}).catch(cloudErr);}});
    [...sent.keys()].forEach(id=>{if(!seen.has(id)){sent.delete(id);fs.deleteDoc(fs.doc(db,C(col),id)).catch(cloudErr);}});});}
function cloudErr(e){console.warn('Synchro',e);setSync('off','Hors ligne');}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
async function cloudStart(){
  if(location.protocol==='file:'){setSync('off','Fichier local, pas en ligne');return;}
  setSync('wait','Connexion…');
  const late=setTimeout(()=>{if(!cloud.on)setSync('off','Hors ligne');},15000);
  try{
    const [app,auth,fs]=await Promise.all([import(FBU+'firebase-app.js'),import(FBU+'firebase-auth.js'),import(FBU+'firebase-firestore.js')]);
    const a=app.initializeApp(FB_CONFIG);
    await auth.signInAnonymously(auth.getAuth(a));
    const db=fs.getFirestore(a);Object.assign(cloud,{fs,db,on:true});
    const unreadIds=()=>new Set(unread().map(n=>String(n.id)));
    /* Stock : écrit par l'entrepôt. La première fois, l'entrepôt envoie ce qu'il a déjà sur l'appareil. */
    fs.onSnapshot(fs.doc(db,C('cfg'),'stock'),snap=>{
      if(!snap.exists()){cloud.empty=true;softRender();return;}
      cloud.empty=false;
      const j=snap.data().json;if(j===cloud.sent.stock)return;
      cloud.sent.stock=j;Object.assign(S,JSON.parse(j));saveLocal();softRender();setSync('on','En ligne');
    },cloudErr);
    [['orders','orders'],['notifs','notifs']].forEach(([col,key])=>{
      fs.onSnapshot(fs.collection(db,C(col)),qs=>{
        const m=new Map();qs.forEach(d=>m.set(d.id,d.data().json));
        const first=!cloud.sent[col];
        if(first&&!m.size&&cloud.empty&&S[key].length)return; /* base vide : on attend le bouton « Envoyer » */
        const before=unreadIds();
        cloud.sent[col]=m;
        S[key]=[...m.values()].map(x=>JSON.parse(x));
        if(key==='orders')S.orders.sort((x,y)=>x.at-y.at);
        saveLocal();softRender();setSync('on','En ligne');
        if(key==='notifs'&&!first){const fresh=unread().filter(n=>!before.has(String(n.id)));
          if(fresh.length){toast(`🔔 <b>${esc(fresh[fresh.length-1].text)}</b>`,true);try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}}
      },cloudErr);});
  }catch(e){console.warn('Synchro indisponible',e);cloud.on=false;setSync('off','Hors ligne');}
}
window.addEventListener('offline',()=>setSync('off','Hors ligne'));
window.addEventListener('online',()=>{if(cloud.on)setSync('on','En ligne');});
render();
cloudStart();
</script>
